const COUNT_ITEMS = [['🍎','Äpfel'],['🍓','Erdbeeren'],['⭐','Sterne'],['🎈','Luftballons'],['🐟','Fische'],['🐞','Käfer']];
const LETTERS = 'ABDEFGHIKLMNOPRSTWZ'.split('');

const WORDS = [
  ['🍎','Apfel'], ['🍌','Banane'], ['🤖','Roboter'], ['🚗','Auto'], ['🐭','Maus'], ['☀️','Sonne'],
  ['🐘','Elefant'], ['🐶','Hund'], ['🐱','Katze'], ['🦁','Löwe'], ['🐴','Pferd'], ['🍅','Tomate'],
  ['☁️','Wolke'], ['🦓','Zebra'], ['🐟','Fisch'], ['🦔','Igel'], ['⚽','Ball'], ['🐉','Drache'],
  ['🎸','Gitarre'], ['👃','Nase'], ['🔑','Schlüssel'], ['🌙','Mond'], ['🍓','Erdbeere'], ['🐸','Frosch'],
];

// Antwortzahlen rund um die richtige Lösung (schwerer als zufällige Zahlen)
function nearOptions(correct, count, min, max){
  const pool = [], span = Math.max(5, count);
  for (let v = Math.max(min, correct - span); v <= Math.min(max, correct + span); v++) if (v !== correct) pool.push(v);
  pool.sort(() => Math.random() - .5);
  const arr = [correct, ...pool.slice(0, count - 1)].sort((a, b) => a - b);
  return { options: arr.map(String), correct: arr.indexOf(correct) };
}

function numOptions(correct, max, count){
  const pool = [];
  for (let v = 1; v <= max; v++) if (v !== correct) pool.push(v);
  pool.sort(() => Math.random() - .5);
  const arr = [correct, ...pool.slice(0, count - 1)].sort(() => Math.random() - .5);
  return { options: arr.map(String), correct: arr.indexOf(correct) };
}

function makeTask(type, mult){
  const M = mult || 1;   // 2 = doppelt so viele Antwortmöglichkeiten (Welt 6)
  if (type === 'count' || type === 'count2'){
    const hard = type === 'count2';
    const n = Math.floor(rnd(hard ? 5 : 3, hard ? 10 : 7));
    const [emo, name] = pick(COUNT_ITEMS);
    const o = numOptions(n, hard ? 10 : 8, 6 * M);
    return { kind: 'count', emo, n,
      question: 'Wie viele ' + name + '?',
      spoken: 'Wie viele ' + name + ' siehst du? Wähle die richtige Zahl!',
      options: o.options, correct: o.correct };
  }
  if (type === 'add' || type === 'add2'){
    const hard = type === 'add2';
    const a = Math.floor(rnd(1, hard ? 6 : 4)), b = Math.floor(rnd(1, hard ? 6 : 4));
    const [emo] = pick(COUNT_ITEMS);
    const o = numOptions(a + b, hard ? 11 : 8, 6 * M);
    return { kind: 'add', emo, a, b,
      question: a + ' + ' + b + ' = ?',
      spoken: 'Wie viel ist ' + a + ' plus ' + b + '?',
      options: o.options, correct: o.correct };
  }
  if (type === 'pattern'){
    const pool = ['🍎', '⭐', '🎈', '🐟', '🌙', '🍄'];
    const a = pick(pool);
    let b = pick(pool); while (b === a) b = pick(pool);
    const seqFull = pick([[a,b,a,b,a,b,a], [a,a,b,b,a,a,b], [a,b,b,a,b,b,a]]);
    const seq = seqFull.slice(0, 6), answer = seqFull[6];
    let c = pick(pool); while (c === a || c === b) c = pick(pool);
    let d = pick(pool); while (d === a || d === b || d === c) d = pick(pool);
    const options = [a, b, c, d].sort(() => Math.random() - .5);
    return { kind: 'pattern', seq,
      question: 'Was kommt als Nächstes?',
      spoken: 'Schau dir das Muster genau an! Was kommt als Nächstes?',
      options, correct: options.indexOf(answer) };
  }
  if (type === 'oddone'){
    const cats = [['🍎','🍓','🍌','🍇'], ['🐶','🐱','🐭','🐰'], ['🚗','🚌','🚒','🚜'], ['👕','👖','🧢','🧦']];
    const ci = Math.floor(rnd(0, cats.length));
    let cj = Math.floor(rnd(0, cats.length)); while (cj === ci) cj = Math.floor(rnd(0, cats.length));
    const same = [...cats[ci]].sort(() => Math.random() - .5).slice(0, 3);
    const odd = pick(cats[cj]);
    const options = [...same, odd].sort(() => Math.random() - .5);
    return { kind: 'oddone',
      question: 'Was passt nicht dazu?',
      spoken: 'Schau genau! Welches Bild passt nicht zu den anderen?',
      options, correct: options.indexOf(odd) };
  }
  if (type === 'memory'){
    const pool = ['🍎', '⭐', '🎈', '🐟', '🌙', '🍄', '🐞', '🍓'];
    const memo = [];
    while (memo.length < 3){ const e = pick(pool); if (!memo.includes(e)) memo.push(e); }
    const idx = Math.floor(rnd(0, 3));
    const words = ['links', 'in der Mitte', 'rechts'];
    let extra = pick(pool); while (memo.includes(extra)) extra = pick(pool);
    const options = [...memo, extra].sort(() => Math.random() - .5);
    return { kind: 'memory', memo,
      question: 'Welches Bild war ' + words[idx] + '?',
      spoken: 'Merk dir die drei Bilder gut!',
      spokenAsk: 'Welches Bild war ' + words[idx] + '?',
      options, correct: options.indexOf(memo[idx]) };
  }
  if (type === 'add3' || type === 'sub2'){
    // Kopfrechnen bis 20, ohne Bildchen
    let a, b, res, sym;
    if (type === 'add3'){ a = Math.floor(rnd(5, 13)); b = Math.floor(rnd(3, Math.min(10, 21 - a))); res = a + b; sym = '+'; }   // Ergebnis höchstens 20
    else { a = Math.floor(rnd(11, 21)); b = Math.floor(rnd(2, 10)); res = a - b; sym = '−'; }
    const o = nearOptions(res, 6 * M, 1, 20);
    return { kind: 'calc', a, b, sym,
      question: 'Kopfrechnen! Wie viel ist das?',
      spoken: 'Kopfrechnen! Wie viel ist ' + a + (sym === '+' ? ' plus ' : ' minus ') + b + '?',
      options: o.options, correct: o.correct };
  }
  if (type === 'numseq'){
    // Zahlenreihe fortsetzen
    const kind = pick(['up1', 'up2', 'up10', 'down1', 'up5']);
    let start, step;
    if (kind === 'up1'){ start = Math.floor(rnd(1, 12)); step = 1; }
    else if (kind === 'up2'){ start = pick([1, 2, 3, 4, 6, 8]); step = 2; }
    else if (kind === 'up5'){ start = pick([5, 10]); step = 5; }
    else if (kind === 'up10'){ start = 10; step = 10; }
    else { start = Math.floor(rnd(7, 13)); step = -1; }
    const seq = [0, 1, 2, 3].map(i => start + i * step);
    const answer = start + 4 * step;
    const o = nearOptions(answer, 6 * M, 1, 99);
    return { kind: 'numseq', seq,
      question: 'Wie geht es weiter?',
      // kein Punkt direkt nach einer Zahl, sonst liest die Sprachausgabe „vierzigste“
      spoken: 'Schau dir die Zahlenreihe an: ' + seq.join(', ') + ', und dann? Welche Zahl kommt als Nächstes?',
      options: o.options, correct: o.correct };
  }
  if (type === 'firstletter'){
    const [emo, word] = pick(WORDS);
    const target = word[0];
    const set = new Set([target]);
    while (set.size < 4 * M) set.add(pick(LETTERS));
    const arr = [...set].sort(() => Math.random() - .5);
    return { kind: 'firstletter', emo, word, target,
      // im Text den ersten Buchstaben verstecken (sonst steht die Lösung schon da); vorgelesen wird das ganze Wort
      question: 'Mit welchem Buchstaben beginnt „?' + word.slice(1) + '“?',
      spoken: 'Mit welchem Buchstaben beginnt das Wort ' + word + '?',
      options: arr, correct: arr.indexOf(target) };
  }
  if (type === 'sub'){
    const a = Math.floor(rnd(4, 10));
    const b = Math.floor(rnd(1, a - 1));
    const [emo] = pick(COUNT_ITEMS);
    const o = numOptions(a - b, 9, 6 * M);
    return { kind: 'sub', emo, a, b,
      question: a + ' − ' + b + ' = ?',
      spoken: 'Wie viel ist ' + a + ' minus ' + b + '?',
      options: o.options, correct: o.correct };
  }
  // letter
  const target = pick(LETTERS);
  const set = new Set([target]);
  while (set.size < 4 * M) set.add(pick(LETTERS));
  const arr = [...set].sort(() => Math.random() - .5);
  return { kind: 'letter', target,
    question: 'Finde das ' + target + '!',
    spoken: 'Finde den Buchstaben ' + target + '!',
    options: arr, correct: arr.indexOf(target) };
}

function startQuestionLock(text, prefix){
  // Antworten bleiben gesperrt, bis die Frage fertig vorgelesen wurde
  quiz.sel = -1;
  quiz.awaitSpeech = true;
  quiz.minT = 1.2;        // Mindest-Sperre, falls Sprachausgabe sofort endet
  quiz.failsafeT = 8;     // Notfall-Freigabe, falls kein Sprach-Ende gemeldet wird
  const q = quiz;
  speak((prefix || '') + text, () => { if (quiz === q) quiz.awaitSpeech = false; });
}

function quizCols(n){ return n >= 8 ? 4 : n === 6 ? 3 : 2; }

function openChest(chest){
  const task = makeTask(chest.task, chest.double ? 2 : 1);
  quiz = { chest, task, sel: -1, fails: 0, penaltyT: 0,
           penaltySpeech: false, penaltyFailsafeT: 0,
           awaitSpeech: false, minT: 0, failsafeT: 0,
           phase: task.kind === 'memory' ? 'memorize' : 'ask',
           memT: 3.5, shake: 0, doneT: 0 };
  state = 'quiz'; stateT = 0;
  sfx('chest');
  if (task.kind === 'memory') speak(task.spoken);
  else startQuestionLock(task.spoken);
}

const REWARDS = {
  sword2:  { icon: '🗡️', apply(){ player.sword = 2; }, text: 'Steinschwert!', spoken: 'Super! Du hast das Steinschwert bekommen!' },
  sword3:  { icon: '⚔️', apply(){ player.sword = 3; }, text: 'Goldschwert!', spoken: 'Wow! Das Goldschwert gehört dir!' },
  sword4:  { icon: '💎', apply(){ player.sword = 4; }, text: 'Diamantschwert!', spoken: 'Unglaublich! Das Diamantschwert! Das stärkste Schwert!' },
  shield:  { icon: '🛡️', apply(){ player.hasShield = true; player.shieldCharge = player.shieldMax; }, text: 'Schild!', spoken: 'Toll! Ein Schild! Er blockt einen Treffer!' },
  heartup: { icon: '❤️', apply(){ player.maxHearts++; player.hearts = player.maxHearts; }, text: 'Extra-Herz!', spoken: 'Klasse! Ein Extraherz für dich!' },
  arrows10:{ icon: '🏹', apply(){ player.arrows = 10; }, text: 'Köcher aufgefüllt!', spoken: 'Toll! Dein Köcher ist wieder voll mit Pfeilen!' },
  speed:   { icon: '⚡', apply(){ player.speedMult += 0.15; }, text: 'Turbo! +15 % Tempo', spoken: 'Turbo! Dein Auto fährt jetzt 15 Prozent schneller!' },
};

function updateQuiz(dt){
  quiz.shake = Math.max(0, quiz.shake - dt * 3);
  if (quiz.phase !== 'correct' && inp.escP){
    quiz.chest.cd = 1.2; quiz = null; state = 'play'; return;
  }
  if (quiz.phase === 'memorize'){
    quiz.memT -= dt;
    if (quiz.memT <= 0){
      quiz.phase = 'ask';
      startQuestionLock(quiz.task.spokenAsk);
    }
    return;
  }
  if (quiz.phase === 'correct'){
    quiz.doneT += dt;
    if (quiz.doneT > 2.2){
      quiz.chest.open = true;
      const r = REWARDS[quiz.chest.reward];
      r.apply();
      if (player.hasShield) player.shieldCharge = player.shieldMax;
      showBanner(r.icon + ' ' + r.text, '', 2.5);
      burst(player.x + 16, player.y, '#ffd24a', 20, 260);
      quiz = null; state = 'play';
    }
    return;
  }

  // Denkpause nach falscher Antwort — endet erst, wenn Timer UND Ansage vorbei sind
  if (quiz.penaltyT > 0 || quiz.penaltySpeech){
    quiz.penaltyT = Math.max(0, quiz.penaltyT - dt);
    quiz.penaltyFailsafeT = Math.max(0, quiz.penaltyFailsafeT - dt);
    if (quiz.penaltyFailsafeT <= 0) quiz.penaltySpeech = false;
    return;
  }
  if (quiz.fails >= 2){
    // nach 2 Fehlern: neue Frage gleichen Typs
    quiz.task = makeTask(quiz.chest.task, quiz.chest.double ? 2 : 1);
    quiz.fails = 0;
    if (quiz.task.kind === 'memory'){
      quiz.phase = 'memorize'; quiz.memT = 3.5; quiz.sel = -1;
      speak('Hier kommt eine neue Frage! ' + quiz.task.spoken);
    } else {
      startQuestionLock(quiz.task.spoken, 'Hier kommt eine neue Frage! ');
    }
    return;
  }

  // Sperre, bis die Frage fertig vorgelesen wurde
  quiz.minT = Math.max(0, quiz.minT - dt);
  quiz.failsafeT = Math.max(0, quiz.failsafeT - dt);
  if (quiz.failsafeT <= 0) quiz.awaitSpeech = false;
  if (quiz.awaitSpeech || quiz.minT > 0) return;

  const n = quiz.task.options.length, cols = quizCols(n);
  const rows = Math.ceil(n / cols);
  const selMove = (dx, dy) => {
    if (quiz.sel < 0){ quiz.sel = 0; sfx('select'); return; }
    let row = Math.floor(quiz.sel / cols), col = quiz.sel % cols;
    col = (col + dx + cols) % cols;
    row = (row + dy + rows) % rows;
    quiz.sel = row * cols + col;
    sfx('select');
  };
  if (inp.leftP) selMove(-1, 0);
  else if (inp.rightP) selMove(1, 0);
  else if (inp.upP) selMove(0, -1);
  else if (inp.downP) selMove(0, 1);

  if (inp.quizP && quiz.sel >= 0){
    if (quiz.sel === quiz.task.correct){
      quiz.phase = 'correct'; quiz.doneT = 0;
      sfx('right');
      speak(REWARDS[quiz.chest.reward].spoken);
    } else {
      quiz.fails++;
      quiz.shake = 1; quiz.sel = -1;
      quiz.penaltyT = 3;
      quiz.penaltySpeech = true;
      quiz.penaltyFailsafeT = 10;
      sfx('wrong');
      const q = quiz;
      speak(quiz.fails >= 2 ? 'Das war leider falsch. Gleich kommt eine neue Frage!'
                            : 'Fast! Denk noch einmal in Ruhe nach!',
            () => { if (quiz === q) quiz.penaltySpeech = false; });
    }
  }
}

// ---------- Spieler ----------
function hurtPlayer(dmg, fromX, knock){
  if (player.invuln > 0) return;
  const k = knock || 1;
  const dir = player.x + player.w / 2 < fromX ? -1 : 1;
  player.vx = dir * 260 * k; player.vy = -320 * Math.min(k, 1.3);
  player.invuln = 1.3; player.cling = 0;
  if (player.hasShield && player.shieldCharge > 0){
    player.shieldCharge = 0;
    sfx('block'); shake(1.5, 0.15);
    addFloater(player.x, player.y - 20, '🛡️ Block!', '#7fd0ff');
    return;
  }
  player.hearts -= dmg;
  sfx('hurt'); shake(3, 0.3);
  burst(player.x + 16, player.y + 20, '#ff5566', 12, 220);
  if (player.hearts <= 0){
    player.hearts = 0;
    state = 'dead'; stateT = 0;
    sfx('death'); shake(5, 0.5);
    speak('Ohje! Versuch es gleich nochmal!');
  }
}

function respawn(){
  player.x = world.checkpoint.x; player.y = world.checkpoint.y - 60;
  if (world.mode === 'drive'){
    player.lane = world.checkpoint.lane == null ? 2 : world.checkpoint.lane;
    player.y = world.lanes[player.lane] - player.h / 2;
    player.driveV = 0; world.traffic = []; world.zapT = 0;
  }
  player.vx = 0; player.vy = 0; player.cling = 0;
  player.hearts = player.maxHearts;
  if (player.hasShield) player.shieldCharge = player.shieldMax;
  player.invuln = 2;
  startTransition('fade'); sfx('respawn');
}

function updatePlayer(dt){
  const p = player;
  p.animT += dt;
  p.invuln = Math.max(0, p.invuln - dt);
  p.attackT = Math.max(0, p.attackT - dt);
  p.coyote = Math.max(0, p.coyote - dt);
  p.jumpBuf = Math.max(0, p.jumpBuf - dt);
  const car = p.form === 'car';
  const walls = world.walls || [];
  const wallAt = dir => {
    const probe = { x: dir > 0 ? p.x + p.w : p.x - 3, y: p.y + 3, w: 3, h: p.h - 6 };
    for (const wl of walls) if (overlap(probe, wl)) return wl;
    return null;
  };

  const wish = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  const clingStart = p.cling !== 0;

  // Wand-Klettern (nur der Wand-Hochkletterer in Welt 5)
  if (p.cling){
    const wl = wallAt(p.cling);
    if (!wl){ p.cling = 0; }
    else {
      p.facing = p.cling;
      p.vx = 0;
      const climb = (inp.up ? -1 : 0) + (inp.down ? 1 : 0);
      p.vy = climb * CLIMB;
      p.climbT += Math.abs(climb) * dt;
      p.onGround = false;
      if (climb < 0 && p.y + p.h <= wl.y + 10){
        // oben angekommen: auf die Wand hochziehen
        p.x = p.cling > 0 ? wl.x + 2 : wl.x + wl.w - p.w - 2;
        p.y = wl.y - p.h; p.vy = 0; p.cling = 0; p.onGround = true; p.airJumped = false;
        burst(p.x + p.w / 2, p.y + p.h, '#9fe8ff', 8, 140);
        sfx('grab');
      } else if (inp.jumpBtnP){
        // von der Wand abspringen
        p.vx = -p.cling * 330; p.vy = JUMPV * 0.95; p.cling = 0; p.airJumped = false; p.jumpBuf = 0;
        burst(p.x + p.w / 2, p.y + p.h / 2, '#9fe8ff', 8, 160);
        sfx('jump');
      } else if (wish === -p.cling){
        // von der Wand weg drücken = loslassen
        p.cling = 0; p.vx = wish * MOVE * 0.5;
      }
    }
  }

  if (!p.cling){
    // Laufen
    if (wish !== 0){ p.facing = wish; }
    p.vx = lerp(p.vx, wish * MOVE, 1 - Math.pow(0.0005, dt));

    // Springen (mit Coyote-Zeit + Puffer, kindgerecht großzügig)
    if (!clingStart){
      if (inp.jumpP) p.jumpBuf = 0.15;
      if (p.jumpBuf > 0 && (p.onGround || p.coyote > 0)){
        p.vy = JUMPV; p.onGround = false; p.coyote = 0; p.jumpBuf = 0;
        p.airJumped = false;
        sfx('jump');
      } else if (inp.jumpP && !p.onGround && p.coyote <= 0 && p.hasWings && !p.airJumped){
        // Doppelsprung
        p.airJumped = true; p.vy = JUMPV * 0.92; p.jumpBuf = 0;
        burst(p.x + p.w / 2, p.y + p.h, '#bfefff', 10, 150);
        sfx('djump');
      }
    }
    if (!inp.jump && p.vy < -200) p.vy = -200; // variable Sprunghöhe
  }

  // Schlagen
  if (inp.atkP && p.attackT <= 0){
    p.attackT = 0.26; p.swingId++;
    sfx('swing');
  }

  // Bogen schießen
  p.bowCd = Math.max(0, p.bowCd - dt);
  if (inp.bowP && p.hasBow && p.bowCd <= 0){
    if (p.arrows > 0){
      p.arrows--; p.bowCd = 0.45;
      world.arrows.push({ x: p.x + p.w / 2 + p.facing * 18, y: p.y + 14, vx: p.facing * 560, t: 1.4 });
      sfx('bow');
    } else {
      p.bowCd = 0.4;
      sfx('wrong');
      addFloater(p.x, p.y - 20, 'Keine Pfeile!', '#ff9a9a');
    }
  }

  // Physik
  if (!p.cling){
    p.vy += GRAV * dt;
    p.vy = Math.min(p.vy, 900);
  }
  const prevX = p.x;
  p.x += p.vx * dt;
  p.x = clamp(p.x, 0, world.w - p.w);

  // seitlich gegen Wände
  let hitWall = 0;
  for (const wl of walls){
    if (!overlap(p, wl)) continue;
    if (prevX + p.w <= wl.x + 0.5){ p.x = wl.x - p.w; hitWall = 1; }
    else if (prevX >= wl.x + wl.w - 0.5){ p.x = wl.x + wl.w; hitWall = -1; }
  }

  const prevBottom = p.y + p.h, prevTop = p.y;
  p.y += p.vy * dt;

  const wasGround = p.onGround;
  p.onGround = false;
  if (p.vy >= 0){
    for (const pl of world.platforms){
      if (p.x + p.w > pl.x + 4 && p.x < pl.x + pl.w - 4 &&
          prevBottom <= pl.y + 8 && p.y + p.h >= pl.y && p.y + p.h <= pl.y + pl.h + 18){
        p.y = pl.y - p.h; p.vy = 0; p.onGround = true; p.airJumped = false;
        break;
      }
    }
    // Oberseiten der Wände sind begehbar
    if (!p.onGround) for (const wl of walls){
      if (p.x + p.w > wl.x + 4 && p.x < wl.x + wl.w - 4 &&
          prevBottom <= wl.y + 8 && p.y + p.h >= wl.y && p.y + p.h <= wl.y + wl.h + 18){
        p.y = wl.y - p.h; p.vy = 0; p.onGround = true; p.airJumped = false;
        break;
      }
    }
  } else {
    // Kopf gegen die Unterseite einer Wand
    for (const wl of walls){
      if (p.x + p.w > wl.x + 2 && p.x < wl.x + wl.w - 2 && prevTop >= wl.y + wl.h - 2 && p.y < wl.y + wl.h){
        p.y = wl.y + wl.h; p.vy = 0;
      }
    }
  }
  if (wasGround && !p.onGround) p.coyote = 0.12;
  if (p.onGround) p.cling = 0;

  // An der Wand festhalten: in der Luft automatisch, am Boden nur beim Hoch-Drücken
  if (car && hitWall && !p.cling && (!p.onGround || inp.up)){
    p.cling = hitWall; p.vx = 0; p.vy = 0; p.onGround = false;
    p.facing = hitWall; p.airJumped = false; p.climbT = 0;
    burst(hitWall > 0 ? p.x + p.w : p.x, p.y + p.h / 2, '#9fe8ff', 6, 120);
    sfx('grab');
  }

  // Runterfallen
  if (p.y > world.killY){
    sfx('hurt');
    player.invuln = 0;
    hurtPlayer(1, p.x);
    if (state !== 'dead') respawn();
  }
}

function swordHitbox(){
  const p = player;
  if (p.attackT < 0.08 || p.attackT > 0.22) return null;
  if (p.form === 'car'){
    // Kopfschwert: schlägt über dem Auto und nach vorne
    return { x: p.facing > 0 ? p.x + 8 : p.x + p.w - 8 - 160, y: p.y - 125, w: 160, h: p.h + 125 };
  }
  return { x: p.facing > 0 ? p.x + p.w - 4 : p.x - 42, y: p.y - 4, w: 46, h: p.h + 8 };
}

// ---------- Welt 6: Fahr-Modus ----------
function driveHit(dmg, fromX){
  if (player.invuln > 0) return false;
  hurtPlayer(dmg, fromX, 0.2);
  player.vx = 0; player.vy = 0; player.driveV = 0;
  // Der Kopf der Spielfigur taucht in einem anderen Fenster auf
  let s = player.seat;
  while (s === player.seat) s = Math.floor(rnd(0, 3));
  player.seat = s;
  sfx('crash'); shake(5, 0.4);
  return true;
}

function spawnTrafficCar(seg){
  const lane = Math.floor(rnd(0, 4));
  const oncoming = lane < 2;
  const type = Math.random() < 0.25 ? 'truck' : 'car';
  const w = type === 'truck' ? 150 : 84, h = type === 'truck' ? 50 : 42;
  const x = camX + W + 80 + rnd(0, 160);
  if (x + w > seg.x1 - 40) return;                       // Verkehr bleibt auf seiner Strecke
  for (const c of world.traffic) if (c.lane === lane && Math.abs(c.x - x) < 300) return;
  const vx = oncoming ? -rnd(seg.vMin, seg.vMax) : rnd(90, 170);
  world.traffic.push({ x, y: world.lanes[lane] - h + 6, w, h, vx, lane, type, seg,
    color: pick(['#3d7be0', '#f2b134', '#5cb85c', '#9b59b6', '#ecf0f1', '#e67e22', '#1abc9c']) });
}

function updateTraffic(dt){
  const p = player;
  const seg = world.segments.find(s => p.x >= s.x0 && p.x < s.x1);
  if (seg && seg.type === 'road'){
    world.spawnT -= dt;
    if (world.spawnT <= 0){ world.spawnT = rnd(seg.gapMin, seg.gapMax); spawnTrafficCar(seg); }
  }
  for (const c of world.traffic){
    c.x += c.vx * dt;
    if (c.x + c.w < c.seg.x0 || c.x > c.seg.x1 || c.x + c.w < camX - 300 || c.x > camX + W + 900) c.dead = true;
    if (!c.dead && overlap(c, p) && p.invuln <= 0){
      if (driveHit(DRIVE_DMG, c.x + c.w / 2)){
        c.dead = true;
        burst(c.x + c.w / 2, c.y + c.h / 2, c.color, 18, 260);
      }
    }
  }
  world.traffic = world.traffic.filter(c => !c.dead);
}

function destroyTrafficCar(c){
  c.dead = true;
  stats.kills++;
  burst(c.x + c.w / 2, c.y + c.h / 2, c.color, 18, 260);
  stats.coins++;
  addFloater(c.x, c.y - 10, '+1 🪙', '#ffd24a');
  if (Math.random() < 0.35)
    world.pickups.push({ type: 'arrows', n: 3, x: c.x + c.w / 2 - 13, y: world.lanes[c.lane] - 11, w: 26, h: 22, t: 12 });
  sfx('pop');
}

function updateDriveArrows(dt){
  for (const a of world.arrows){
    a.t -= dt;
    a.x += a.vx * dt;
    const hitbox = { x: a.x - 14, y: a.y - 3, w: 28, h: 6 };
    for (const c of world.traffic){
      if (!c.dead && overlap(hitbox, c)){ a.t = 0; destroyTrafficCar(c); break; }
    }
    if (a.t <= 0) continue;
    for (const b of world.bosses){
      if (!b.dead && b.active && overlap(hitbox, b)){ a.t = 0; hitBoss(b, BOW_DMG); break; }
    }
  }
  world.arrows = world.arrows.filter(a => a.t > 0);
  world.traffic = world.traffic.filter(c => !c.dead);
}

function updateTrafficBoss(b, dt){
  const p = player;
  if (b.dead) return;
  if (!b.active){
    if (p.x > b.startX){
      b.active = true; b.phase = 'red'; b.phaseT = 3.5; b.t = 0;   // startet bei Rot (kurze Schonfrist zum Anhalten)
      showBanner('⚠️ ' + b.intro, b.introSub, 4);
      speak(b.introSay);
      sfx('roar');
    }
    return;
  }
  b.t += dt;
  b.phaseT -= dt;
  if (b.phaseT <= 0){
    if (b.phase === 'green'){ b.phase = 'yellow'; b.phaseT = 1.125; sfx('block'); }
    else if (b.phase === 'yellow'){ b.phase = 'red'; b.phaseT = rnd(2.0, 4.0); sfx('red'); }
    else { b.phase = 'green'; b.phaseT = rnd(1.25, 2.25); sfx('green'); }   // nur kurze Grünphasen
  }
  // Blitz nur, wenn bei Rot wirklich eine Fahrtaste gehalten wird (Ausrollen ist erlaubt) – bei Gelb bremsen!
  const pressing = (inp.right || inp.left) && Math.abs(p.driveV) > 10;
  if (b.phase === 'red' && b.t > 2.0 && pressing && p.invuln <= 0){
    world.zapT = 0.35;
    sfx('zap'); shake(4, 0.35);
    driveHit(DRIVE_DMG, b.x);
    addFloater(p.x, p.y - 60, '⚡ Bei Rot anhalten!', '#ffd24a');
  }
  // Ampel erreicht = gewonnen
  if (p.x + p.w >= b.x - 50){
    p.x = b.x - 50 - p.w; p.driveV = 0;
    hitBoss(b, b.hp);
    return;
  }
  // Pfeil-Nachschub während des Kampfes
  b.arrowT -= dt;
  if (b.arrowT <= 0 && p.arrows < 5){
    b.arrowT = 4;
    const lane = Math.floor(rnd(0, 4));
    world.pickups.push({ type: 'arrows', n: 3, x: clamp(p.x + rnd(150, 400), 0, b.x - 160), y: world.lanes[lane] - 11, w: 26, h: 22, t: 20 });
  }
}

function updateDrive(dt){
  const p = player;
  p.animT += dt;
  p.invuln = Math.max(0, p.invuln - dt);
  p.attackT = 0;
  p.bowCd = Math.max(0, p.bowCd - dt);
  world.zapT = Math.max(0, world.zapT - dt);

  // Gas / Bremse / Ausrollen / langsam rückwärts
  const maxV = DRIVE_BASE * p.speedMult;
  const bossActive = world.bosses[0] && world.bosses[0].active && !world.bosses[0].dead;
  const coast = bossActive ? 1500 : 400;   // auf der Ampel-Zielgeraden bleibt das Auto beim Loslassen fast sofort stehen
  if (inp.right) p.driveV = Math.min(maxV, p.driveV + 450 * dt);
  else if (inp.left) p.driveV = p.driveV > 0 ? Math.max(0, p.driveV - 900 * dt) : Math.max(-DRIVE_REV, p.driveV - 300 * dt);
  else p.driveV = p.driveV > 0 ? Math.max(0, p.driveV - coast * dt) : Math.min(0, p.driveV + coast * dt);
  p.facing = 1;

  // Spurwechsel – an Raststätten gibt es nur die Mittelspur
  const seg = world.segments.find(s => p.x + p.w / 2 >= s.x0 && p.x + p.w / 2 < s.x1);
  const inRest = seg && seg.type === 'rest';
  if (inRest){
    p.lane = 2;   // nach der Raststätte geht es auf der unteren Fahrtrichtungs-Spur weiter
  } else {
    if (inp.upP && p.lane > 0){ p.lane--; sfx('lane'); }
    if (inp.downP && p.lane < world.lanes.length - 1){ p.lane++; sfx('lane'); }
  }
  const targetY = (inRest ? REST_Y : world.lanes[p.lane]) - p.h / 2;
  p.y = lerp(p.y, targetY, 1 - Math.pow(0.0001, dt));

  p.x += p.driveV * dt;
  p.vx = p.driveV;
  p.dist += p.driveV * dt;
  p.x = clamp(p.x, 0, world.w - p.w);
  const boss = world.bosses[0];
  if (boss && p.x + p.w > boss.x - 50){ p.x = boss.x - 50 - p.w; p.driveV = Math.min(p.driveV, 0); }   // vor der Ampel ist Schluss

  // Pfeile schießen (C / Y am Controller oder Leertaste / A)
  if ((inp.bowP || inp.jumpBtnP) && p.bowCd <= 0){
    if (p.arrows > 0){
      p.arrows--; p.bowCd = 0.45;
      world.arrows.push({ x: p.x + p.w + 6, y: p.y + p.h - 34, vx: 640 + p.driveV, t: 1.6 });   // auf Höhe der Motorhaube -> trifft Autos in derselben Spur
      sfx('bow');
    } else {
      p.bowCd = 0.4;
      sfx('wrong');
      addFloater(p.x, p.y - 40, 'Keine Pfeile!', '#ff9a9a');
    }
  }

  updateTraffic(dt);
  if (boss) updateTrafficBoss(boss, dt);
  if (world.winT != null){
    world.winT -= dt;
    if (world.winT <= 0){
      world.winT = null;
      state = 'win'; stateT = 0; banner = null;
      sfx('fanfare');
      speak('Fantastisch! Du hast alle sechs Welten geschafft! Du bist ein echter Held!');
    }
  }
}

// ---------- Laserschranken ----------
function laserOn(l){ return ((gameT + l.offset) % l.period) < l.period * 0.5; }
function laserBox(l){
  return l.x1 === l.x2 ? { x: l.x1 - 5, y: l.y1, w: 10, h: l.y2 - l.y1 }
                       : { x: l.x1, y: l.y1 - 5, w: l.x2 - l.x1, h: 10 };
}
function updateLasers(){
  for (const l of (world.lasers || [])){
    if (!laserOn(l)) continue;
    if (player.invuln <= 0 && overlap(laserBox(l), player)){
      sfx('laser');
      // waagerechter Laser: Stoß weg von der Wand, an der er hängt (man fällt ein Stück)
      const fromX = l.x1 === l.x2 ? l.x1 : (l.mount === 'left' ? l.x1 - 40 : l.x2 + 40);
      hurtPlayer(l.dmg || 1, fromX, 1.1);
    }
  }
}

// ---------- Gegner ----------
function dropLoot(x, y){
  const n = 1 + (Math.random() < 0.4 ? 1 : 0);
  for (let i = 0; i < n; i++){
    world.coins.push({ x: x + rnd(-10, 10), y, vx: rnd(-80, 80), vy: rnd(-320, -180), t: 8, grounded: false });
  }
  if (Math.random() < 0.22){
    world.pickups.push({ type: 'heart', x, y: y - 10, w: 26, h: 24, t: 10 });
  }
  if (player.hasBow && Math.random() < 0.2){
    world.pickups.push({ type: 'arrows', n: 2, x: x + rnd(-14, 14), y: y - 12, w: 26, h: 22, t: 12 });
  }
}

function killEnemy(e){
  e.hp = 0;
  stats.kills++;
  burst(e.x + e.w / 2, e.y + e.h / 2, e.type === 'flyer' ? '#c9a6ff' : '#79d84f', 14, 240);
  addFloater(e.x, e.y - 10, '+⭐', '#ffd24a');
  dropLoot(e.x + e.w / 2, e.y);
  sfx('pop');
}

function updateEnemies(dt){
  const hb = swordHitbox();
  for (const e of world.enemies){
    if (e.hp <= 0) continue;
    e.t += dt;
    e.flash = Math.max(0, e.flash - dt);
    if (e.type === 'slime'){
      e.x += e.dir * e.spd * dt;
      if (e.x < e.plat.x + 4){ e.x = e.plat.x + 4; e.dir = 1; }
      if (e.x + e.w > e.plat.x + e.plat.w - 4){ e.x = e.plat.x + e.plat.w - 4 - e.w; e.dir = -1; }
      e.y = e.plat.y - e.h + Math.sin(e.t * 9) * 2;
    } else {
      e.x = e.ax + Math.sin(e.t * 0.9) * e.range;
      e.y = e.ay + Math.sin(e.t * 2.2) * 26;
    }
    // Schwerttreffer
    if (hb && e.swingHit !== player.swingId && overlap(hb, e)){
      e.swingHit = player.swingId;
      e.hp -= SWORDS[player.sword].dmg;
      e.flash = 0.15;
      e.x += player.facing * 18;
      if (e.hp <= 0) killEnemy(e); else sfx('hit');
    }
    // Spieler berührt
    if (e.hp > 0 && overlap(e, player)) hurtPlayer(e.dmg, e.x + e.w / 2, e.knock);
  }
  world.enemies = world.enemies.filter(e => e.hp > 0);
}

function bossDrop(b){
  const cx0 = b.x + b.w / 2;
  if (b.drop === 'paraglider'){
    world.pickups.push({ type: 'paraglider', x: cx0 - 24, y: b.groundY - 70, w: 48, h: 44, t: 999 });
    showBanner('🎉 ' + b.name + ' besiegt!', 'Hol dir den Paraglider!', 4);
    speak('Jaaa! Du hast den ' + b.name + ' besiegt! Hol dir den Paraglider!');
  } else if (b.drop === 'bow'){
    world.pickups.push({ type: 'bow', x: cx0 - 22, y: b.groundY - 64, w: 44, h: 40, t: 999 });
    showBanner('🎉 ' + b.name + ' besiegt!', 'Er hat den Bogen fallen gelassen!', 4);
    speak('Super! Der ' + b.name + ' ist besiegt! Hol dir den Bogen!');
  } else if (b.drop === 'armor'){
    world.pickups.push({ type: 'armor', x: cx0 - 20, y: b.groundY - 62, w: 40, h: 40, t: 999 });
    showBanner('🎉 ' + b.name + ' besiegt!', 'Er hat die goldene Rüstung fallen gelassen!', 4);
    speak('Stark! Der ' + b.name + ' ist besiegt! Hol dir die goldene Rüstung!');
  } else if (b.drop === 'paraglider2'){
    world.pickups.push({ type: 'paraglider2', x: cx0 - 24, y: b.groundY - 72, w: 48, h: 46, t: 999 });
    showBanner('🎉 ' + b.name + ' besiegt!', 'Der Sturmgleiter gehört dir!', 4);
    speak('Unglaublich! Der ' + b.name + ' ist besiegt! Schnapp dir den Sturmgleiter!');
  } else if (b.drop === 'heartcont'){
    world.pickups.push({ type: 'heartcont', x: cx0 - 16, y: b.groundY - 54, w: 32, h: 30, t: 999 });
    showBanner('🎉 ' + b.name + ' besiegt!', 'Er hat ein Extra-Herz fallen gelassen!', 4);
    speak('Super! Der ' + b.name + ' ist besiegt! Hol dir das Extraherz!');
  } else if (b.drop === 'key'){
    world.pickups.push({ type: 'key', x: cx0 - 18, y: b.groundY - 56, w: 36, h: 32, t: 999 });
    showBanner('🎉 ' + b.name + ' besiegt!', 'Er hat den Kristall-Schlüssel fallen gelassen!', 4);
    speak('Jaaa! Der ' + b.name + ' ist besiegt! Schnapp dir den Kristallschlüssel und öffne den Ausgang!');
  } else if (b.drop === 'finish'){
    showBanner('🏁 Ziel erreicht!', b.name + ' ist geschlagen!', 4);
    speak('Jaaa! Du hast die Ampel erreicht! Der Ampelroboter ist geschlagen!');
    world.winT = 4;
  } else if (b.drop === 'chip'){
    world.pickups.push({ type: 'chip', x: cx0 - 18, y: b.groundY - 56, w: 36, h: 32, t: 999 });
    showBanner('🎉 ' + b.name + ' besiegt!', 'Er hat den Geheim-Chip fallen gelassen!', 4);
    speak('Jaaa! Der ' + b.name + ' ist besiegt! Schnapp dir den Geheimchip, er ist der Zündschlüssel für dein neues Auto!');
  }
}

function hitBoss(b, dmg){
  b.hp -= dmg;
  b.flash = 0.18;
  sfx('bosshit'); shake(1.2, 0.1);
  burst(b.x + b.w / 2, b.y + b.h / 2, '#fff', 8, 180);
  if (b.hp <= 0){
    b.dead = true;
    stats.kills++;
    burst(b.x + b.w / 2, b.y + b.h / 2, '#dfe9f5', 40, 340);
    if (b.style === 'light') sfx('fanfare'); else { sfx('bossdown'); shake(6, 0.7); }
    bossDrop(b);
  }
}

function updateBosses(dt){
  for (const b of world.bosses){
    if (b.dead) continue;
    b.t += dt;
    b.flash = Math.max(0, b.flash - dt);

    if (!b.active){
      if (Math.abs(player.x - b.x) < 500){
        b.active = true;
        showBanner('⚠️ ' + b.intro, b.introSub, 3.5);
        speak(b.introSay);
        sfx('roar');
      }
      continue;
    }

    b.vy += GRAV * 0.8 * dt;
    b.y += b.vy * dt;
    if (b.y + b.h >= b.groundY){
      if (!b.onGround){
        burst(b.x + b.w / 2, b.groundY, '#dfe9f5', 12, 180); sfx('stomp'); shake(b.shock ? 4 : 2.5, 0.3);
        if (b.shock){
          world.shocks.push({ x: b.x + b.w / 2, y: b.groundY, vx: 320, t: 2.5, minX: b.minX - 60, maxX: b.maxX + 200, dmg: b.dmg });
          world.shocks.push({ x: b.x + b.w / 2, y: b.groundY, vx: -320, t: 2.5, minX: b.minX - 60, maxX: b.maxX + 200, dmg: b.dmg });
        }
      }
      b.y = b.groundY - b.h; b.vy = 0; b.onGround = true;
    }
    b.jumpCd -= dt;
    if (b.onGround && b.jumpCd <= 0){
      const enraged = b.hp <= b.maxHp * 0.4;
      const dir = Math.sign(player.x - b.x) || 1;
      b.vx = dir * (enraged ? b.spdMad : b.spd);
      b.vy = b.jumpV; b.onGround = false;
      b.jumpCd = enraged ? b.hopCdMad : b.hopCd;
    }
    if (!b.onGround) b.x += b.vx * dt;
    b.x = clamp(b.x, b.minX, b.maxX);

    const hb = swordHitbox();
    if (hb && b.swingHit !== player.swingId && overlap(hb, b)){
      b.swingHit = player.swingId;
      hitBoss(b, SWORDS[player.sword].dmg);
    }
    if (!b.dead && overlap(b, player)) hurtPlayer(b.dmg, b.x + b.w / 2);
  }
}

// ---------- Schockwellen ----------
function updateShocks(dt){
  for (const s of world.shocks){
    s.t -= dt; s.x += s.vx * dt;
    if (s.x < s.minX || s.x > s.maxX) s.t = 0;
    if (s.t > 0 && overlap({ x: s.x - 14, y: s.y - 20, w: 28, h: 20 }, player)) hurtPlayer(s.dmg || 1, s.x, 1.2);
  }
  world.shocks = world.shocks.filter(s => s.t > 0);
}

// ---------- Pfeile ----------
function updateArrows(dt){
  for (const a of world.arrows){
    a.t -= dt;
    a.x += a.vx * dt;
    const hitbox = { x: a.x - 14, y: a.y - 3, w: 28, h: 6 };
    for (const e of world.enemies){
      if (e.hp > 0 && overlap(hitbox, e)){
        e.hp -= BOW_DMG; e.flash = 0.15; a.t = 0;
        if (e.hp <= 0) killEnemy(e); else sfx('hit');
        break;
      }
    }
    if (a.t <= 0) continue;
    for (const b of world.bosses){
      if (!b.dead && b.active && overlap(hitbox, b)){
        a.t = 0;
        hitBoss(b, BOW_DMG);
        break;
      }
    }
  }
  world.arrows = world.arrows.filter(a => a.t > 0);
  world.enemies = world.enemies.filter(e => e.hp > 0);
}

// ---------- Münzen & Pickups ----------
function updateCoins(dt){
  for (const c of world.coins){
    c.t -= dt;
    if (!c.grounded){
      c.vy += GRAV * dt; c.x += c.vx * dt; c.y += c.vy * dt;
      for (const pl of world.platforms.concat(world.walls || [])){
        if (c.vy > 0 && c.x > pl.x && c.x < pl.x + pl.w && c.y > pl.y - 6 && c.y < pl.y + 20){
          c.y = pl.y - 6; c.grounded = true;
        }
      }
      if (c.y > world.killY) c.t = 0;
    }
    if (Math.abs(c.x - (player.x + 16)) < 30 && Math.abs(c.y - (player.y + 22)) < 36){
      c.t = 0; stats.coins++; sfx('coin');
      addFloater(c.x - 10, c.y - 16, '+1', '#ffd24a');
    }
  }
  world.coins = world.coins.filter(c => c.t > 0);

  for (const pu of world.pickups){
    if (pu.type === 'heart') pu.t -= dt;
    if (!overlap(pu, player)) continue;
    if (pu.type === 'heart'){
      if (player.hearts < player.maxHearts){
        player.hearts++; pu.t = 0; sfx('heart');
        addFloater(pu.x, pu.y - 14, '+❤️', '#ff6b81');
      }
    } else if (pu.type === 'paraglider'){
      pu.t = 0;
      player.hasParaglider = true;
      player.maxHearts++; player.hearts = player.maxHearts;
      sfx('powerup');
      speak('Der Paraglider gehört dir! Und ein Extraherz! Jetzt geht es hinunter in Welt zwei! Festhalten!');
      showBanner('🪂 Paraglider + ❤️ Extra-Herz!', 'Ab in Welt 2!', 3);
      startGlide(2, 'day');
    } else if (pu.type === 'paraglider2'){
      pu.t = 0;
      player.maxHearts++; player.hearts = player.maxHearts;
      sfx('powerup');
      speak('Der Sturmgleiter gehört dir! Und noch ein Extraherz! Jetzt fliegen wir hinab zur geheimen Kristallhöhle! Festhalten!');
      showBanner('🪂 Sturmgleiter + ❤️ Extra-Herz!', 'Ab in Welt 4!', 3);
      startGlide(4, 'sunset');
    } else if (pu.type === 'bow'){
      pu.t = 0;
      player.hasBow = true; player.arrows = 10;
      sfx('powerup');
      speak('Der Bogen gehört dir! Drücke ' + (padConnected ? 'die obere Taste' : 'C') + ' zum Schießen! Monster lassen jetzt Pfeile fallen!');
      showBanner('🏹 Bogen + voller Köcher!', 'Schießen: {bow}', 4.5);
    } else if (pu.type === 'armor'){
      pu.t = 0;
      player.hasShield = true; player.shieldMax = 2; player.shieldCharge = 2;
      sfx('powerup');
      speak('Die goldene Rüstung! Dein Schild blockt jetzt zwei Treffer!');
      showBanner('🛡️ Goldene Rüstung!', 'Blockt jetzt 2 Treffer!', 3.5);
    } else if (pu.type === 'arrows'){
      pu.t = 0;
      player.arrows = Math.min(10, player.arrows + pu.n);
      sfx('coin');
      addFloater(pu.x, pu.y - 14, '+' + pu.n + ' 🏹', '#ffd24a');
    } else if (pu.type === 'wings'){
      pu.t = 0;
      player.hasWings = true;
      sfx('powerup');
      speak('Die Sprungflügel gehören dir! Drücke in der Luft noch einmal Springen für den Doppelsprung! Probier es gleich über die große Lücke!');
      showBanner('🕊️ Sprungflügel!', 'In der Luft nochmal {jump} = Doppelsprung!', 5);
    } else if (pu.type === 'heartcont'){
      pu.t = 0;
      player.maxHearts++; player.hearts = player.maxHearts;
      sfx('heart');
      showBanner('❤️ Extra-Herz!', '', 2.5);
      speak('Ein Extraherz! Du wirst immer stärker!');
    } else if (pu.type === 'key'){
      pu.t = 0;
      player.hasKey = true;
      sfx('powerup');
      speak('Der Kristallschlüssel! Jetzt kannst du das Tor zum Ausgang öffnen!');
      showBanner('🗝️ Kristall-Schlüssel!', 'Auf zum Ausgang!', 3.5);
    } else if (pu.type === 'chip'){
      pu.t = 0;
      player.hasChip = true;
      sfx('powerup');
      speak('Der Geheimchip! Mission fast geschafft! Klettere über die Mauer, dort steht dein neues Auto!');
      showBanner('💾 Geheim-Chip!', 'Auf zum neuen Auto!', 3.5);
    }
  }
  world.pickups = world.pickups.filter(p => p.t > 0);
}

// ---------- Checkpoints, Truhen, Tür ----------
function updateWorldObjects(dt){
  for (const f of world.flags){
    const nearY = world.mode === 'drive' || Math.abs(player.y + player.h - f.y) < 60;
    if (!f.active && Math.abs(player.x + player.w / 2 - f.x) < 50 && nearY){
      f.active = true;
      world.checkpoint = { x: f.x, y: f.y, lane: player.lane };
      if (world.mode === 'drive'){
        player.hearts = player.maxHearts; player.arrows = 10;
        addFloater(f.x - 30, f.y - 130, '⛽ Aufgetankt: Herzen + Pfeile!', '#ffd24a');
      }
      if (player.hasShield && player.shieldCharge < player.shieldMax){
        player.shieldCharge = player.shieldMax;
        addFloater(f.x, f.y - 80, '🛡️ aufgeladen!', '#7fd0ff');
      }
      sfx('check');
      addFloater(f.x - 30, f.y - 100, '✅ Speicherpunkt!', '#7be07b');
    }
  }
  for (const c of world.chests){
    c.cd = Math.max(0, c.cd - dt);
    if (!c.open && c.cd <= 0 && overlap(c, player) && inp.atkP){
      player.attackT = 0; // kein Schwerthieb beim Öffnen
      openChest(c);
      return;
    }
  }
  if (world.door){
    world.door.hintCd = Math.max(0, (world.door.hintCd || 0) - dt);
    if (overlap(world.door, player)){
      const lockKey = world.door.needsKey && !player.hasKey;
      const lockChip = world.door.needsChip && !player.hasChip;
      if (lockKey || lockChip){
        if (world.door.hintCd <= 0){
          world.door.hintCd = 3;
          if (lockKey){
            addFloater(world.door.x + 10, world.door.y - 30, '🗝️ Du brauchst den Schlüssel!', '#ffd24a');
            speak('Das Tor ist verschlossen! Du brauchst den Kristallschlüssel vom Höhlenkönig!');
          } else {
            addFloater(world.door.x + 10, world.door.y - 60, '💾 Du brauchst den Geheim-Chip!', '#7fffd0');
            speak('Das Auto braucht den Geheimchip als Zündschlüssel! Besiege den Chef-Roboter!');
          }
        }
      } else if (world.door.to){
        sfx('portal');
        loadWorld(world.door.to);
      } else {
        state = 'win'; stateT = 0; banner = null;
        sfx('fanfare');
        speak('Fantastisch! Du hast alle sechs Welten geschafft! Du bist ein echter Held!');
      }
    }
  }
}

// ---------- Paraglider-Flug ----------
function startGlide(next, style){
  const endY = next === 'win' ? 3200 : 2800;
  glide = { x: W / 2, gy: 0, endY, t: 0, coins: [], clouds: [], collected: 0, next, style };
  for (let i = 0; i < (next === 'win' ? 46 : 36); i++){
    glide.coins.push({ x: rnd(120, W - 120), gy: rnd(250, endY - 150), got: false });
  }
  for (let i = 0; i < 26; i++){
    glide.clouds.push({ x: rnd(-50, W + 50), gy: rnd(0, endY + 100), s: rnd(.5, 1.5) });
  }
  state = 'glide'; stateT = 0;
  sfx('glide');
  startTransition('in');
}

function updateGlide(dt){
  glide.t += dt;
  glide.gy += 150 * dt;
  const wish = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  glide.x = clamp(glide.x + wish * 260 * dt, 60, W - 60);
  if (wish !== 0) player.facing = wish;

  for (const c of glide.coins){
    if (c.got) continue;
    const sy = 170 + (c.gy - glide.gy);
    if (Math.abs(c.x - glide.x) < 42 && Math.abs(sy - 190) < 44){
      c.got = true; glide.collected++; stats.coins++; sfx('coin');
    }
  }
  if (glide.gy >= glide.endY){
    const next = glide.next;
    glide = null;
    if (next === 'win'){
      state = 'win'; stateT = 0; banner = null;
      sfx('fanfare');
      speak('Fantastisch! Du hast alle sechs Welten geschafft! Du bist ein echter Held!');
    } else {
      loadWorld(next);
      state = 'play';
    }
  }
}

// ---------- Partikel & Texte ----------
function updateFx(dt){
  for (const p of particles){
    p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt;
  }
  particles = particles.filter(p => p.t > 0);
  for (const f of floaters){ f.t -= dt; f.y -= 40 * dt; }
  floaters = floaters.filter(f => f.t > 0);
  if (banner){ banner.t -= dt; if (banner.t <= 0) banner = null; }
}
// ============================================================
//  PIXEL-GRAFIK: Low-Res-Leinwand, scharfes Hochskalieren, Grundformen, Sprites
// ============================================================
// Das Spiel rechnet weiter in 960x540 Spieleinheiten. Gezeichnet wird auf eine
// 480x270-Pixel-Leinwand (1 Pixel = 2 Einheiten), die dann scharf hochskaliert wird.
const LW = 480, LH = 270;
const OUT = '#1a1726';                 // Umrissfarbe aller Figuren

function newCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
  return c;
}
const dctx = cvs.getContext('2d');
const lo = newCanvas(LW, LH);
let ctx = lo.getContext('2d');          // aktuelle Zeichenfläche (renderTo() leitet kurz um)
ctx.imageSmoothingEnabled = false;
// Zeichnet mit allen Pixel-Funktionen in eine andere Leinwand (z. B. um etwas danach zu vergrößern)
function renderTo(canvas, fn){
  const prev = ctx;
  ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  try { fn(); } finally { ctx = prev; }
}
const upc = newCanvas(LW, LH);
const upctx = upc.getContext('2d');

function fitCanvas(){
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(innerWidth / LW, innerHeight / LH);
  const cssW = Math.max(1, Math.floor(LW * s)), cssH = Math.max(1, Math.floor(LH * s));
  cvs.style.width = cssW + 'px';
  cvs.style.height = cssH + 'px';
  cvs.width = Math.max(1, Math.round(cssW * dpr));
  cvs.height = Math.max(1, Math.round(cssH * dpr));
  // "Sharp bilinear": erst ganzzahlig (Nearest Neighbour) hochskalieren, dann weich auf Zielgröße.
  const k = Math.max(1, Math.ceil(cvs.width / LW - 0.001));
  upc.width = LW * k; upc.height = LH * k;
  upctx.imageSmoothingEnabled = false;
  dctx.imageSmoothingEnabled = true;
  dctx.imageSmoothingQuality = 'high';
}
addEventListener('resize', fitCanvas);
fitCanvas();

function present(){
  upctx.drawImage(lo, 0, 0, upc.width, upc.height);
  dctx.drawImage(upc, 0, 0, cvs.width, cvs.height);
}

// ---------- Farben ----------
function hexRGB(h){
  h = h.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function rgbHex(r, g, b){
  return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}
function mixHex(a, b, t){
  const A = hexRGB(a), B = hexRGB(b);
  return rgbHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t));
}
function lerpColor(c1, c2, t){ return mixHex(c1, c2, clamp(t, 0, 1)); }

// 4x4-Bayer-Matrix für Pixel-Verläufe
const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);

// ---------- Grundformen (alle auf ganze Pixel) ----------
function pr(x, y, w, h, c){
  if (c) ctx.fillStyle = c;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function px(x, y, c){ if (c) ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); }

// Bresenham-Linie, t = Strichstärke in Pixeln
function pline(x0, y0, x1, y1, c, t, g){
  g = g || ctx;
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  t = t || 1;
  const o = (t - 1) >> 1;
  g.fillStyle = c;
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
  const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, n = 0;
  for (;;){
    g.fillRect(x0 - o, y0 - o, t, t);
    if ((x0 === x1 && y0 === y1) || ++n > 2000) break;
    const e2 = 2 * err;
    if (e2 >= dy){ err += dy; x0 += sx; }
    if (e2 <= dx){ err += dx; y0 += sy; }
  }
}

// Gefüllte Ellipse in einem Rechteck (symmetrisch, pixelgenau)
function pellipse(x, y, w, h, c, g){
  g = g || ctx;
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  if (w <= 0 || h <= 0) return;
  g.fillStyle = c;
  const rx = w / 2, ry = h / 2;
  for (let j = 0; j < h; j++){
    const dy = (j + 0.5 - ry) / ry;
    const half = rx * Math.sqrt(Math.max(0, 1 - dy * dy));
    const x0 = Math.round(rx - half), x1 = Math.round(rx + half);
    if (x1 > x0) g.fillRect(x + x0, y + j, x1 - x0, 1);
  }
}
// Ellipse mit 1-Pixel-Umriss
function pellipseO(x, y, w, h, c, o){
  pellipse(x - 1, y - 1, w + 2, h + 2, o || OUT);
  pellipse(x, y, w, h, c);
}
// Rechteck mit Umriss und abgeschnittenen Ecken
function pboxO(x, y, w, h, c, o, r, g){
  g = g || ctx;
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  r = r == null ? 1 : r;
  g.fillStyle = o || OUT;
  if (r >= 2){ g.fillRect(x + 2, y, w - 4, h); g.fillRect(x, y + 2, w, h - 4); g.fillRect(x + 1, y + 1, w - 2, h - 2); }
  else if (r === 1){ g.fillRect(x + 1, y, w - 2, h); g.fillRect(x, y + 1, w, h - 2); }
  else g.fillRect(x, y, w, h);
  g.fillStyle = c;
  if (r >= 2){ g.fillRect(x + 2, y + 1, w - 4, h - 2); g.fillRect(x + 1, y + 2, w - 2, h - 4); }
  else g.fillRect(x + 1, y + 1, w - 2, h - 2);
}
// Polygon (Scanline, pixelgenau). pts = [[x,y], ...]
function ppoly(pts, c, g){
  g = g || ctx;
  let minY = Infinity, maxY = -Infinity;
  for (const p of pts){ if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1]; }
  g.fillStyle = c;
  for (let y = Math.floor(minY); y < Math.ceil(maxY); y++){
    const yc = y + 0.5, xs = [];
    for (let i = 0; i < pts.length; i++){
      const a = pts[i], b = pts[(i + 1) % pts.length];
      if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc))
        xs.push(a[0] + (yc - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
    }
    xs.sort((p, q) => p - q);
    for (let k = 0; k + 1 < xs.length; k += 2){
      const x0 = Math.round(xs[k]), x1 = Math.round(xs[k + 1]);
      if (x1 > x0) g.fillRect(x0, y, x1 - x0, 1);
    }
  }
}
// Gerasterter Verlauf (vertikal) mit Bayer-Dithering zwischen Farbbändern (schnell über Pixelpuffer)
function ditherV(g, x, y, w, h, colors){
  const cols = colors.map(hexRGB), n = cols.length - 1;
  const img = g.createImageData(w, h), d = img.data;
  for (let j = 0; j < h; j++){
    const t = h <= 1 ? 0 : j / (h - 1) * n;
    const i = Math.min(n - 1, Math.floor(t)), f = t - i;
    const ca = cols[i], cb = cols[Math.min(n, i + 1)];
    for (let xx = 0; xx < w; xx++){
      const c = (f > 0.02 && f > BAYER4[((y + j) & 3) * 4 + ((x + xx) & 3)]) ? cb : ca;
      const k = (j * w + xx) * 4;
      d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; d[k + 3] = 255;
    }
  }
  g.putImageData(img, x, y);
}
// Abdunkeln/aufhellen per Schachbrett-Muster (für Overlays im Pixel-Look)
function checker(x, y, w, h, c, phase){
  ctx.fillStyle = c;
  for (let j = 0; j < h; j++)
    for (let i = ((j + (phase || 0)) & 1); i < w; i += 2) ctx.fillRect(x + i, y + j, 1, 1);
}

// ---------- Sprites aus Text-Rastern ----------
const _rgbCache = {};
function rgbOf(c){ return _rgbCache[c] || (_rgbCache[c] = hexRGB(c)); }
function makeSprite(rows, pal){
  const h = rows.length;
  let w = 0; for (const r of rows) w = Math.max(w, r.length);
  const c = newCanvas(w, h);
  const g = c.getContext('2d');
  const img = g.createImageData(w, h), d = img.data;
  for (let y = 0; y < h; y++){
    const r = rows[y];
    for (let x = 0; x < r.length; x++){
      const ch = r[x];
      if (ch === '.' || ch === ' ') continue;
      const col = pal[ch];
      if (!col){ console.warn('Sprite: unbekannte Palettenfarbe', ch); continue; }
      const rgb = rgbOf(col), i = (y * w + x) * 4;
      d[i] = rgb[0]; d[i + 1] = rgb[1]; d[i + 2] = rgb[2]; d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return spriteOf(c);
}
function spriteOf(c){ return { c, w: c.width, h: c.height, _f: null, _wh: null, _whf: null }; }
function flipCanvas(src){
  const c = newCanvas(src.width, src.height), g = c.getContext('2d');
  g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0);
  return c;
}
function tintCanvas(src, color){
  const c = newCanvas(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return c;
}
function sprCanvas(s, flip, white){
  if (white){
    if (flip) return s._whf || (s._whf = tintCanvas(flipCanvas(s.c), '#ffffff'));
    return s._wh || (s._wh = tintCanvas(s.c, '#ffffff'));
  }
  if (flip) return s._f || (s._f = flipCanvas(s.c));
  return s.c;
}
// Sprite zeichnen: (x, y) = linke obere Ecke in Pixeln
function spr(s, x, y, flip, white){
  ctx.drawImage(sprCanvas(s, flip, white), Math.round(x), Math.round(y));
}
// Sprite mit Ankerpunkt unten-mittig
function sprBC(s, x, y, flip, white){ spr(s, x - (s.w >> 1), y - s.h, flip, white); }
// Sprite mit Ankerpunkt Mitte
function sprC(s, x, y, flip, white){ spr(s, x - (s.w >> 1), y - (s.h >> 1), flip, white); }
// Sprite ganzzahlig vergrößert
function sprS(s, x, y, k, flip){
  ctx.drawImage(sprCanvas(s, flip), Math.round(x), Math.round(y), s.w * k, s.h * k);
}

// ---------- Vektor → Pixel ----------
// Zeichnet mit normalen Canvas-Befehlen auf eine kleine Leinwand und macht daraus
// saubere Pixelkunst: Kantenglättung entfernen, Farben auf die echten Füllfarben
// einrasten, 1-Pixel-Umriss außen herum.
function pixelize(w, h, draw, opts){
  opts = opts || {};
  const c = opts.canvas && opts.canvas.width === w && opts.canvas.height === h ? opts.canvas : newCanvas(w, h);
  const g = c.getContext('2d', { willReadFrequently: true });
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, w, h);
  g.imageSmoothingEnabled = false;
  // alle beim Zeichnen benutzten Füllfarben mitschreiben (= Palette für das Einrasten)
  const used = new Set();
  const fsDesc = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'fillStyle');
  Object.defineProperty(g, 'fillStyle', { configurable: true, get(){ return fsDesc.get.call(this); },
    set(v){ if (typeof v === 'string' && v[0] === '#') used.add(v); fsDesc.set.call(this, v); } });
  try { draw(g); } finally { delete g.fillStyle; }
  g.setTransform(1, 0, 0, 1, 0, 0);
  const img = g.getImageData(0, 0, w, h), d = img.data;
  const n = w * h;
  const op = new Uint8Array(n);
  for (let i = 0; i < n; i++) op[i] = d[i * 4 + 3] >= (opts.alphaCut || 110) ? 1 : 0;
  const key = i => (d[i * 4] << 16) | (d[i * 4 + 1] << 8) | d[i * 4 + 2];
  const pal = new Map();
  for (const col of used){ const r = hexRGB(col); pal.set((r[0] << 16) | (r[1] << 8) | r[2], true); }
  if (!pal.size){
    // Ersatz: echte Farben = deckende Pixel, deren 4 Nachbarn dieselbe Farbe haben
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++){
      const i = y * w + x;
      if (!op[i] || d[i * 4 + 3] < 250) continue;
      const k = key(i);
      if (op[i - 1] && op[i + 1] && op[i - w] && op[i + w] &&
          key(i - 1) === k && key(i + 1) === k && key(i - w) === k && key(i + w) === k) pal.set(k, true);
    }
  }
  if (opts.extra) for (const col of opts.extra){ const r = hexRGB(col); pal.set((r[0] << 16) | (r[1] << 8) | r[2], true); }
  const keys = [...pal.keys()];
  for (let i = 0; i < n; i++){
    const j = i * 4;
    if (!op[i]){ d[j + 3] = 0; continue; }
    d[j + 3] = 255;
    if (!keys.length) continue;
    const k = key(i);
    if (pal.has(k)) continue;
    let best = keys[0], bd = Infinity;
    const r = d[j], gg = d[j + 1], b = d[j + 2];
    for (const q of keys){
      const dr = ((q >> 16) & 255) - r, dg = ((q >> 8) & 255) - gg, db = (q & 255) - b;
      const dist = dr * dr + dg * dg + db * db;
      if (dist < bd){ bd = dist; best = q; }
    }
    d[j] = (best >> 16) & 255; d[j + 1] = (best >> 8) & 255; d[j + 2] = best & 255;
  }
  if (opts.outline !== false){
    const o = rgbOf(opts.outline || OUT);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
      const i = y * w + x;
      if (op[i]) continue;
      if ((x > 0 && op[i - 1]) || (x < w - 1 && op[i + 1]) || (y > 0 && op[i - w]) || (y < h - 1 && op[i + w])){
        const j = i * 4;
        d[j] = o[0]; d[j + 1] = o[1]; d[j + 2] = o[2]; d[j + 3] = 255;
      }
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}

// Glyphen in Masken (Uint8Array) umwandeln
const FONT = {};
for (const ch in FONT_SRC){
  let rows = FONT_SRC[ch], y0 = FONT_TOP;
  if (rows[0][0] === '^'){ rows = [rows[0].slice(1)].concat(rows.slice(1)); y0 = FONT_TOP - 1; }
  const w = rows.reduce((m, r) => Math.max(m, r.length), 0);
  const mask = new Uint8Array(w * FONT_ROWS);
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] === '#') mask[(y + y0) * w + x] = 1; });
  FONT[ch] = { w, mask };
}
const FONT_SPACING = 1;
const FONT_CAP = 7;            // Versalhöhe
const LINE_H = 12;             // Zeilenhöhe bei Skalierung 1

const CHAR_ALIAS = { '’': "'", '‘': "'", '‚': ',', '«': '"', '»': '"', ' ': ' ' };

// ---------- Glyphen-Atlas je Farbe ----------
const ATLAS = {};
let ATLAS_W = 0;
for (const ch in FONT){ ATLAS[ch] = ATLAS_W; ATLAS_W += FONT[ch].w + 1; }
const _atlasCache = new Map();
function atlasFor(color){
  let c = _atlasCache.get(color);
  if (c) return c;
  c = newCanvas(ATLAS_W, FONT_ROWS);
  const g = c.getContext('2d');
  g.fillStyle = color;
  for (const ch in FONT){
    const f = FONT[ch], ox = ATLAS[ch];
    for (let y = 0; y < FONT_ROWS; y++) for (let x = 0; x < f.w; x++) if (f.mask[y * f.w + x]) g.fillRect(ox + x, y, 1, 1);
  }
  _atlasCache.set(color, c);
  return c;
}

const _glyphCache = {};
function glyphCanvas(id){
  const dev = ctrlDevice();
  const key = id + '|' + (id[0] === 'k' || id[0] === 'x' ? 'kb' : dev);
  if (_glyphCache[key]) return _glyphCache[key];
  let c;
  const kind = id[0], arg = id.slice(2);
  if (kind === 'k') c = makeKeycap(arg);
  else if (kind === 'b') c = makeFaceButton(arg, dev);
  else if (kind === 'x') c = makeFaceButton(arg, 'xbox');
  else if (kind === 'd') c = makeDpad(arg);
  else c = makePill(arg, dev);
  return (_glyphCache[key] = c);
}
function plainWidth(str){
  let w = 0, n = 0;
  for (const ch of str){ const f = FONT[ch]; if (!f) continue; w += f.w + (n++ ? FONT_SPACING : 0); }
  return w;
}
function drawPlain(g, str, x, y, color){
  const atlas = atlasFor(color);
  for (const ch of str){
    const f = FONT[ch]; if (!f) continue;
    g.drawImage(atlas, ATLAS[ch], 0, f.w, FONT_ROWS, x, y, f.w, FONT_ROWS);
    x += f.w + FONT_SPACING;
  }
}
function makeKeycap(label){
  const tw = plainWidth(label);
  let w = Math.max(11, tw + 6);
  if ((w - tw) % 2) w++;
  const h = 12, c = newCanvas(w, h), g = c.getContext('2d');
  g.fillStyle = OUT; g.fillRect(1, 0, w - 2, h); g.fillRect(0, 1, w, h - 2);
  g.fillStyle = '#7d7b98'; g.fillRect(1, 1, w - 2, h - 2);
  g.fillStyle = '#ecebf5'; g.fillRect(1, 1, w - 2, h - 4);
  g.fillStyle = '#ffffff'; g.fillRect(2, 1, w - 4, 1);
  drawPlain(g, label, (w - tw) >> 1, 2 - FONT_TOP, OUT);
  return c;
}

// ---------- Text → Elemente ----------
function textItems(str){
  const items = [];
  const cps = Array.from(str);
  for (let i = 0; i < cps.length; i++){
    let ch = cps[i];
    if (ch === '️' || ch === '‍' || ch === '︎') continue;
    if (ch === '{'){
      let j = i + 1, name = '';
      while (j < cps.length && cps[j] !== '}') name += cps[j++];
      const def = CTRL[name];
      if (j < cps.length && def){
        const ids = padConnected ? def.pad : def.kb;
        for (const id of ids){
          if (id === '/') items.push({ t: 'g', ch: '/', w: FONT['/'].w });
          else { const c = glyphCanvas(id); items.push({ t: 'c', c, w: c.width, h: c.height }); }
        }
        i = j;
        continue;
      }
    }
    if (CHAR_ALIAS[ch]) ch = CHAR_ALIAS[ch];
    if (FONT[ch]){ items.push({ t: 'g', ch, w: FONT[ch].w }); continue; }
    const ic = EMOJI_ICON[ch];
    if (ic && ICONS[ic]){ const s = ICONS[ic]; items.push({ t: 'c', c: s.c, w: s.w, h: s.h }); continue; }
    const qk = EMOJI_QUIZ[ch];
    if (qk && QSPR[qk]){ const s = QSPR[qk]; items.push({ t: 'c', c: s.c, w: s.w, h: s.h }); continue; }
    warnOnce(ch);
  }
  return items;
}

// ---------- Text-Zeile rendern (mit Cache) ----------
const _textCache = new Map();
function renderLine(str, s, color, outline, shadow){
  const dev = str.indexOf('{') >= 0 ? ctrlDevice() : '';
  const key = str + '\u0001' + s + color + outline + shadow + dev;
  let L = _textCache.get(key);
  if (L) return L;
  const items = textItems(str);
  let w = 0, top = 0, bot = FONT_ROWS;
  items.forEach((it, k) => {
    w += it.w + (k ? FONT_SPACING : 0);
    if (it.t === 'c'){
      it.top = FONT_TOP + Math.round(FONT_CAP / 2 - it.h / 2 - 0.01);
      top = Math.min(top, it.top); bot = Math.max(bot, it.top + it.h);
    }
  });
  const A = newCanvas(Math.max(1, w * s), (bot - top) * s);
  const ga = A.getContext('2d');
  ga.imageSmoothingEnabled = false;
  const atlas = atlasFor(color);
  let x = 0;
  for (const it of items){
    if (it.t === 'g'){
      const f = FONT[it.ch];
      ga.drawImage(atlas, ATLAS[it.ch], 0, f.w, FONT_ROWS, x * s, -top * s, f.w * s, FONT_ROWS * s);
    } else {
      ga.drawImage(it.c, x * s, (it.top - top) * s, it.w * s, it.h * s);
    }
    x += it.w + FONT_SPACING;
  }
  const pad = outline ? 1 : 0, sh = shadow ? 1 : 0;
  const C = newCanvas(A.width + pad * 2, A.height + pad * 2 + sh);
  const gc = C.getContext('2d');
  const B = newCanvas(A.width + pad * 2, A.height + pad * 2);
  const gb = B.getContext('2d');
  if (outline){
    const ol = tintCanvas(A, outline);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) gb.drawImage(ol, pad + dx, pad + dy);
  }
  gb.drawImage(A, pad, pad);
  if (shadow) gc.drawImage(tintCanvas(B, shadow), 0, sh);
  gc.drawImage(B, 0, 0);
  L = { c: C, w: w * s, pad, capC: pad + (FONT_TOP - top) * s + Math.floor(FONT_CAP * s / 2) };
  if (_textCache.size > 600){
    let n = 0;
    for (const k of _textCache.keys()){ _textCache.delete(k); if (++n > 150) break; }
  }
  _textCache.set(key, L);
  return L;
}
// Text zeichnen. y = vertikale Mitte der Großbuchstaben (wie textBaseline 'middle').
// o: { s: Skalierung, c: Farbe, o: Umrissfarbe (false = keiner), sh: Schattenfarbe, a: 'l'|'c'|'r' }
function txt(str, x, y, o){
  o = o || {};
  str = String(str);
  if (!str) return 0;
  const s = o.s || 1;
  const L = renderLine(str, s, o.c || '#ffffff', o.o === undefined ? OUT : (o.o || ''), o.sh || '');
  const left = o.a === 'l' ? x : o.a === 'r' ? x - L.w : x - L.w / 2;
  ctx.drawImage(L.c, Math.round(left - L.pad), Math.round(y - L.capC));
  return L.w;
}
function txtW(str, s){
  const items = textItems(String(str));
  let w = 0;
  items.forEach((it, k) => { w += it.w + (k ? FONT_SPACING : 0); });
  return w * (s || 1);
}
// Zeilenumbruch nach Breite
function wrapText(str, maxW, s){
  const out = [];
  for (const para of String(str).split('\n')){
    const words = para.split(' ');
    let line = '';
    for (const wd of words){
      const t = line ? line + ' ' + wd : wd;
      if (line && txtW(t, s) > maxW){ out.push(line); line = wd; }
      else line = t;
    }
    out.push(line);
  }
  return out;
}
// Umbrochener Textblock, y = Mitte des Blocks
function txtBlock(str, x, y, maxW, o){
  o = o || {};
  const s = o.s || 1, lh = (o.lh || 12) * s;
  const lines = wrapText(str, maxW, s);
  const y0 = y - (lines.length - 1) * lh / 2;
  lines.forEach((l, i) => txt(l, x, y0 + i * lh, o));
  return lines.length;
}

const SPR = {};
function composeHero(head, torso, legs, hy, ty){
  const g = [];
  for (let y = 0; y < 26; y++) g.push(new Array(20).fill('.'));
  const blit = (rows, y0) => rows.forEach((r, j) => {
    const y = y0 + j;
    if (y < 0 || y >= 26) return;
    for (let i = 0; i < 20; i++) if (r[i] !== '.') g[y][i] = r[i];
  });
  blit(legs, 18);
  blit(torso, 11 + (ty || 0));
  blit(head, hy || 0);
  return g.map(r => r.join(''));
}
