<title>Spieliwer</title>

  html,body{margin:0;padding:0;height:100%;background:#0c0b18;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}

<body>
<canvas id="game" width="960" height="540"></canvas>
<script>
'use strict';
// ============================================================
//  SPIELIWER — ein Spiel von Linus & Papa
//  Welt 1: Himmelsinseln  ->  Paraglider  ->  Welt 2: Waldland
//  Welt 3: Wolkenschloss  ->  Welt 4: Kristallhöhle  ->  Welt 5: Roboter-Stadt (Wand-Hochkletterer)
//  Welt 6: Autobahn (Fahr-Modus: Spuren wechseln, Verkehr ausweichen, Ampel-Roboter)
//  Test: F5 = eine Welt zurück, F6 = eine Welt vor (Upgrades werden passend gesetzt/entfernt)
//  Grafik: Pixel-Art (480x270, scharf hochskaliert) · Sound: Chiptune-Effekte + Musik (WebAudio)
// ============================================================

const cvs = document.getElementById('game');
const W = 960, H = 540;   // logische Spielfläche in Spieleinheiten (gezeichnet wird in 480x270 Pixeln)

// ---------- Helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// ============================================================
//  AUDIO: Chiptune-Soundeffekte, Musik-Sequencer, Ambiente, Sprachausgabe
// ============================================================
let AC = null;
let audioMaster = null, sfxBus = null, musicBus = null, ambBus = null;
const PULSE = {};          // PeriodicWaves für Rechteck mit 12,5 / 25 / 50 % Tastverhältnis
let noiseBuf = null;
const MUSIC_VOL = 0.24;
const musicOn = true;          // Musik ist immer an

function initAudio(){
  if (!AC){
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
    if (AC) setupAudioGraph(AC);
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function setupAudioGraph(ac){
  audioMaster = ac.createGain();
  audioMaster.gain.value = 0.85;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 8; comp.ratio.value = 6;
  comp.attack.value = 0.003; comp.release.value = 0.2;
  audioMaster.connect(comp); comp.connect(ac.destination);
  sfxBus = ac.createGain(); sfxBus.gain.value = 1.3; sfxBus.connect(audioMaster);
  musicBus = ac.createGain(); musicBus.gain.value = musicOn ? MUSIC_VOL : 0; musicBus.connect(audioMaster);
  ambBus = ac.createGain(); ambBus.gain.value = 1; ambBus.connect(audioMaster);
  for (const d of [0.125, 0.25, 0.5]){
    const n = 48, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * d);
    PULSE[d] = ac.createPeriodicWave(re, im);
  }
  noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 1.5), ac.sampleRate);
  const ch = noiseBuf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
}

const NOTE_IDX = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
function nf(name){                       // Notenname → Frequenz ('A4' = 440 Hz)
  const m = /^([A-G](?:#|b)?)(-?\d)$/.exec(name);
  if (!m) return 440;
  const midi = (parseInt(m[2], 10) + 1) * 12 + NOTE_IDX[m[1]];
  return 440 * Math.pow(2, (midi - 69) / 12);
}

// ---------- Klang-Bausteine ----------
// Oszillator mit Hüllkurve. o: { w: 'p12'|'p25'|'p50'|'tri'|'saw'|'sine', f, f2 (Zielton), slide: 'exp'|'lin',
//   d (Dauer), v (Lautstärke), a (Anstieg), hold, arp: [Halbtöne], arpT, vib: [Hz, Tiefe], bus }
function osc(t, o){
  if (!AC) return;
  const ac = AC, os = ac.createOscillator(), g = ac.createGain();
  const w = o.w || 'p25';
  if (w[0] === 'p') os.setPeriodicWave(PULSE[w === 'p12' ? 0.125 : w === 'p25' ? 0.25 : 0.5]);
  else os.type = w === 'tri' ? 'triangle' : w === 'saw' ? 'sawtooth' : w === 'sq' ? 'square' : 'sine';
  const d = o.d || 0.1, v = o.v || 0.1, a = o.a || 0.004;
  const f = o.f || 440;
  os.frequency.setValueAtTime(f, t);
  if (o.arp){
    const st = o.arpT || 0.05;
    for (let i = 0, tt = t; tt < t + d; i++, tt += st)
      os.frequency.setValueAtTime(f * Math.pow(2, o.arp[i % o.arp.length] / 12), tt);
  } else if (o.f2){
    if (o.slide === 'lin') os.frequency.linearRampToValueAtTime(o.f2, t + d);
    else os.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + d);
  }
  if (o.vib){
    const l = ac.createOscillator(), lg = ac.createGain();
    l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1];
    l.connect(lg); lg.connect(os.frequency);
    l.start(t); l.stop(t + d + 0.05);
  }
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + a);
  if (o.hold){
    g.gain.setValueAtTime(v, t + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0005, t + d);
  } else {
    g.gain.exponentialRampToValueAtTime(0.0005, t + d);
  }
  os.connect(g); g.connect(o.bus || sfxBus);
  os.start(t); os.stop(t + d + 0.05);
}
// Rauschen durch Filter. o: { d, v, f (Filterfrequenz), f2, q, type, a, bus }
function noise(t, o){
  if (!AC) return;
  const ac = AC, src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = noiseBuf;
  src.playbackRate.value = o.rate || 1;
  fl.type = o.type || 'lowpass';
  fl.frequency.setValueAtTime(o.f || 2000, t);
  if (o.f2) fl.frequency.exponentialRampToValueAtTime(Math.max(30, o.f2), t + (o.d || 0.1));
  fl.Q.value = o.q || 0.8;
  const d = o.d || 0.1, v = o.v || 0.1;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + (o.a || 0.003));
  g.gain.exponentialRampToValueAtTime(0.0005, t + d);
  src.connect(fl); fl.connect(g); g.connect(o.bus || sfxBus);
  const off = Math.random() * 0.5;
  src.start(t, off); src.stop(t + d + 0.05);
}
// Tonfolge (Jingle): notes = [[Name, Dauer in Schritten], ...]
function jingle(t, notes, stepT, o){
  let tt = t;
  for (const [n, len] of notes){
    if (n !== '.') osc(tt, Object.assign({ f: nf(n), d: len * stepT * 0.95 }, o));
    tt += len * stepT;
  }
  return tt;
}

// ---------- Soundeffekte ----------
const SFX_GAP = { coin: 0.035, hit: 0.03, pop: 0.03, select: 0.02, land: 0.07, swing: 0.05, bosshit: 0.05, lane: 0.05, block: 0.08, laser: 0.1, grab: 0.06, check: 0.1 };
const _sfxLast = {};
let _coinStep = 0, _coinT = 0;
function sfx(name, amt){
  if (!AC || AC.state !== 'running') return;
  const now = AC.currentTime;
  if (SFX_GAP[name] && now - (_sfxLast[name] || -9) < SFX_GAP[name]) return;
  _sfxLast[name] = now;
  const t = now + 0.005;
  const v = (x) => x * (amt == null ? 1 : amt);
  switch (name){
    case 'jump':
      osc(t, { w: 'p25', f: 250, f2: 620, d: 0.15, v: 0.2 });
      osc(t, { w: 'p12', f: 500, f2: 1240, d: 0.1, v: 0.06 });
      break;
    case 'djump':
      osc(t, { w: 'p12', f: 520, f2: 1300, d: 0.14, v: 0.16 });
      osc(t + 0.05, { w: 'sine', f: 1568, d: 0.18, v: 0.08, arp: [0, 4, 7, 12], arpT: 0.035 });
      noise(t, { type: 'bandpass', f: 1200, f2: 4000, d: 0.16, v: 0.06, q: 1.2 });
      break;
    case 'land':
      noise(t, { type: 'lowpass', f: 900, f2: 180, d: 0.08, v: v(0.24) });
      osc(t, { w: 'tri', f: 130, f2: 55, d: 0.07, v: v(0.22) });
      break;
    case 'swing':
      noise(t, { type: 'bandpass', f: 1600, f2: 5200, d: 0.1, v: 0.34, q: 1.4 });
      osc(t, { w: 'p50', f: 900, f2: 420, d: 0.07, v: 0.05 });
      break;
    case 'hit':
      osc(t, { w: 'p50', f: 520, f2: 120, d: 0.09, v: 0.18 });
      noise(t, { type: 'bandpass', f: 2600, d: 0.06, v: 0.22, q: 1 });
      break;
    case 'pop':
      noise(t, { type: 'lowpass', f: 3000, f2: 300, d: 0.12, v: 0.24 });
      osc(t, { w: 'tri', f: 220, f2: 60, d: 0.1, v: 0.22 });
      osc(t + 0.03, { w: 'p25', f: nf('C6'), d: 0.16, v: 0.1, arp: [0, 7, 12], arpT: 0.04 });
      break;
    case 'bosshit':
      osc(t, { w: 'p50', f: 260, f2: 70, d: 0.14, v: 0.22 });
      noise(t, { type: 'lowpass', f: 2500, f2: 400, d: 0.12, v: 0.28 });
      break;
    case 'bossdown': {
      noise(t, { type: 'lowpass', f: 3500, f2: 90, d: 1.1, v: 0.38 });
      osc(t, { w: 'tri', f: 140, f2: 35, d: 0.8, v: 0.3 });
      osc(t + 0.12, { w: 'p50', f: 90, f2: 40, d: 0.5, v: 0.08 });
      noise(t + 0.25, { type: 'lowpass', f: 1800, f2: 120, d: 0.6, v: 0.2 });
      const st = 0.085, t2 = t + 0.75;
      jingle(t2, [['G4', 1], ['C5', 1], ['E5', 1], ['G5', 2], ['E5', 1], ['G5', 2], ['C6', 4]], st, { w: 'p25', v: 0.1 });
      jingle(t2, [['E4', 1], ['G4', 1], ['C5', 1], ['E5', 2], ['C5', 1], ['E5', 2], ['G5', 4]], st, { w: 'p12', v: 0.05 });
      jingle(t2, [['C3', 3], ['G3', 3], ['C3', 6]], st, { w: 'tri', v: 0.16 });
      break;
    }
    case 'hurt':
      osc(t, { w: 'p50', f: 420, f2: 110, d: 0.26, v: 0.22, vib: [28, 40] });
      noise(t, { type: 'bandpass', f: 1400, d: 0.08, v: 0.18 });
      break;
    case 'death': {
      const st = 0.16;
      jingle(t + 0.15, [['G4', 1], ['F#4', 1], ['F4', 1], ['E4', 3]], st, { w: 'p25', v: 0.11, vib: [7, 6] });
      jingle(t + 0.15, [['C3', 3], ['C2', 3]], st, { w: 'tri', v: 0.14 });
      break;
    }
    case 'coin': {
      // abwechselnd leicht höher, wenn viele Münzen schnell hintereinander kommen
      _coinStep = now - _coinT < 0.35 ? (_coinStep + 1) % 4 : 0; _coinT = now;
      const k = Math.pow(2, [0, 2, 4, 5][_coinStep] / 12);
      osc(t, { w: 'p25', f: 988 * k, d: 0.06, v: 0.09, hold: 0.04 });
      osc(t + 0.055, { w: 'p25', f: 1319 * k, d: 0.32, v: 0.09, hold: 0.05 });
      break;
    }
    case 'heart':
      osc(t, { w: 'p12', f: nf('C6'), d: 0.32, v: 0.1, arp: [0, 4, 7, 12, 16], arpT: 0.05 });
      osc(t, { w: 'sine', f: nf('C5'), d: 0.35, v: 0.11, arp: [0, 4, 7, 12], arpT: 0.06 });
      break;
    case 'chest':
      osc(t, { w: 'tri', f: 160, f2: 260, d: 0.16, v: 0.14 });
      noise(t, { type: 'bandpass', f: 700, d: 0.12, v: 0.08, q: 3 });
      osc(t + 0.12, { w: 'p12', f: nf('C6'), d: 0.3, v: 0.07, arp: [0, 4, 7, 12], arpT: 0.05 });
      break;
    case 'select':
      osc(t, { w: 'p25', f: 1250, d: 0.045, v: 0.2 });
      break;
    case 'right': {
      const st = 0.075;
      jingle(t, [['C5', 1], ['E5', 1], ['G5', 1], ['C6', 1], ['E6', 1], ['G6', 4]], st, { w: 'p25', v: 0.1 });
      jingle(t, [['G4', 1], ['C5', 1], ['E5', 1], ['G5', 1], ['C6', 1], ['E6', 4]], st, { w: 'p12', v: 0.05 });
      jingle(t, [['C3', 4], ['C4', 5]], st, { w: 'tri', v: 0.14 });
      break;
    }
    case 'wrong':
      osc(t, { w: 'p50', f: nf('D#4'), d: 0.16, v: 0.1, hold: 0.1 });
      osc(t + 0.17, { w: 'p50', f: nf('A#3'), d: 0.36, v: 0.1, hold: 0.2, vib: [9, 5] });
      break;
    case 'fanfare': {
      const st = 0.11;
      jingle(t, [['G4', 1], ['C5', 1], ['E5', 1], ['G5', 3], ['E5', 1], ['G5', 2], ['C6', 6]], st, { w: 'p25', v: 0.11 });
      jingle(t, [['E4', 1], ['G4', 1], ['C5', 1], ['E5', 3], ['C5', 1], ['E5', 2], ['G5', 6]], st, { w: 'p12', v: 0.05 });
      jingle(t, [['C3', 3], ['G2', 3], ['C3', 9]], st, { w: 'tri', v: 0.16 });
      noise(t + st * 9, { type: 'highpass', f: 5000, d: 0.5, v: 0.05 });
      break;
    }
    case 'powerup': {
      const sc = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23, 24];
      osc(t, { w: 'p25', f: nf('C5'), d: 0.5, v: 0.09, arp: sc, arpT: 0.032 });
      osc(t, { w: 'p12', f: nf('E5'), d: 0.5, v: 0.04, arp: sc, arpT: 0.032 });
      jingle(t + 0.5, [['C6', 2], ['G6', 6]], 0.08, { w: 'p25', v: 0.09 });
      jingle(t + 0.5, [['E5', 2], ['C6', 6]], 0.08, { w: 'p12', v: 0.05 });
      osc(t + 0.5, { w: 'tri', f: nf('C3'), d: 0.6, v: 0.15, hold: 0.3 });
      break;
    }
    case 'check':
      osc(t, { w: 'p25', f: nf('G5'), d: 0.09, v: 0.09, hold: 0.05 });
      osc(t + 0.09, { w: 'p25', f: nf('C6'), d: 0.35, v: 0.09, hold: 0.1 });
      osc(t + 0.09, { w: 'sine', f: nf('C7'), d: 0.4, v: 0.04 });
      break;
    case 'stomp':
      noise(t, { type: 'lowpass', f: 500, f2: 70, d: 0.32, v: 0.36 });
      osc(t, { w: 'tri', f: 95, f2: 32, d: 0.32, v: 0.34 });
      break;
    case 'roar':
      osc(t, { w: 'saw', f: 110, f2: 70, d: 0.8, v: 0.09, vib: [14, 9] });
      osc(t, { w: 'p50', f: 55, f2: 45, d: 0.8, v: 0.08 });
      noise(t, { type: 'lowpass', f: 900, f2: 300, d: 0.8, v: 0.18 });
      jingle(t + 0.05, [['A2', 2], ['.', 1], ['A2', 1], ['F2', 6]], 0.1, { w: 'tri', v: 0.2 });
      break;
    case 'block':
      osc(t, { w: 'p12', f: 1568, d: 0.16, v: 0.14 });
      osc(t, { w: 'p12', f: 2093, d: 0.12, v: 0.1 });
      noise(t, { type: 'highpass', f: 4000, d: 0.06, v: 0.16 });
      break;
    case 'glide':
      noise(t, { type: 'bandpass', f: 400, f2: 1600, d: 0.7, v: 0.12, q: 1.5, a: 0.15 });
      osc(t, { w: 'sine', f: 400, f2: 760, d: 0.6, v: 0.06, a: 0.1 });
      break;
    case 'bow':
      osc(t, { w: 'tri', f: 700, f2: 220, d: 0.13, v: 0.24 });
      noise(t, { type: 'highpass', f: 3000, d: 0.05, v: 0.12 });
      break;
    case 'grab':
      osc(t, { w: 'p50', f: 170, f2: 380, d: 0.07, v: 0.16 });
      noise(t, { type: 'highpass', f: 2500, d: 0.04, v: 0.12 });
      break;
    case 'laser':
      osc(t, { w: 'saw', f: 1300, f2: 260, d: 0.18, v: 0.13 });
      osc(t, { w: 'p12', f: 2600, f2: 500, d: 0.16, v: 0.08 });
      break;
    case 'robo': {
      jingle(t, [['C4', 1], ['G4', 1], ['C5', 1], ['G5', 1], ['C6', 3]], 0.07, { w: 'p25', v: 0.1 });
      noise(t, { type: 'bandpass', f: 600, f2: 2400, d: 0.35, v: 0.08, q: 4 });
      break;
    }
    case 'crash':
      noise(t, { type: 'lowpass', f: 3000, f2: 150, d: 0.55, v: 0.42 });
      osc(t, { w: 'p50', f: 140, f2: 40, d: 0.35, v: 0.12 });
      osc(t + 0.02, { w: 'p12', f: 1900, f2: 900, d: 0.18, v: 0.06 });
      break;
    case 'zap':
      osc(t, { w: 'saw', f: 1600, f2: 180, d: 0.3, v: 0.1 });
      noise(t, { type: 'highpass', f: 3500, d: 0.28, v: 0.14 });
      osc(t + 0.04, { w: 'p50', f: 90, f2: 50, d: 0.3, v: 0.1 });
      break;
    case 'honk':
      osc(t, { w: 'p50', f: 330, d: 0.14, v: 0.06, hold: 0.1 });
      osc(t, { w: 'p50', f: 415, d: 0.14, v: 0.05, hold: 0.1 });
      osc(t + 0.2, { w: 'p50', f: 330, d: 0.22, v: 0.06, hold: 0.16 });
      osc(t + 0.2, { w: 'p50', f: 415, d: 0.22, v: 0.05, hold: 0.16 });
      break;
    case 'green':
      osc(t, { w: 'p25', f: nf('E5'), d: 0.1, v: 0.1, hold: 0.06 });
      osc(t + 0.1, { w: 'p25', f: nf('B5'), d: 0.25, v: 0.1, hold: 0.12 });
      break;
    case 'red':
      osc(t, { w: 'p50', f: 440, f2: 220, d: 0.28, v: 0.14 });
      osc(t, { w: 'p50', f: 445, f2: 222, d: 0.28, v: 0.07 });
      break;
    case 'lane':
      noise(t, { type: 'bandpass', f: 900, f2: 2600, d: 0.12, v: 0.45, q: 1.2 });
      osc(t, { w: 'tri', f: 300, f2: 520, d: 0.08, v: 0.08 });
      break;
    case 'start': {
      jingle(t, [['C5', 1], ['E5', 1], ['G5', 1], ['C6', 1], ['E6', 1], ['G6', 1], ['C7', 3]], 0.05, { w: 'p25', v: 0.09 });
      noise(t + 0.3, { type: 'highpass', f: 6000, d: 0.3, v: 0.05 });
      break;
    }
    case 'portal':
      osc(t, { w: 'p12', f: 200, f2: 1800, d: 0.7, v: 0.08, vib: [12, 25] });
      osc(t + 0.1, { w: 'sine', f: nf('C6'), d: 0.6, v: 0.06, arp: [0, 4, 7, 12, 16, 19, 24], arpT: 0.06 });
      break;
    case 'respawn':
      osc(t, { w: 'p12', f: nf('C5'), d: 0.3, v: 0.1, arp: [0, 4, 7, 12], arpT: 0.06 });
      break;
  }
}

// ---------- Musik-Sequencer ----------
// Lieder werden aus Akkorden (Bass, Arpeggio) und handgeschriebenen Melodien (Achtelnoten) erzeugt.
const STEP_PER_BAR = 16;
const CHORD_SHAPES = { '': [0, 4, 7], m: [0, 3, 7], '7': [0, 4, 7, 10], m7: [0, 3, 7, 10], dim: [0, 3, 6], sus: [0, 5, 7] };
function chordNotes(sym){
  const m = /^([A-G](?:#|b)?)(.*)$/.exec(sym);
  return { root: NOTE_IDX[m[1]], shape: CHORD_SHAPES[m[2]] || CHORD_SHAPES[''] };
}
function midiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }
// Melodie in Achteln: "C5 - E5 . G5" ('-' = halten, '.' = Pause) → 16tel-Schritte
function m8(str){
  const out = [];
  for (const tok of str.trim().split(/\s+/)){
    if (tok === '|') continue;
    if (tok === '-'){ out.push('-', '-'); }
    else if (tok === '.'){ out.push('.', '.'); }
    else out.push(tok, '-');
  }
  return out;
}
// 16tel-Muster direkt: "C5 . - ."
function m16(str){ return str.trim().split(/\s+/).filter(t => t !== '|'); }
// Akkordfolge (je Takt ein oder zwei Akkorde, z. B. "C | Am | F G | C") → Liste pro Schritt
function chordSteps(prog, bars){
  const out = [];
  const barsArr = prog.split('|').map(s => s.trim().split(/\s+/));
  for (let b = 0; b < bars; b++){
    const ch = barsArr[b % barsArr.length];
    const per = STEP_PER_BAR / ch.length;
    for (let i = 0; i < STEP_PER_BAR; i++) out.push(ch[Math.floor(i / per)]);
  }
  return out;
}
// Bass aus Akkorden: style = Folge pro 16tel ('r' Grundton, 'o' Oktave, 'f' Quinte, '.' Pause, '-' halten)
function bassFrom(steps, style, oct){
  const pat = style.trim().split(/\s+/);
  return steps.map((sym, i) => {
    const tok = pat[i % pat.length];
    if (tok === '.' || tok === '-') return tok;
    const c = chordNotes(sym);
    const base = (oct + 1) * 12 + c.root;
    const midi = tok === 'o' ? base + 12 : tok === 'f' ? base + 7 : tok === 'l' ? base - 5 : base;
    return { midi };
  });
}
// Arpeggio aus Akkorden (16tel), pattern: Indizes in die Akkordtöne, '.' = Pause
function arpFrom(steps, pattern, oct){
  const pat = pattern.trim().split(/\s+/);
  return steps.map((sym, i) => {
    const tok = pat[i % pat.length];
    if (tok === '.' || tok === '-') return tok;
    const c = chordNotes(sym);
    const k = parseInt(tok, 10);
    const sh = c.shape;
    const midi = (oct + 1) * 12 + c.root + sh[k % sh.length] + 12 * Math.floor(k / sh.length);
    return { midi };
  });
}
function repeatArr(arr, n){ let out = []; for (let i = 0; i < n; i++) out = out.concat(arr); return out; }

const INST = {
  lead:  { w: 'p25', v: 0.085, a: 0.006, sus: 0.65, rel: 0.05, vib: [5.5, 0.006] },
  lead2: { w: 'p12', v: 0.075, a: 0.006, sus: 0.6, rel: 0.05, vib: [5, 0.005] },
  harm:  { w: 'p50', v: 0.035, a: 0.01, sus: 0.6, rel: 0.05 },
  bass:  { w: 'tri', v: 0.17, a: 0.004, sus: 0.9, rel: 0.03 },
  arp:   { w: 'p12', v: 0.028, a: 0.003, sus: 0.3, rel: 0.02, short: 0.8 },
  bell:  { w: 'sine', v: 0.05, a: 0.003, sus: 0.25, rel: 0.2 },
};
function playNote(inst, freq, t, dur, vol){
  if (!AC) return;
  const I = INST[inst];
  const os = AC.createOscillator(), g = AC.createGain();
  if (I.w[0] === 'p') os.setPeriodicWave(PULSE[I.w === 'p12' ? 0.125 : I.w === 'p25' ? 0.25 : 0.5]);
  else os.type = I.w === 'tri' ? 'triangle' : 'sine';
  os.frequency.setValueAtTime(freq, t);
  const v = I.v * (vol || 1);
  const d = Math.max(0.03, dur * (I.short || 1));
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + I.a);
  g.gain.setTargetAtTime(v * I.sus, t + I.a, 0.07);
  g.gain.setTargetAtTime(0.0001, t + d, I.rel / 2);
  if (I.vib && dur > 0.2){
    const l = AC.createOscillator(), lg = AC.createGain();
    l.frequency.value = I.vib[0];
    lg.gain.setValueAtTime(0, t);
    lg.gain.linearRampToValueAtTime(freq * I.vib[1], t + Math.min(0.25, dur * 0.6));
    l.connect(lg); lg.connect(os.frequency);
    l.start(t); l.stop(t + d + I.rel * 4);
  }
  os.connect(g); g.connect(musicBus);
  os.start(t); os.stop(t + d + I.rel * 4 + 0.02);
}
function playDrum(k, t, vol){
  if (!AC) return;
  const b = musicBus, vv = vol || 1;
  if (k === 'K'){
    osc(t, { w: 'sine', f: 150, f2: 42, d: 0.14, v: 0.3 * vv, bus: b });
    noise(t, { type: 'lowpass', f: 600, d: 0.03, v: 0.06 * vv, bus: b });
  } else if (k === 'S'){
    noise(t, { type: 'bandpass', f: 1900, d: 0.12, v: 0.13 * vv, q: 0.7, bus: b });
    osc(t, { w: 'tri', f: 210, f2: 140, d: 0.06, v: 0.09 * vv, bus: b });
  } else if (k === 'H'){
    noise(t, { type: 'highpass', f: 7000, d: 0.035, v: 0.045 * vv, bus: b });
  } else if (k === 'O'){
    noise(t, { type: 'highpass', f: 6000, d: 0.14, v: 0.04 * vv, bus: b });
  } else if (k === 'T'){
    osc(t, { w: 'tri', f: 180, f2: 90, d: 0.12, v: 0.16 * vv, bus: b });
  } else if (k === 'C'){
    noise(t, { type: 'highpass', f: 4500, d: 0.5, v: 0.05 * vv, bus: b });
  }
}

// Lied bauen: { bpm, bars, tracks: [{ inst, notes: [...16tel] , vol }], drums: '...' }
function buildSong(def){
  const len = def.bars * STEP_PER_BAR;
  const tracks = def.tracks.map(tr => {
    const steps = tr.notes.slice(0, len);
    while (steps.length < len) steps.push('.');
    // in Ereignisse mit Dauer umrechnen
    const ev = [];
    for (let i = 0; i < len; i++){
      const s = steps[i];
      if (s === '.' || s === '-' || s == null) continue;
      let dur = 1;
      while (i + dur < len && steps[i + dur] === '-') dur++;
      const freq = typeof s === 'object' ? midiToFreq(s.midi) : nf(s);
      ev[i] = { freq, dur };
    }
    return { inst: tr.inst, vol: tr.vol || 1, ev };
  });
  const drums = [];
  if (def.drums){
    const pat = m16(def.drums);
    for (let i = 0; i < len; i++){ const d = pat[i % pat.length]; if (d !== '.') drums[i] = d; }
  }
  if (def.fills){
    for (const [bar, f] of def.fills){
      const pat = m16(f);
      for (let i = 0; i < pat.length; i++){ const idx = bar * STEP_PER_BAR + i; if (idx < len){ drums[idx] = pat[i] === '.' ? undefined : pat[i]; } }
    }
  }
  return { bpm: def.bpm, len, tracks, drums, drumVol: def.drumVol || 1, swing: def.swing || 0, once: !!def.once };
}

let SONGS = null;                // wird beim ersten Abspielen gebaut (siehe 70_music.js)
const music = { name: null, song: null, step: 0, nextT: 0 };
function playMusic(name){
  if (music.name === name) return;
  music.name = name;
  if (!SONGS) SONGS = buildSongs();
  music.song = name ? SONGS[name] || null : null;
  music.step = 0;
  music.nextT = AC ? AC.currentTime + 0.06 : 0;
}
function musicTick(){
  if (!AC || AC.state !== 'running' || !music.song) return;
  const s = music.song, stepT = 60 / s.bpm / 4;
  const now = AC.currentTime;
  if (music.nextT < now - 0.25) music.nextT = now + 0.05;     // nach Pause (Tab im Hintergrund) neu einsetzen
  while (music.nextT < now + 0.16){
    const i = music.step;
    let t = music.nextT;
    if (s.swing && (i % 2) === 1) t += stepT * s.swing;
    for (const tr of s.tracks){
      const e = tr.ev[i];
      if (e) playNote(tr.inst, e.freq, t, e.dur * stepT, tr.vol);
    }
    const d = s.drums[i];
    if (d) for (const k of d) playDrum(k, t, s.drumVol);
    music.nextT += stepT;
    music.step++;
    if (music.step >= s.len){
      if (s.once){ music.song = null; break; }
      music.step = 0;
    }
  }
}
// Lautstärke: Musik leiser, während gesprochen wird (oder im Rätsel / nach dem Umfallen)
function updateMusicVolume(duck){
  if (!AC || !musicBus) return;
  const target = musicOn ? MUSIC_VOL * duck : 0;
  musicBus.gain.setTargetAtTime(target, AC.currentTime, 0.12);
}

// ---------- Ambiente: Motor (Welt 6) und Fahrtwind (Gleitflug) ----------
const amb = { engine: null, wind: null };
function setEngine(on, speed01){
  if (!AC || AC.state !== 'running') return;
  const t = AC.currentTime;
  if (on && !amb.engine){
    const o1 = AC.createOscillator(), o2 = AC.createOscillator(), fl = AC.createBiquadFilter(), g = AC.createGain();
    o1.type = 'sawtooth'; o2.setPeriodicWave(PULSE[0.25]);
    fl.type = 'lowpass'; fl.frequency.value = 380; fl.Q.value = 2;
    g.gain.value = 0.0001;
    o1.connect(fl); o2.connect(fl); fl.connect(g); g.connect(ambBus);
    o1.start(); o2.start();
    amb.engine = { o1, o2, fl, g };
  }
  if (!amb.engine) return;
  const e = amb.engine;
  if (!on){
    e.g.gain.setTargetAtTime(0.0001, t, 0.08);
    const old = e; amb.engine = null;
    setTimeout(() => { try { old.o1.stop(); old.o2.stop(); old.g.disconnect(); } catch (err) {} }, 500);
    return;
  }
  const f = 38 + speed01 * 62 + Math.sin(t * 7) * 1.5;
  e.o1.frequency.setTargetAtTime(f, t, 0.08);
  e.o2.frequency.setTargetAtTime(f * 2.01, t, 0.08);
  e.fl.frequency.setTargetAtTime(260 + speed01 * 700, t, 0.1);
  e.g.gain.setTargetAtTime(0.03 + speed01 * 0.035, t, 0.1);
}
function setWind(on){
  if (!AC || AC.state !== 'running') return;
  const t = AC.currentTime;
  if (on && !amb.wind){
    const src = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
    const lfo = AC.createOscillator(), lg = AC.createGain();
    src.buffer = noiseBuf; src.loop = true;
    fl.type = 'bandpass'; fl.frequency.value = 650; fl.Q.value = 0.9;
    lfo.frequency.value = 0.23; lg.gain.value = 260;
    lfo.connect(lg); lg.connect(fl.frequency);
    g.gain.value = 0.0001;
    src.connect(fl); fl.connect(g); g.connect(ambBus);
    src.start(); lfo.start();
    g.gain.setTargetAtTime(0.07, t, 0.4);
    amb.wind = { src, lfo, g };
  } else if (!on && amb.wind){
    const w = amb.wind; amb.wind = null;
    w.g.gain.setTargetAtTime(0.0001, t, 0.15);
    setTimeout(() => { try { w.src.stop(); w.lfo.stop(); w.g.disconnect(); } catch (err) {} }, 800);
  }
}

// ---------- Sprachausgabe ----------
let speechActive = false, speechId = 0;
function speak(text, onDone){
  let called = false;
  const id = ++speechId;
  const finish = () => { if (id === speechId) speechActive = false; if (!called){ called = true; if (onDone) onDone(); } };
  try {
    if (!('speechSynthesis' in window)){ finish(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE'; u.rate = 0.95; u.pitch = 1.1;
    u.onend = finish; u.onerror = finish;
    speechActive = true;
    speechSynthesis.speak(u);
  } catch(e){ finish(); }
}
function isSpeaking(){
  try { return speechActive || ('speechSynthesis' in window && speechSynthesis.speaking); } catch (e) { return false; }
}

};

const inp = {};
function pollInput(){
  let left  = keys['ArrowLeft']  || keys['KeyA'];
  let right = keys['ArrowRight'] || keys['KeyD'];
  let up    = keys['ArrowUp']    || keys['KeyW'];
  let down  = keys['ArrowDown']  || keys['KeyS'];
  let jump  = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];
  let atk   = keys['KeyX'] || keys['KeyK'] || keys['KeyF'];
  let bowHeld = keys['KeyC'] || keys['KeyV'];

  let leftP  = pressedKeys['ArrowLeft'] || pressedKeys['KeyA'];
  let rightP = pressedKeys['ArrowRight'] || pressedKeys['KeyD'];
  let upP    = pressedKeys['ArrowUp'] || pressedKeys['KeyW'];
  let downP  = pressedKeys['ArrowDown'] || pressedKeys['KeyS'];
  let jumpP  = pressedKeys['Space'] || pressedKeys['ArrowUp'] || pressedKeys['KeyW'];
  let jumpBtnP = pressedKeys['Space'];   // nur der echte Sprungknopf (ohne Hoch-Taste) — fürs Abspringen von Wänden
  let atkP   = pressedKeys['KeyX'] || pressedKeys['KeyK'] || pressedKeys['KeyF'];
  let bowP   = pressedKeys['KeyC'] || pressedKeys['KeyV'];
  let escP   = pressedKeys['Escape'];
  let quizConfirmP = pressedKeys['Space'];

  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let found = null;
  for (const gp of pads){
    if (!gp || gp.connected === false) continue;
    found = gp;
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    const b = i => gp.buttons[i] && gp.buttons[i].pressed;
    const bp = i => (gp.buttons[i] && gp.buttons[i].pressed) && !prevPadButtons[i];

    if (ax < -0.35 || b(14)) left = true;
    if (ax >  0.35 || b(15)) right = true;
    if (ay < -0.5  || b(12)) up = true;
    if (ay >  0.5  || b(13)) down = true;
    if (b(0)) jump = true;                  // A springen
    if (b(1) || b(2)) atk = true;           // B / X schlagen
    if (b(3)) bowHeld = true;               // Y Bogen

    if (bp(14)) leftP = true;
    if (bp(15)) rightP = true;
    if (bp(12)) upP = true;
    if (bp(13)) downP = true;
    if (bp(0)){ jumpP = true; jumpBtnP = true; quizConfirmP = true; }
    if (bp(1) || bp(2)) atkP = true;
    if (bp(3)) bowP = true;
    if (bp(8) || bp(9)) escP = true;

    // Stick-Flanken für Menü-Navigation (horizontal + vertikal)
    if (ax < -0.5 && !(inp._prevAx < -0.5)) leftP = true;
    if (ax >  0.5 && !(inp._prevAx >  0.5)) rightP = true;
    if (ay < -0.5 && !(inp._prevAy < -0.5)) upP = true;
    if (ay >  0.5 && !(inp._prevAy >  0.5)) downP = true;
    inp._prevAx = ax;
    inp._prevAy = ay;

    prevPadButtons = gp.buttons.map(x => x.pressed);
    if (jump || atk) initAudio();
    break;
  }
  padConnected = !!found;
  if (found && found.id !== padName){ padName = found.id; }
  if (found) padType = detectPadType(found.id);

  inp.left = left; inp.right = right; inp.up = up; inp.down = down;
  inp.jump = jump; inp.atk = atk; inp.bow = bowHeld;
  inp.leftP = leftP; inp.rightP = rightP; inp.upP = upP; inp.downP = downP;
  inp.jumpP = jumpP; inp.jumpBtnP = jumpBtnP; inp.atkP = atkP; inp.bowP = bowP; inp.escP = escP;
  inp.confirmP = jumpP || atkP;
  inp.quizP = quizConfirmP || atkP;
}

  if (!world && delta < 0) return;
  const target = clamp(cur + delta, 1, WORLD_COUNT);
  if (target === cur) return;
  resetPlayerStats();
  applyLootUpTo(target);
  particles = []; floaters = []; quiz = null; glide = null; banner = null;
  loadWorld(target);
  state = 'play'; stateT = 0;
  addFloater(player.x - 20, player.y - 40, '🛠️ Test: Welt ' + target, '#ffd24a');
}

function loadWorld(n){
  worldNum = n;
  world = n === 1 ? buildWorld1() : n === 2 ? buildWorld2() : n === 3 ? buildWorld3() : n === 4 ? buildWorld4() : n === 5 ? buildWorld5() : buildWorld6();
  setForm(world.form || 'hero');
  player.x = world.spawn.x; player.y = world.spawn.y;
  player.vx = 0; player.vy = 0; player.invuln = 1;

    player.hasBow = true; player.arrows = Math.max(player.arrows, 10); player.bowCd = 0;
    sfx('honk');

  if (world.form === 'car'){
    sfx('robo');
    burst(player.x + player.w / 2, player.y + player.h / 2, '#9fe8ff', 30, 300);
  }
  camX = clamp(player.x - W / 2, 0, world.w - W);
  camY = clamp(player.y - H * 0.55, world.top, world.killY - H);

    1: ['Finde den Paraglider!', 'Welt eins: Die Himmelsinseln! Finde den Paraglider!'],
    2: ['Klettere hoch zur besseren Welt!', 'Welt zwei: Das Waldland! Klettere hoch zur besseren Welt!'],
    3: ['Besiege die drei Wächter!', 'Welt drei: Das Wolkenschloss! Besiege die drei Wächter des Schlosses!'],
    4: ['Schnapp dir die Sprungflügel!', 'Welt vier: Die Kristallhöhle! Schnapp dir die Sprungflügel und lerne den Doppelsprung!'],
    // Tasten-/Knopfnamen passend zum Gerät: Controller verbunden → nur Controller-Namen, sonst nur Tasten
    5: ['Du bist jetzt der Wand-Hochkletterer!', 'Welt fünf: Die Roboterstadt! Du bist jetzt der Wandhochkletterer, ein geheimer Spion! Halte dich an Wänden fest und klettere mit Hoch und Runter! Mit ' + (padConnected ? padButtonSpeech('bottom') : 'der Leertaste') + ' springst du von der Wand ab!'],
