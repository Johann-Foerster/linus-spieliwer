function fitCanvas(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  cvs.style.width  = Math.floor(W * s) + 'px';
  cvs.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fitCanvas); fitCanvas();

// ---------- Helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// ---------- Audio ----------
let AC = null;
function initAudio(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type, vol, delay, slideTo){
  if (!AC) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
  g.gain.setValueAtTime(vol || 0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function sfx(name){
  switch(name){
    case 'jump':    tone(300, .18, 'square', .10, 0, 600); break;
    case 'swing':   tone(700, .09, 'sawtooth', .07, 0, 300); break;
    case 'hit':     tone(220, .12, 'square', .12, 0, 90); break;
    case 'hurt':    tone(160, .3, 'sawtooth', .14, 0, 60); break;
    case 'coin':    tone(880, .09, 'square', .09); tone(1320, .14, 'square', .09, .08); break;
    case 'heart':   tone(660, .1, 'sine', .12); tone(990, .18, 'sine', .12, .1); break;
    case 'chest':   tone(520, .1, 'triangle', .12); tone(780, .12, 'triangle', .12, .1); break;
    case 'right':   [660,830,990,1320].forEach((f,i)=>tone(f,.14,'triangle',.12,i*.09)); break;
    case 'wrong':   tone(220, .25, 'sawtooth', .1, 0, 150); break;
    case 'fanfare': [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',.13,i*.13)); break;
    case 'check':   tone(520,.1,'sine',.12); tone(1040,.2,'sine',.12,.1); break;
    case 'stomp':   tone(90, .2, 'sawtooth', .16, 0, 40); break;
    case 'roar':    tone(80, .5, 'sawtooth', .18, 0, 200); tone(60,.5,'square',.1,.05,150); break;
    case 'block':   tone(1200,.08,'square',.08,0,800); break;
    case 'glide':   tone(400,.6,'sine',.08,0,700); break;
    case 'bow':     tone(500,.12,'sine',.12,0,950); break;
    case 'djump':   tone(600,.14,'square',.1,0,1100); break;
  }
}
function speak(text, onDone){
  let called = false;
  const finish = () => { if (!called){ called = true; if (onDone) onDone(); } };
  try {
    if (!('speechSynthesis' in window)){ finish(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE'; u.rate = 0.95; u.pitch = 1.1;
    u.onend = finish; u.onerror = finish;
    speechSynthesis.speak(u);
  } catch(e){ finish(); }
}

// ---------- Input (Tastatur + Gamepad) ----------
const keys = {}, pressedKeys = {};
addEventListener('keydown', e => {
  if (!e.repeat) pressedKeys[e.code] = true;
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  initAudio();
});
addEventListener('keyup', e => { keys[e.code] = false; });

let padConnected = false, padName = '';
let prevPadButtons = [];
addEventListener('gamepadconnected', e => { padConnected = true; padName = e.gamepad.id; initAudio(); });
addEventListener('gamepaddisconnected', () => { padConnected = false; });

const inp = {};
function pollInput(){
  let left  = keys['ArrowLeft']  || keys['KeyA'];
  let right = keys['ArrowRight'] || keys['KeyD'];
  let up    = keys['ArrowUp']    || keys['KeyW'];
  let down  = keys['ArrowDown']  || keys['KeyS'];
  let jump  = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];
  let atk   = keys['KeyX'] || keys['KeyK'] || keys['KeyF'];
  let bowHeld = keys['KeyC'] || keys['KeyV'];

  let leftP  = pressedKeys['ArrowLeft'] || pressedKeys['KeyA'];
  let rightP = pressedKeys['ArrowRight'] || pressedKeys['KeyD'];
  let upP    = pressedKeys['ArrowUp'] || pressedKeys['KeyW'];
  let downP  = pressedKeys['ArrowDown'] || pressedKeys['KeyS'];
  let jumpP  = pressedKeys['Space'] || pressedKeys['ArrowUp'] || pressedKeys['KeyW'];
  let atkP   = pressedKeys['KeyX'] || pressedKeys['KeyK'] || pressedKeys['KeyF'];
  let bowP   = pressedKeys['KeyC'] || pressedKeys['KeyV'];
  let escP   = pressedKeys['Escape'];
  let quizConfirmP = pressedKeys['Space'];

  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const gp of pads){
    if (!gp) continue;
    padConnected = true;
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    const b = i => gp.buttons[i] && gp.buttons[i].pressed;
    const bp = i => (gp.buttons[i] && gp.buttons[i].pressed) && !prevPadButtons[i];

    if (ax < -0.35 || b(14)) left = true;
    if (ax >  0.35 || b(15)) right = true;
    if (ay < -0.5  || b(12)) up = true;
    if (ay >  0.5  || b(13)) down = true;
    if (b(0)) jump = true;                  // A springen
    if (b(1) || b(2)) atk = true;           // B / X schlagen
    if (b(3)) bowHeld = true;               // Y Bogen

    if (bp(14)) leftP = true;
    if (bp(15)) rightP = true;
    if (bp(12)) upP = true;
    if (bp(13)) downP = true;
    if (bp(0)){ jumpP = true; quizConfirmP = true; }
    if (bp(1) || bp(2)) atkP = true;
    if (bp(3)) bowP = true;
    if (bp(8) || bp(9)) escP = true;

    // Stick-Flanken für Menü-Navigation (horizontal + vertikal)
    if (ax < -0.5 && !(inp._prevAx < -0.5)) leftP = true;
    if (ax >  0.5 && !(inp._prevAx >  0.5)) rightP = true;
    if (ay < -0.5 && !(inp._prevAy < -0.5)) upP = true;
    if (ay >  0.5 && !(inp._prevAy >  0.5)) downP = true;
    inp._prevAx = ax;
    inp._prevAy = ay;

    prevPadButtons = gp.buttons.map(x => x.pressed);
    if (jump || atk) initAudio();
    break;
  }

  inp.left = left; inp.right = right; inp.up = up; inp.down = down;
  inp.jump = jump; inp.atk = atk; inp.bow = bowHeld;
  inp.leftP = leftP; inp.rightP = rightP; inp.upP = upP; inp.downP = downP;
  inp.jumpP = jumpP; inp.atkP = atkP; inp.bowP = bowP; inp.escP = escP;
  inp.confirmP = jumpP || atkP;
  inp.quizP = quizConfirmP || atkP;
}

// ---------- Quiz (Lern-Aufgaben) ----------
const COUNT_ITEMS = [['🍎','Äpfel'],['🍓','Erdbeeren'],['⭐','Sterne'],['🎈','Luftballons'],['🐟','Fische'],['🐞','Käfer']];
const LETTERS = 'ABDEGKLMNOPRSTW'.split('');

function numOptions(correct, max, count){
  const pool = [];
  for (let v = 1; v <= max; v++) if (v !== correct) pool.push(v);
  pool.sort(() => Math.random() - .5);
  const arr = [correct, ...pool.slice(0, count - 1)].sort(() => Math.random() - .5);
  return { options: arr.map(String), correct: arr.indexOf(correct) };
}

function makeTask(type){
  if (type === 'count' || type === 'count2'){
    const hard = type === 'count2';
    const n = Math.floor(rnd(hard ? 5 : 3, hard ? 10 : 7));
    const [emo, name] = pick(COUNT_ITEMS);
    const o = numOptions(n, hard ? 10 : 8, 6);
    return { kind: 'count', emo, n,
      question: 'Wie viele ' + name + '?',
      spoken: 'Wie viele ' + name + ' siehst du? Wähle die richtige Zahl!',
      options: o.options, correct: o.correct };
  }
  if (type === 'add' || type === 'add2'){
    const hard = type === 'add2';
    const a = Math.floor(rnd(1, hard ? 6 : 4)), b = Math.floor(rnd(1, hard ? 6 : 4));
    const [emo] = pick(COUNT_ITEMS);
    const o = numOptions(a + b, hard ? 11 : 8, 6);
    return { kind: 'add', emo, a, b,
      question: a + ' + ' + b + ' = ?',
      spoken: 'Wie viel ist ' + a + ' plus ' + b + '?',
      options: o.options, correct: o.correct };
  }
  if (type === 'pattern'){
    const pool = ['🍎', '⭐', '🎈', '🐟', '🌙', '🍄'];
    const a = pick(pool);
    let b = pick(pool); while (b === a) b = pick(pool);
    const seqFull = pick([[a,b,a,b,a,b,a], [a,a,b,b,a,a,b], [a,b,b,a,b,b,a]]);
    const seq = seqFull.slice(0, 6), answer = seqFull[6];
    let c = pick(pool); while (c === a || c === b) c = pick(pool);
    let d = pick(pool); while (d === a || d === b || d === c) d = pick(pool);
    const options = [a, b, c, d].sort(() => Math.random() - .5);
    return { kind: 'pattern', seq,
      question: 'Was kommt als Nächstes?',
      spoken: 'Schau dir das Muster genau an! Was kommt als Nächstes?',
      options, correct: options.indexOf(answer) };
  }
  if (type === 'oddone'){
    const cats = [['🍎','🍓','🍌','🍇'], ['🐶','🐱','🐭','🐰'], ['🚗','🚌','🚒','🚜'], ['👕','👖','🧢','🧦']];
    const ci = Math.floor(rnd(0, cats.length));
    let cj = Math.floor(rnd(0, cats.length)); while (cj === ci) cj = Math.floor(rnd(0, cats.length));
    const same = [...cats[ci]].sort(() => Math.random() - .5).slice(0, 3);
    const odd = pick(cats[cj]);
    const options = [...same, odd].sort(() => Math.random() - .5);
    return { kind: 'oddone',
      question: 'Was passt nicht dazu?',
      spoken: 'Schau genau! Welches Bild passt nicht zu den anderen?',
      options, correct: options.indexOf(odd) };
  }
  if (type === 'memory'){
    const pool = ['🍎', '⭐', '🎈', '🐟', '🌙', '🍄', '🐞', '🍓'];
    const memo = [];
    while (memo.length < 3){ const e = pick(pool); if (!memo.includes(e)) memo.push(e); }
    const idx = Math.floor(rnd(0, 3));
    const words = ['links', 'in der Mitte', 'rechts'];
    let extra = pick(pool); while (memo.includes(extra)) extra = pick(pool);
    const options = [...memo, extra].sort(() => Math.random() - .5);
    return { kind: 'memory', memo,
      question: 'Welches Bild war ' + words[idx] + '?',
      spoken: 'Merk dir die drei Bilder gut!',
      spokenAsk: 'Welches Bild war ' + words[idx] + '?',
      options, correct: options.indexOf(memo[idx]) };
  }
  if (type === 'sub'){
    const a = Math.floor(rnd(4, 10));
    const b = Math.floor(rnd(1, a - 1));
    const [emo] = pick(COUNT_ITEMS);
    const o = numOptions(a - b, 9, 6);
    return { kind: 'sub', emo, a, b,
      question: a + ' − ' + b + ' = ?',
      spoken: 'Wie viel ist ' + a + ' minus ' + b + '?',
      options: o.options, correct: o.correct };
  }
  // letter
  const target = pick(LETTERS);
  const set = new Set([target]);
  while (set.size < 4) set.add(pick(LETTERS));
  const arr = [...set].sort(() => Math.random() - .5);
  return { kind: 'letter', target,
    question: 'Finde das ' + target + '!',
    spoken: 'Finde den Buchstaben ' + target + '!',
    options: arr, correct: arr.indexOf(target) };
}

function startQuestionLock(text, prefix){
  // Antworten bleiben gesperrt, bis die Frage fertig vorgelesen wurde
  quiz.sel = -1;
  quiz.awaitSpeech = true;
  quiz.minT = 1.2;        // Mindest-Sperre, falls Sprachausgabe sofort endet
  quiz.failsafeT = 8;     // Notfall-Freigabe, falls kein Sprach-Ende gemeldet wird
  const q = quiz;
  speak((prefix || '') + text, () => { if (quiz === q) quiz.awaitSpeech = false; });
}

function openChest(chest){
  const task = makeTask(chest.task);
  quiz = { chest, task, sel: -1, fails: 0, penaltyT: 0,
           penaltySpeech: false, penaltyFailsafeT: 0,
           awaitSpeech: false, minT: 0, failsafeT: 0,
           phase: task.kind === 'memory' ? 'memorize' : 'ask',
           memT: 3.5, shake: 0, doneT: 0 };
  state = 'quiz'; stateT = 0;
  sfx('chest');
  if (task.kind === 'memory') speak(task.spoken);
  else startQuestionLock(task.spoken);
}

const REWARDS = {
  sword2:  { icon: '🗡️', apply(){ player.sword = 2; }, text: 'Steinschwert!', spoken: 'Super! Du hast das Steinschwert bekommen!' },
  sword3:  { icon: '⚔️', apply(){ player.sword = 3; }, text: 'Goldschwert!', spoken: 'Wow! Das Goldschwert gehört dir!' },
  sword4:  { icon: '💎', apply(){ player.sword = 4; }, text: 'Diamantschwert!', spoken: 'Unglaublich! Das Diamantschwert! Das stärkste Schwert!' },
  shield:  { icon: '🛡️', apply(){ player.hasShield = true; player.shieldCharge = player.shieldMax; }, text: 'Schild!', spoken: 'Toll! Ein Schild! Er blockt einen Treffer!' },
  heartup: { icon: '❤️', apply(){ player.maxHearts++; player.hearts = player.maxHearts; }, text: 'Extra-Herz!', spoken: 'Klasse! Ein Extraherz für dich!' },
  arrows10:{ icon: '🏹', apply(){ player.arrows = 10; }, text: 'Köcher aufgefüllt!', spoken: 'Toll! Dein Köcher ist wieder voll mit Pfeilen!' },
};

function updateQuiz(dt){
  quiz.shake = Math.max(0, quiz.shake - dt * 3);
  if (quiz.phase !== 'correct' && inp.escP){
    quiz.chest.cd = 1.2; quiz = null; state = 'play'; return;
  }
  if (quiz.phase === 'memorize'){
    quiz.memT -= dt;
    if (quiz.memT <= 0){
      quiz.phase = 'ask';
      startQuestionLock(quiz.task.spokenAsk);
    }
    return;
  }
  if (quiz.phase === 'correct'){
    quiz.doneT += dt;
    if (quiz.doneT > 2.2){
      quiz.chest.open = true;
      const r = REWARDS[quiz.chest.reward];
      r.apply();
      if (player.hasShield) player.shieldCharge = player.shieldMax;
      showBanner(r.icon + ' ' + r.text, '', 2.5);
      burst(player.x + 16, player.y, '#ffd24a', 20, 260);
      quiz = null; state = 'play';
    }
    return;
  }

  // Denkpause nach falscher Antwort — endet erst, wenn Timer UND Ansage vorbei sind
  if (quiz.penaltyT > 0 || quiz.penaltySpeech){
    quiz.penaltyT = Math.max(0, quiz.penaltyT - dt);
    quiz.penaltyFailsafeT = Math.max(0, quiz.penaltyFailsafeT - dt);
    if (quiz.penaltyFailsafeT <= 0) quiz.penaltySpeech = false;
    return;
  }
  if (quiz.fails >= 2){
    // nach 2 Fehlern: neue Frage gleichen Typs
    quiz.task = makeTask(quiz.chest.task);
    quiz.fails = 0;
    if (quiz.task.kind === 'memory'){
      quiz.phase = 'memorize'; quiz.memT = 3.5; quiz.sel = -1;
      speak('Hier kommt eine neue Frage! ' + quiz.task.spoken);
    } else {
      startQuestionLock(quiz.task.spoken, 'Hier kommt eine neue Frage! ');
    }
    return;
  }

  // Sperre, bis die Frage fertig vorgelesen wurde
  quiz.minT = Math.max(0, quiz.minT - dt);
  quiz.failsafeT = Math.max(0, quiz.failsafeT - dt);
  if (quiz.failsafeT <= 0) quiz.awaitSpeech = false;
  if (quiz.awaitSpeech || quiz.minT > 0) return;

  const n = quiz.task.options.length, cols = n === 6 ? 3 : 2;
  const rows = Math.ceil(n / cols);
  const selMove = (dx, dy) => {
    if (quiz.sel < 0){ quiz.sel = 0; sfx('swing'); return; }
    let row = Math.floor(quiz.sel / cols), col = quiz.sel % cols;
    col = (col + dx + cols) % cols;
    row = (row + dy + rows) % rows;
    quiz.sel = row * cols + col;
    sfx('swing');
  };
  if (inp.leftP) selMove(-1, 0);
  else if (inp.rightP) selMove(1, 0);
  else if (inp.upP) selMove(0, -1);
  else if (inp.downP) selMove(0, 1);

  if (inp.quizP && quiz.sel >= 0){
    if (quiz.sel === quiz.task.correct){
      quiz.phase = 'correct'; quiz.doneT = 0;
      sfx('right');
      speak(REWARDS[quiz.chest.reward].spoken);
    } else {
      quiz.fails++;
      quiz.shake = 1; quiz.sel = -1;
      quiz.penaltyT = 3;
      quiz.penaltySpeech = true;
      quiz.penaltyFailsafeT = 10;
      sfx('wrong');
      const q = quiz;
      speak(quiz.fails >= 2 ? 'Das war leider falsch. Gleich kommt eine neue Frage!'
                            : 'Fast! Denk noch einmal in Ruhe nach!',
            () => { if (quiz === q) quiz.penaltySpeech = false; });
    }
  }
}

// ---------- Spieler ----------
function hurtPlayer(dmg, fromX, knock){
  if (player.invuln > 0) return;
  const k = knock || 1;
  const dir = player.x + player.w / 2 < fromX ? -1 : 1;
  player.vx = dir * 260 * k; player.vy = -320 * Math.min(k, 1.3);
  player.invuln = 1.3;
  if (player.hasShield && player.shieldCharge > 0){
    player.shieldCharge = 0;
    sfx('block');
    addFloater(player.x, player.y - 20, '🛡️ Block!', '#7fd0ff');
    return;
  }
  player.hearts -= dmg;
  sfx('hurt');
  burst(player.x + 16, player.y + 20, '#ff5566', 12, 220);
  if (player.hearts <= 0){
    player.hearts = 0;
    state = 'dead'; stateT = 0;
    speak('Ohje! Versuch es gleich nochmal!');
  }
}

function respawn(){
  player.x = world.checkpoint.x; player.y = world.checkpoint.y - 60;
  player.vx = 0; player.vy = 0;
  player.hearts = player.maxHearts;
  if (player.hasShield) player.shieldCharge = player.shieldMax;
  player.invuln = 2;
}

function updatePlayer(dt){
  const p = player;
  p.animT += dt;
  p.invuln = Math.max(0, p.invuln - dt);
  p.attackT = Math.max(0, p.attackT - dt);
  p.coyote = Math.max(0, p.coyote - dt);
  p.jumpBuf = Math.max(0, p.jumpBuf - dt);

  // Laufen
  const wish = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  if (wish !== 0){ p.facing = wish; }
  p.vx = lerp(p.vx, wish * MOVE, 1 - Math.pow(0.0005, dt));

  // Springen (mit Coyote-Zeit + Puffer, kindgerecht großzügig)
  if (inp.jumpP) p.jumpBuf = 0.15;
  if (p.jumpBuf > 0 && (p.onGround || p.coyote > 0)){
    p.vy = JUMPV; p.onGround = false; p.coyote = 0; p.jumpBuf = 0;
    p.airJumped = false;
    sfx('jump');
  } else if (inp.jumpP && !p.onGround && p.coyote <= 0 && p.hasWings && !p.airJumped){
    // Doppelsprung
    p.airJumped = true; p.vy = JUMPV * 0.92; p.jumpBuf = 0;
    burst(p.x + p.w / 2, p.y + p.h, '#bfefff', 10, 150);
    sfx('djump');
  }
  if (!inp.jump && p.vy < -200) p.vy = -200; // variable Sprunghöhe

  // Schlagen
  if (inp.atkP && p.attackT <= 0){
    p.attackT = 0.26; p.swingId++;
    sfx('swing');
  }

  // Bogen schießen
  p.bowCd = Math.max(0, p.bowCd - dt);
  if (inp.bowP && p.hasBow && p.bowCd <= 0){
    if (p.arrows > 0){
      p.arrows--; p.bowCd = 0.45;
      world.arrows.push({ x: p.x + p.w / 2 + p.facing * 18, y: p.y + 14, vx: p.facing * 560, t: 1.4 });
      sfx('bow');
    } else {
      p.bowCd = 0.4;
      sfx('wrong');
      addFloater(p.x, p.y - 20, 'Keine Pfeile!', '#ff9a9a');
    }
  }

  // Physik
  p.vy += GRAV * dt;
  p.vy = Math.min(p.vy, 900);
  p.x += p.vx * dt;
  p.x = clamp(p.x, 0, world.w - p.w);

  const prevBottom = p.y + p.h;
  p.y += p.vy * dt;

  const wasGround = p.onGround;
  p.onGround = false;
  if (p.vy >= 0){
    for (const pl of world.platforms){
      if (p.x + p.w > pl.x + 4 && p.x < pl.x + pl.w - 4 &&
          prevBottom <= pl.y + 8 && p.y + p.h >= pl.y && p.y + p.h <= pl.y + pl.h + 18){
        p.y = pl.y - p.h; p.vy = 0; p.onGround = true; p.airJumped = false;
        break;
      }
    }
  }
  if (wasGround && !p.onGround) p.coyote = 0.12;

  // Runterfallen
  if (p.y > world.killY){
    sfx('hurt');
    player.invuln = 0;
    hurtPlayer(1, p.x);
    if (state !== 'dead') respawn();
  }
}

function swordHitbox(){
  const p = player;
  if (p.attackT < 0.08 || p.attackT > 0.22) return null;
  return { x: p.facing > 0 ? p.x + p.w - 4 : p.x - 42, y: p.y - 4, w: 46, h: p.h + 8 };
}

function dropLoot(x, y){
  const n = 1 + (Math.random() < 0.4 ? 1 : 0);
  for (let i = 0; i < n; i++){
    world.coins.push({ x: x + rnd(-10, 10), y, vx: rnd(-80, 80), vy: rnd(-320, -180), t: 8, grounded: false });
  }
  if (Math.random() < 0.22){
    world.pickups.push({ type: 'heart', x, y: y - 10, w: 26, h: 24, t: 10 });
  }
  if (player.hasBow && Math.random() < 0.2){
    world.pickups.push({ type: 'arrows', n: 2, x: x + rnd(-14, 14), y: y - 12, w: 26, h: 22, t: 12 });
  }
}

function killEnemy(e){
  e.hp = 0;
  stats.kills++;
  burst(e.x + e.w / 2, e.y + e.h / 2, e.type === 'flyer' ? '#c9a6ff' : '#79d84f', 14, 240);
  addFloater(e.x, e.y - 10, '+⭐', '#ffd24a');
  dropLoot(e.x + e.w / 2, e.y);
  sfx('hit');
}

function updateEnemies(dt){
  const hb = swordHitbox();
  for (const e of world.enemies){
    if (e.hp <= 0) continue;
    e.t += dt;
    e.flash = Math.max(0, e.flash - dt);
    if (e.type === 'slime'){
      e.x += e.dir * e.spd * dt;
      if (e.x < e.plat.x + 4){ e.x = e.plat.x + 4; e.dir = 1; }
      if (e.x + e.w > e.plat.x + e.plat.w - 4){ e.x = e.plat.x + e.plat.w - 4 - e.w; e.dir = -1; }
      e.y = e.plat.y - e.h + Math.sin(e.t * 9) * 2;
    } else {
      e.x = e.ax + Math.sin(e.t * 0.9) * e.range;
      e.y = e.ay + Math.sin(e.t * 2.2) * 26;
    }
    // Schwerttreffer
    if (hb && e.swingHit !== player.swingId && overlap(hb, e)){
      e.swingHit = player.swingId;
      e.hp -= SWORDS[player.sword].dmg;
      e.flash = 0.15;
      e.x += player.facing * 18;
      if (e.hp <= 0) killEnemy(e); else sfx('hit');
    }
    // Spieler berührt
    if (e.hp > 0 && overlap(e, player)) hurtPlayer(e.dmg, e.x + e.w / 2, e.knock);
  }
  world.enemies = world.enemies.filter(e => e.hp > 0);
}

  } else if (b.drop === 'paraglider2'){
    world.pickups.push({ type: 'paraglider2', x: cx0 - 24, y: b.groundY - 72, w: 48, h: 46, t: 999 });
    showBanner('🎉 ' + b.name + ' besiegt!', 'Der Sturmgleiter gehört dir!', 4);
    speak('Unglaublich! Der ' + b.name + ' ist besiegt! Schnapp dir den Sturmgleiter!');
  } else if (b.drop === 'heartcont'){
    world.pickups.push({ type: 'heartcont', x: cx0 - 16, y: b.groundY - 54, w: 32, h: 30, t: 999 });
    showBanner('🎉 ' + b.name + ' besiegt!', 'Er hat ein Extra-Herz fallen gelassen!', 4);
    speak('Super! Der ' + b.name + ' ist besiegt! Hol dir das Extraherz!');
  } else if (b.drop === 'key'){
    world.pickups.push({ type: 'key', x: cx0 - 18, y: b.groundY - 56, w: 36, h: 32, t: 999 });
    showBanner('🎉 ' + b.name + ' besiegt!', 'Er hat den Kristall-Schlüssel fallen gelassen!', 4);
    speak('Jaaa! Der ' + b.name + ' ist besiegt! Schnapp dir den Kristallschlüssel und öffne den Ausgang!');
  }
}

function hitBoss(b, dmg){
  b.hp -= dmg;
  b.flash = 0.18;
  sfx('hit');
  burst(b.x + b.w / 2, b.y + b.h / 2, '#fff', 8, 180);
  if (b.hp <= 0){
    b.dead = true;
    stats.kills++;
    burst(b.x + b.w / 2, b.y + b.h / 2, '#dfe9f5', 40, 340);
    sfx('fanfare');
    bossDrop(b);
  }
}

function updateBosses(dt){
  for (const b of world.bosses){
    if (b.dead) continue;
    b.t += dt;
    b.flash = Math.max(0, b.flash - dt);

    if (!b.active){
      if (Math.abs(player.x - b.x) < 500){
        b.active = true;
        showBanner('⚠️ ' + b.intro, b.introSub, 3.5);
        speak(b.introSay);
        sfx('roar');
      }
      continue;
    }

    b.vy += GRAV * 0.8 * dt;
    b.y += b.vy * dt;
    if (b.y + b.h >= b.groundY){
      if (!b.onGround){
        burst(b.x + b.w / 2, b.groundY, '#dfe9f5', 12, 180); sfx('stomp');
        if (b.shock){
          world.shocks.push({ x: b.x + b.w / 2, y: b.groundY, vx: 320, t: 2.5, minX: b.minX - 60, maxX: b.maxX + 200 });
          world.shocks.push({ x: b.x + b.w / 2, y: b.groundY, vx: -320, t: 2.5, minX: b.minX - 60, maxX: b.maxX + 200 });
        }
      }
      b.y = b.groundY - b.h; b.vy = 0; b.onGround = true;
    }
    b.jumpCd -= dt;
    if (b.onGround && b.jumpCd <= 0){
      const enraged = b.hp <= b.maxHp * 0.4;
      const dir = Math.sign(player.x - b.x) || 1;
      b.vx = dir * (enraged ? b.spdMad : b.spd);
      b.vy = b.jumpV; b.onGround = false;
      b.jumpCd = enraged ? b.hopCdMad : b.hopCd;
    }
    if (!b.onGround) b.x += b.vx * dt;
    b.x = clamp(b.x, b.minX, b.maxX);

    const hb = swordHitbox();
    if (hb && b.swingHit !== player.swingId && overlap(hb, b)){
      b.swingHit = player.swingId;
      hitBoss(b, SWORDS[player.sword].dmg);
    }
    if (!b.dead && overlap(b, player)) hurtPlayer(b.dmg, b.x + b.w / 2);
  }
}

// ---------- Schockwellen ----------
function updateShocks(dt){
  for (const s of world.shocks){
    s.t -= dt; s.x += s.vx * dt;
    if (s.x < s.minX || s.x > s.maxX) s.t = 0;
    if (s.t > 0 && overlap({ x: s.x - 14, y: s.y - 20, w: 28, h: 20 }, player)) hurtPlayer(1, s.x, 1.2);
  }
  world.shocks = world.shocks.filter(s => s.t > 0);
}

function drawShocks(){
  for (const s of world.shocks){
    const x = s.x - camX, y = s.y - camY;
    ctx.fillStyle = 'rgba(140,240,255,.9)';
    ctx.beginPath();
    ctx.moveTo(x - 16, y);
    ctx.quadraticCurveTo(x, y - 34 - Math.sin(gameT * 20) * 4, x + 16, y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.beginPath(); ctx.arc(x, y - 12, 5, 0, 7); ctx.fill();
  }
}

// ---------- Pfeile ----------
function updateArrows(dt){
  for (const a of world.arrows){
    a.t -= dt;
    a.x += a.vx * dt;
    const hitbox = { x: a.x - 14, y: a.y - 3, w: 28, h: 6 };
    for (const e of world.enemies){
      if (e.hp > 0 && overlap(hitbox, e)){
        e.hp -= BOW_DMG; e.flash = 0.15; a.t = 0;
        if (e.hp <= 0) killEnemy(e); else sfx('hit');
        break;
      }
    }
    if (a.t <= 0) continue;
    for (const b of world.bosses){
      if (!b.dead && b.active && overlap(hitbox, b)){
        a.t = 0;
        hitBoss(b, BOW_DMG);
        break;
      }
    }
  }
  world.arrows = world.arrows.filter(a => a.t > 0);
  world.enemies = world.enemies.filter(e => e.hp > 0);
}

function drawArrows(){
  for (const a of world.arrows){
    const x = a.x - camX, y = a.y - camY;
    const d = Math.sign(a.vx) || 1;
    ctx.strokeStyle = '#7a4a22'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x - 12 * d, y); ctx.lineTo(x + 8 * d, y); ctx.stroke();
    ctx.fillStyle = '#aeb9c4';
    ctx.beginPath();
    ctx.moveTo(x + 16 * d, y); ctx.lineTo(x + 7 * d, y - 5); ctx.lineTo(x + 7 * d, y + 5);
    ctx.closePath(); ctx.fill();
  }
}

// ---------- Münzen & Pickups ----------
function updateCoins(dt){
  for (const c of world.coins){
    c.t -= dt;
    if (!c.grounded){
      c.vy += GRAV * dt; c.x += c.vx * dt; c.y += c.vy * dt;
      for (const pl of world.platforms){
        if (c.vy > 0 && c.x > pl.x && c.x < pl.x + pl.w && c.y > pl.y - 6 && c.y < pl.y + 20){
          c.y = pl.y - 6; c.grounded = true;
        }
      }
      if (c.y > world.killY) c.t = 0;
    }
    if (Math.abs(c.x - (player.x + 16)) < 30 && Math.abs(c.y - (player.y + 22)) < 36){
      c.t = 0; stats.coins++; sfx('coin');
      addFloater(c.x - 10, c.y - 16, '+1', '#ffd24a');
    }
  }
  world.coins = world.coins.filter(c => c.t > 0);

  for (const pu of world.pickups){
    if (pu.type === 'heart') pu.t -= dt;
    if (!overlap(pu, player)) continue;
    if (pu.type === 'heart'){
      if (player.hearts < player.maxHearts){
        player.hearts++; pu.t = 0; sfx('heart');
        addFloater(pu.x, pu.y - 14, '+❤️', '#ff6b81');
      }
    } else if (pu.type === 'paraglider'){
      pu.t = 0;
      player.hasParaglider = true;
      player.maxHearts++; player.hearts = player.maxHearts;
      sfx('fanfare');
      speak('Der Paraglider gehört dir! Und ein Extraherz! Jetzt geht es hinunter in Welt zwei! Festhalten!');
      showBanner('🪂 Paraglider + ❤️ Extra-Herz!', 'Ab in Welt 2!', 3);
      startGlide(2, 'day');
    } else if (pu.type === 'paraglider2'){
      pu.t = 0;
      player.maxHearts++; player.hearts = player.maxHearts;
      sfx('fanfare');
      speak('Der Sturmgleiter gehört dir! Und noch ein Extraherz! Jetzt fliegen wir hinab zur geheimen Kristallhöhle! Festhalten!');
      showBanner('🪂 Sturmgleiter + ❤️ Extra-Herz!', 'Ab in Welt 4!', 3);
      startGlide(4, 'sunset');
    } else if (pu.type === 'bow'){
      pu.t = 0;
      player.hasBow = true; player.arrows = 10;
      sfx('fanfare');
      speak('Der Bogen gehört dir! Drücke C oder die obere Taste zum Schießen! Monster lassen jetzt Pfeile fallen!');
      showBanner('🏹 Bogen + voller Köcher!', 'Schießen: C-Taste oder Y am Controller', 4.5);
    } else if (pu.type === 'armor'){
      pu.t = 0;
      player.hasShield = true; player.shieldMax = 2; player.shieldCharge = 2;
      sfx('fanfare');
      speak('Die goldene Rüstung! Dein Schild blockt jetzt zwei Treffer!');
      showBanner('🛡️ Goldene Rüstung!', 'Blockt jetzt 2 Treffer!', 3.5);
    } else if (pu.type === 'arrows'){
      pu.t = 0;
      player.arrows = Math.min(10, player.arrows + pu.n);
      sfx('coin');
      addFloater(pu.x, pu.y - 14, '+' + pu.n + ' 🏹', '#ffd24a');
    } else if (pu.type === 'wings'){
      pu.t = 0;
      player.hasWings = true;
      sfx('fanfare');
      speak('Die Sprungflügel gehören dir! Drücke in der Luft noch einmal Springen für den Doppelsprung! Probier es gleich über die große Lücke!');
      showBanner('🕊️ Sprungflügel!', 'In der Luft nochmal springen = Doppelsprung!', 5);
    } else if (pu.type === 'heartcont'){
      pu.t = 0;
      player.maxHearts++; player.hearts = player.maxHearts;
      sfx('heart');
      showBanner('❤️ Extra-Herz!', '', 2.5);
      speak('Ein Extraherz! Du wirst immer stärker!');
    } else if (pu.type === 'key'){
      pu.t = 0;
      player.hasKey = true;
      sfx('fanfare');
      speak('Der Kristallschlüssel! Jetzt kannst du das Tor zum Ausgang öffnen!');
      showBanner('🗝️ Kristall-Schlüssel!', 'Auf zum Ausgang!', 3.5);
    }
  }
  world.pickups = world.pickups.filter(p => p.t > 0);
}

// ---------- Checkpoints, Truhen, Tür ----------
function updateWorldObjects(dt){
  for (const f of world.flags){
    if (!f.active && Math.abs(player.x - f.x) < 40 && Math.abs(player.y + player.h - f.y) < 60){
      f.active = true;
      world.checkpoint = { x: f.x, y: f.y };
      if (player.hasShield && player.shieldCharge < player.shieldMax){
        player.shieldCharge = player.shieldMax;
        addFloater(f.x, f.y - 80, '🛡️ aufgeladen!', '#7fd0ff');
      }
      sfx('check');
      addFloater(f.x - 30, f.y - 100, '✅ Speicherpunkt!', '#7be07b');
    }
  }
  for (const c of world.chests){
    c.cd = Math.max(0, c.cd - dt);
    if (!c.open && c.cd <= 0 && overlap(c, player) && inp.atkP){
      player.attackT = 0; // kein Schwerthieb beim Öffnen
      openChest(c);
      return;
    }
  }
  if (world.door){
    world.door.hintCd = Math.max(0, (world.door.hintCd || 0) - dt);
    if (overlap(world.door, player)){
      if (world.door.needsKey && !player.hasKey){
        if (world.door.hintCd <= 0){
          world.door.hintCd = 3;
          addFloater(world.door.x + 10, world.door.y - 30, '🗝️ Du brauchst den Schlüssel!', '#ffd24a');
          speak('Das Tor ist verschlossen! Du brauchst den Kristallschlüssel vom Höhlenkönig!');
        }
      } else if (world.door.to){
        sfx('fanfare');
        loadWorld(world.door.to);
      } else {
        state = 'win'; stateT = 0; banner = null;
        sfx('fanfare');
        speak('Fantastisch! Du hast alle vier Welten geschafft! Du bist ein echter Held!');
      }
    }
  }
}

// ---------- Paraglider-Flug ----------
function startGlide(next, style){
  const endY = next === 'win' ? 3200 : 2800;
  glide = { x: W / 2, gy: 0, endY, t: 0, coins: [], clouds: [], collected: 0, next, style };
  for (let i = 0; i < (next === 'win' ? 46 : 36); i++){
    glide.coins.push({ x: rnd(120, W - 120), gy: rnd(250, endY - 150), got: false });
  }
  for (let i = 0; i < 26; i++){
    glide.clouds.push({ x: rnd(-50, W + 50), gy: rnd(0, endY + 100), s: rnd(.5, 1.5) });
  }
  state = 'glide'; stateT = 0;
  sfx('glide');
}

function updateGlide(dt){
  glide.t += dt;
  glide.gy += 150 * dt;
  const wish = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  glide.x = clamp(glide.x + wish * 260 * dt, 60, W - 60);
  if (wish !== 0) player.facing = wish;

  for (const c of glide.coins){
    if (c.got) continue;
    const sy = 170 + (c.gy - glide.gy);
    if (Math.abs(c.x - glide.x) < 42 && Math.abs(sy - 190) < 44){
      c.got = true; glide.collected++; stats.coins++; sfx('coin');
    }
  }
  if (glide.gy >= glide.endY){
    const next = glide.next;
    glide = null;
    if (next === 'win'){
      state = 'win'; stateT = 0; banner = null;
      sfx('fanfare');
      speak('Fantastisch! Du hast alle drei Welten geschafft! Du bist ein echter Held!');
    } else {
      loadWorld(next);
      state = 'play';
    }
  }
}

// ---------- Partikel & Texte ----------
function updateFx(dt){
  for (const p of particles){
    p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt;
  }
  particles = particles.filter(p => p.t > 0);
  for (const f of floaters){ f.t -= dt; f.y -= 40 * dt; }
  floaters = floaters.filter(f => f.t > 0);
  if (banner){ banner.t -= dt; if (banner.t <= 0) banner = null; }
}

// ============================================================
//  RENDERING
// ============================================================
function font(s, weight){
  ctx.font = (weight || 'bold') + ' ' + s + 'px "Comic Sans MS","Segoe UI",sans-serif';
}
function text(str, x, y, size, color, align){
  font(size);
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color || '#fff';
  ctx.fillText(str, x, y);
}
function textOutline(str, x, y, size, color, outline){
  font(size);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 8); ctx.strokeStyle = outline || 'rgba(0,0,0,.45)';
  ctx.strokeText(str, x, y);
  ctx.fillStyle = color || '#fff';
  ctx.fillText(str, x, y);
}
function rrect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawCloudShape(x, y, s){
  ctx.beginPath();
  ctx.arc(x, y, 26 * s, 0, 7);
  ctx.arc(x + 26 * s, y + 6 * s, 20 * s, 0, 7);
  ctx.arc(x - 26 * s, y + 8 * s, 18 * s, 0, 7);
  ctx.arc(x + 4 * s, y - 12 * s, 18 * s, 0, 7);
  ctx.fill();
}

function drawBackground(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (world.theme === 'sky'){
    g.addColorStop(0, '#5db9f0'); g.addColorStop(0.7, '#a8dcf8'); g.addColorStop(1, '#e8f7ff');
  } else if (world.theme === 'castle'){
    g.addColorStop(0, '#8ea8ff'); g.addColorStop(0.6, '#cdd6ff'); g.addColorStop(1, '#ffe9c4');
  } else if (world.theme === 'cave'){
    g.addColorStop(0, '#181230'); g.addColorStop(0.5, '#2c2350'); g.addColorStop(1, '#241d3d');
  } else {
    const climb = clamp((300 - player.y) / 700, 0, 1); // höher = heller
    g.addColorStop(0, lerpColor('#7fc4e8', '#ffd9a0', climb));
    g.addColorStop(1, lerpColor('#cfeebc', '#ffeed0', climb));
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Sonne (nicht in der Höhle)
  if (world.theme !== 'cave'){
    ctx.fillStyle = 'rgba(255,235,130,.9)';
    ctx.beginPath(); ctx.arc(830 - camX * 0.05, 80 - camY * 0.05, 42, 0, 7); ctx.fill();
  }

  // Parallax-Deko
  for (const d of world.decor){
    if (d.kind === 'cloud'){
      d.x -= d.spd * 0.016;
      if (d.x < -120) d.x = world.w + 100;
      const sx = d.x - camX * 0.4, sy = d.y - camY * 0.3;
      if (sx > -150 && sx < W + 150){
        ctx.fillStyle = 'rgba(255,255,255,.75)';
        drawCloudShape(sx, sy, d.s);
      }
    } else if (d.kind === 'tree'){
      const sx = d.x - camX * 0.55, sy = 470 - camY * 0.55;
      if (sx > -100 && sx < W + 100){
        ctx.fillStyle = '#5b8f4e';
        ctx.beginPath(); ctx.arc(sx, sy - 90 * d.s, 46 * d.s, 0, 7); ctx.fill();
        ctx.fillStyle = '#7a5c3a';
        ctx.fillRect(sx - 7 * d.s, sy - 60 * d.s, 14 * d.s, 70 * d.s);
      }
    } else if (d.kind === 'tower'){
      const sx = d.x - camX * 0.45, sy = 440 - camY * 0.45;
      if (sx > -140 && sx < W + 140){
        ctx.fillStyle = 'rgba(215,224,248,.85)';
        ctx.fillRect(sx - 26 * d.s, sy - 190 * d.s, 52 * d.s, 220 * d.s);
        ctx.fillStyle = 'rgba(150,130,215,.8)';
        ctx.beginPath();
        ctx.moveTo(sx - 34 * d.s, sy - 190 * d.s);
        ctx.lineTo(sx, sy - 252 * d.s);
        ctx.lineTo(sx + 34 * d.s, sy - 190 * d.s);
        ctx.fill();
        ctx.fillStyle = 'rgba(90,90,140,.5)';
        ctx.fillRect(sx - 8 * d.s, sy - 150 * d.s, 16 * d.s, 26 * d.s);
      }
    } else if (d.kind === 'crystal'){
      const sx = d.x - camX * 0.5, sy = d.y - camY * 0.5;
      if (sx > -60 && sx < W + 60 && sy > -60 && sy < H + 60){
        ctx.globalAlpha = 0.35 + Math.sin(gameT * 2 + d.x) * 0.15;
        ctx.fillStyle = d.hue;
        ctx.beginPath();
        ctx.moveTo(sx - 12 * d.s, sy);
        ctx.lineTo(sx, sy - 34 * d.s);
        ctx.lineTo(sx + 12 * d.s, sy);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;
      }
    } else if (d.kind === 'stal'){
      const sx = d.x - camX * 0.5;
      if (sx > -40 && sx < W + 40){
        ctx.fillStyle = 'rgba(60,50,100,.8)';
        ctx.beginPath();
        ctx.moveTo(sx - 16 * d.s, -4);
        ctx.lineTo(sx, 56 * d.s);
        ctx.lineTo(sx + 16 * d.s, -4);
        ctx.closePath(); ctx.fill();
      }
    }
  }
}
function lerpColor(c1, c2, t){
  const p = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  const a = p(c1), b = p(c2);
  return 'rgb(' + a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',') + ')';
}

function drawPlatform(pl){
  const x = pl.x - camX, y = pl.y - camY;
  if (x + pl.w < -20 || x > W + 20) return;
  if (world.theme === 'sky'){
    // schwebende Insel: Fels + Grasdecke
    ctx.fillStyle = '#8d7355';
    rrect(x, y + 8, pl.w, pl.h + 10, 12); ctx.fill();
    ctx.fillStyle = '#6e5940';
    ctx.beginPath();
    ctx.moveTo(x + 14, y + pl.h + 16);
    ctx.lineTo(x + pl.w / 2, y + pl.h + 34);
    ctx.lineTo(x + pl.w - 14, y + pl.h + 16);
    ctx.fill();
    ctx.fillStyle = '#6fc84f';
    rrect(x - 3, y, pl.w + 6, 14, 7); ctx.fill();
  } else if (world.theme === 'castle'){
    ctx.fillStyle = '#c3cce4';
    rrect(x, y + 6, pl.w, pl.h + 16, 6); ctx.fill();
    ctx.fillStyle = '#e8edfa';
    rrect(x - 3, y, pl.w + 6, 12, 4); ctx.fill();
    ctx.fillStyle = '#aab6d6';
    for (let zx = x + 6; zx < x + pl.w - 12; zx += 34) ctx.fillRect(zx, y - 8, 16, 10);
    ctx.fillStyle = '#ffd24a';
    ctx.fillRect(x, y + 12, pl.w, 3);
  } else if (world.theme === 'cave'){
    ctx.fillStyle = '#4a3f66';
    rrect(x, y + 6, pl.w, pl.h + 16, 8); ctx.fill();
    ctx.fillStyle = '#6b5b96';
    rrect(x - 3, y, pl.w + 6, 12, 5); ctx.fill();
    ctx.fillStyle = '#7af0ff';
    for (let kx = x + 14; kx < x + pl.w - 12; kx += 62){
      ctx.beginPath();
      ctx.moveTo(kx, y); ctx.lineTo(kx + 6, y - 10); ctx.lineTo(kx + 12, y);
      ctx.closePath(); ctx.fill();
    }
  } else {
    ctx.fillStyle = '#8a6642';
    rrect(x, y + 6, pl.w, pl.h + 14, 8); ctx.fill();
    ctx.fillStyle = '#57b04a';
    rrect(x - 3, y, pl.w + 6, 14, 7); ctx.fill();
  }
}

function drawChest(c){
  const x = c.x - camX, y = c.y - camY;
  ctx.fillStyle = c.open ? '#9c7648' : '#b5854f';
  rrect(x, y + (c.open ? 10 : 0), c.w, c.h - (c.open ? 10 : 0), 6); ctx.fill();
  ctx.fillStyle = '#ffd24a';
  ctx.fillRect(x, y + (c.open ? 18 : 14), c.w, 6);
  ctx.fillRect(x + c.w / 2 - 4, y + (c.open ? 14 : 10), 8, 12);
  if (!c.open){
    if (overlap(c, player) && c.cd <= 0){
      textOutline('⚔️', x + c.w / 2, y - 26 + Math.sin(gameT * 6) * 4, 26);
      textOutline('Schlag-Knopf!', x + c.w / 2, y - 54, 14, '#ffd24a');
    } else {
      textOutline('❓', x + c.w / 2, y - 18 + Math.sin(gameT * 3) * 4, 22);
    }
  }
}

function drawFlag(f){

  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 70); ctx.stroke();

}

function drawDoor(){
  const d = world.door;
  const x = d.x - camX, y = d.y - camY;
  const colors = ['#ff5f5f', '#ffb14a', '#ffe94a', '#6fdc6f', '#5fa8ff', '#b06fff'];
  colors.forEach((col, i) => {

    ctx.arc(x + d.w / 2, y + d.h, d.w / 2 + 16 - i * 5, Math.PI, 0);

  });

    textOutline('🗝️', x + d.w / 2 + 30, y - 8 + Math.sin(gameT * 3) * 4, 20);

function drawSlime(e){
  const x = e.x - camX, y = e.y - camY;
  const squish = 1 + Math.sin(e.t * 9) * 0.08;
  ctx.fillStyle = e.flash > 0 ? '#fff' : (world.theme === 'sky' ? '#79d84f' : world.theme === 'castle' ? '#8f9fd6' : world.theme === 'cave' ? '#5fd0c8' : '#e2733e');
  ctx.beginPath();
  ctx.ellipse(x + e.w / 2, y + e.h - e.h / 2 * squish, e.w / 2, e.h / 2 * squish, 0, 0, 7);
  ctx.fill();
  if (world.theme === 'castle'){
    ctx.fillStyle = '#5d6c85';
    ctx.beginPath(); ctx.arc(x + e.w / 2, y + e.h / 2 - 4, 13, Math.PI, 0); ctx.fill();
  }
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x + e.w / 2 - 8, y + e.h / 2 - 2, 5, 0, 7); ctx.arc(x + e.w / 2 + 8, y + e.h / 2 - 2, 5, 0, 7); ctx.fill();
  ctx.fillStyle = '#222';
  const ed = e.dir * 2;
  ctx.beginPath(); ctx.arc(x + e.w / 2 - 8 + ed, y + e.h / 2 - 2, 2.4, 0, 7); ctx.arc(x + e.w / 2 + 8 + ed, y + e.h / 2 - 2, 2.4, 0, 7); ctx.fill();
  if (e.maxHp > 1){
    ctx.fillStyle = '#00000055'; ctx.fillRect(x, y - 10, e.w, 5);
    ctx.fillStyle = '#ff6b6b'; ctx.fillRect(x, y - 10, e.w * e.hp / e.maxHp, 5);
  }
}

function drawFlyer(e){
  const x = e.x - camX + e.w / 2, y = e.y - camY + e.h / 2;
  const flap = Math.sin(e.t * 10) * 10;
  ctx.fillStyle = e.flash > 0 ? '#fff' : '#a982e8';
  ctx.beginPath();
  ctx.moveTo(x - 26, y - flap); ctx.quadraticCurveTo(x - 14, y - 14, x, y - 4);
  ctx.quadraticCurveTo(x + 14, y - 14, x + 26, y - flap);
  ctx.quadraticCurveTo(x + 14, y + 6, x, y + 2);
  ctx.quadraticCurveTo(x - 14, y + 6, x - 26, y - flap);
  ctx.fill();
  ctx.beginPath(); ctx.arc(x, y + 2, 12, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x - 4, y, 3.6, 0, 7); ctx.arc(x + 4, y, 3.6, 0, 7); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(x - 4, y + 1, 1.8, 0, 7); ctx.arc(x + 4, y + 1, 1.8, 0, 7); ctx.fill();
  if (e.maxHp > 1){
    ctx.fillStyle = '#00000055'; ctx.fillRect(x - e.w / 2, y - 26, e.w, 5);
    ctx.fillStyle = '#ff6b6b'; ctx.fillRect(x - e.w / 2, y - 26, e.w * e.hp / e.maxHp, 5);
  }
}

const BOSS_STYLES = {
  cloud:  { body: '#e8eef7', puff: '#c8d4e8', face: '#33415c', crown: true },
  knight: { body: '#9aabce', puff: '#7e90b5', face: '#2d3a52', helmet: true },
  storm:  { body: '#5d6b80', puff: '#48566b', face: '#ffd24a', crown: true, bolt: true },
  crystal:{ body: '#b57ae0', puff: '#9055c8', face: '#2b1e42', shards: true },
  cavelord:{ body: '#544a72', puff: '#453c60', face: '#9fe8ff', crown: true, gem: true },
};

function drawBossBody(b){
  const s = BOSS_STYLES[b.style] || BOSS_STYLES.cloud;
  const x = b.x - camX, y = b.y - camY;
  const squish = b.onGround ? 1 + Math.sin(b.t * 6) * 0.05 : 1.1;
  const topY = y + b.h - b.h * squish;
  ctx.fillStyle = b.flash > 0 ? '#fff' : s.body;
  ctx.beginPath();
  ctx.ellipse(x + b.w / 2, y + b.h - (b.h / 2) * squish, b.w / 2, (b.h / 2) * squish, 0, 0, 7);
  ctx.fill();
  // seitliche Wolken-/Schulterpolster
  ctx.fillStyle = b.flash > 0 ? '#eee' : s.puff;
  ctx.beginPath();
  ctx.arc(x + b.w * 0.2, y + b.h - b.h * 0.62, b.w * 0.2, 0, 7);
  ctx.arc(x + b.w * 0.8, y + b.h - b.h * 0.62, b.w * 0.2, 0, 7);
  ctx.fill();
  if (s.crown){
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath();
    const cx0 = x + b.w / 2 - b.w * 0.24, cy0 = topY + 4, cw = b.w * 0.48;
    ctx.moveTo(cx0, cy0); ctx.lineTo(cx0, cy0 - 22); ctx.lineTo(cx0 + cw * 0.25, cy0 - 8);
    ctx.lineTo(cx0 + cw * 0.5, cy0 - 24); ctx.lineTo(cx0 + cw * 0.75, cy0 - 8); ctx.lineTo(cx0 + cw, cy0 - 22);
    ctx.lineTo(cx0 + cw, cy0); ctx.fill();
  }
  if (s.helmet){
    ctx.fillStyle = '#5d6c85';
    ctx.beginPath();
    ctx.arc(x + b.w / 2, topY + b.h * 0.34, b.w * 0.32, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(x + b.w / 2 - b.w * 0.32, topY + b.h * 0.3, b.w * 0.64, 8);
    // Helmbusch
    ctx.fillStyle = '#d94f4f';
    ctx.beginPath();
    ctx.moveTo(x + b.w / 2 - 5, topY + b.h * 0.06);
    ctx.quadraticCurveTo(x + b.w / 2, topY - 18, x + b.w / 2 + 5, topY + b.h * 0.06);
    ctx.fill();
  }
  if (s.bolt) textOutline('⚡', x + b.w / 2, y + b.h - 24, 26);
  if (s.gem) textOutline('💎', x + b.w / 2, y + b.h - 26, 26);
  if (s.shards){
    const cols = ['#7af0ff', '#ff7ad0', '#7af0ff'];
    for (let i = 0; i < 3; i++){
      const sx0 = x + b.w / 2 + (i - 1) * b.w * 0.2;
      ctx.fillStyle = cols[i];
      ctx.beginPath();
      ctx.moveTo(sx0 - 8, topY + 8);
      ctx.lineTo(sx0, topY - 18 - (i === 1 ? 8 : 0));
      ctx.lineTo(sx0 + 8, topY + 8);
      ctx.closePath(); ctx.fill();
    }
  }
  // böse Augen
  const eyeY = y + b.h * 0.44;
  ctx.fillStyle = s.face;
  ctx.beginPath();
  ctx.arc(x + b.w / 2 - b.w * 0.16, eyeY, b.w * 0.06, 0, 7);
  ctx.arc(x + b.w / 2 + b.w * 0.16, eyeY, b.w * 0.06, 0, 7);
  ctx.fill();
  ctx.strokeStyle = s.face; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x + b.w / 2 - b.w * 0.27, eyeY - 14); ctx.lineTo(x + b.w / 2 - b.w * 0.07, eyeY - 6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + b.w / 2 + b.w * 0.27, eyeY - 14); ctx.lineTo(x + b.w / 2 + b.w * 0.07, eyeY - 6); ctx.stroke();
  ctx.beginPath();
  ctx.arc(x + b.w / 2, eyeY + 22, b.w * 0.11, 0.2, Math.PI - 0.2); ctx.stroke();
}

function drawBosses(){
  let barBoss = null;
  for (const b of world.bosses){
    if (b.dead) continue;
    drawBossBody(b);
    if (b.active && (!barBoss || Math.abs(b.x - player.x) < Math.abs(barBoss.x - player.x))) barBoss = b;
  }
  if (barBoss){
    const bw = 300, bx = W / 2 - bw / 2;
    ctx.fillStyle = 'rgba(0,0,0,.4)'; rrect(bx - 4, 46, bw + 8, 22, 10); ctx.fill();
    ctx.fillStyle = '#ff5b6e'; rrect(bx, 50, bw * barBoss.hp / barBoss.maxHp, 14, 7); ctx.fill();
    textOutline(barBoss.icon + ' ' + barBoss.name, W / 2, 34, 17);
  }
}

function drawSword(level, len){
  // gezeichnet ab Griff bei (0,0) nach oben
  const s = SWORDS[level];
  ctx.fillStyle = '#6b4a2b';
  ctx.fillRect(-3, -2, 6, 12);
  ctx.fillStyle = s.color;
  ctx.fillRect(-9, -6, 18, 5);
  ctx.fillStyle = s.blade;
  ctx.beginPath();
  ctx.moveTo(-4, -6); ctx.lineTo(4, -6); ctx.lineTo(4, -len); ctx.lineTo(0, -len - 8); ctx.lineTo(-4, -len);
  ctx.closePath(); ctx.fill();
}

function drawPlayer(){
  const p = player;
  const x = p.x - camX, y = p.y - camY;
  ctx.save();
  if (p.invuln > 0 && Math.floor(p.invuln * 14) % 2 === 0) ctx.globalAlpha = 0.35;
  ctx.translate(x + p.w / 2, y + p.h);
  const walk = Math.abs(p.vx) > 20 && p.onGround ? Math.sin(p.animT * 12) * 3 : 0;

  // Beine
  ctx.fillStyle = '#3d5a99';
  ctx.fillRect(-11, -14 + walk, 9, 14 - walk);
  ctx.fillRect(2, -14 - walk, 9, 14 + walk);
  // Körper (rote Tunika)
  ctx.fillStyle = '#d94f4f';
  rrect(-13, -34, 26, 22, 6); ctx.fill();
  // Gürtel
  ctx.fillStyle = '#7a4a22'; ctx.fillRect(-13, -17, 26, 4);
  // Kopf
  ctx.fillStyle = '#ffd9b0';
  ctx.beginPath(); ctx.arc(0, -41, 11, 0, 7); ctx.fill();
  // Haare
  ctx.fillStyle = '#7a4a22';
  ctx.beginPath(); ctx.arc(0, -45, 11, Math.PI, 0); ctx.fill();
  // Augen
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(p.facing * 4, -41, 1.8, 0, 7); ctx.arc(p.facing * 8, -41, 1.8, 0, 7); ctx.fill();
  // Schild auf dem Rücken
  if (p.hasShield){
    ctx.fillStyle = p.shieldCharge > 0 ? '#5fa8ff' : '#8899aa';
    ctx.beginPath(); ctx.arc(-p.facing * 13, -25, 9, 0, 7); ctx.fill();
    ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-p.facing * 13, -25, 9, 0, 7); ctx.stroke();
  }
  // Schwert
  ctx.save();
  ctx.translate(p.facing * 13, -22);
  ctx.scale(p.facing, 1);
  let ang;
  if (p.attackT > 0){
    const k = 1 - p.attackT / 0.26;      // 0 -> 1 über den Schwung
    // kurz über dem Kopf ausholen, dann nach vorne-unten durchschlagen
    ang = lerp(-0.7, 2.1, Math.min(1, k * 1.6));
  } else {
    ang = 0.6;
  }
  ctx.rotate(ang);
  drawSword(p.sword, 26 + p.sword * 3);
  ctx.restore();
  ctx.restore();
}

// ---------- Quiz zeichnen ----------
function drawQuiz(){
  ctx.fillStyle = 'rgba(10,20,40,.55)';
  ctx.fillRect(0, 0, W, H);
  const q = quiz.task;
  const cw = 720, ch = 460;
  let cx = W / 2 - cw / 2, cy = H / 2 - ch / 2;
  if (quiz.shake > 0) cx += Math.sin(quiz.shake * 40) * 8 * quiz.shake;

  ctx.fillStyle = '#fffdf5';
  rrect(cx, cy, cw, ch, 24); ctx.fill();
  ctx.strokeStyle = '#ffb14a'; ctx.lineWidth = 6;
  rrect(cx, cy, cw, ch, 24); ctx.stroke();

  text('🔑 Truhen-Rätsel', W / 2, cy + 36, 20, '#e2731e');
  text(quiz.phase === 'memorize' ? 'Gut merken! 👀' : q.question, W / 2, cy + 78, 30, '#33415c');

  // Aufgabendarstellung
  if (q.kind === 'count'){
    const perRow = Math.min(q.n, 5);
    const rows = Math.ceil(q.n / perRow);
    for (let i = 0; i < q.n; i++){
      const r = Math.floor(i / perRow), col = i % perRow;
      const inRow = Math.min(perRow, q.n - r * perRow);
      const ix = W / 2 - (inRow - 1) * 33 + col * 66;
      text(q.emo, ix, cy + 140 + r * 62 + Math.sin(gameT * 3 + i) * 3, 40);
    }
  } else if (q.kind === 'add'){
    const drawGroup = (n, baseX) => {
      for (let i = 0; i < n; i++) text(q.emo, baseX + (i % 3) * 46 - 46, cy + 140 + Math.floor(i / 3) * 50, 34);
    };
    drawGroup(q.a, W / 2 - 190);
    text('➕', W / 2, cy + 155, 36);
    drawGroup(q.b, W / 2 + 190);
  } else if (q.kind === 'sub'){
    const perRow = Math.min(q.a, 5);
    for (let i = 0; i < q.a; i++){
      const r = Math.floor(i / perRow), col = i % perRow;
      const inRow = Math.min(perRow, q.a - r * perRow);
      const ix = W / 2 - (inRow - 1) * 33 + col * 66;
      const iy = cy + 140 + r * 62;
      text(q.emo, ix, iy, 40);
      if (i >= q.a - q.b) text('❌', ix, iy, 40);
    }
  } else if (q.kind === 'pattern'){
    const n = q.seq.length;
    for (let i = 0; i <= n; i++){
      const ix = W / 2 - n * 28 + i * 56;
      text(i < n ? q.seq[i] : '❓', ix, cy + 155, i < n ? 40 : 44);
    }
  } else if (q.kind === 'oddone'){
    for (let i = 0; i < q.options.length; i++)
      text(q.options[i], W / 2 - 195 + i * 130, cy + 155, 50);
  } else if (q.kind === 'memory'){
    const xs = [W / 2 - 180, W / 2, W / 2 + 180];
    for (let i = 0; i < 3; i++){
      ctx.fillStyle = '#e9eef7';
      rrect(xs[i] - 44, cy + 112, 88, 88, 14); ctx.fill();
      text(quiz.phase === 'memorize' ? q.memo[i] : '🎴', xs[i], cy + 155, 50);
    }
  } else {
    text('Welcher Buchstabe ist das?', W / 2, cy + 120, 16, '#8a94a8');
    text(q.target, W / 2, cy + 170, 66, '#5fa8ff');
  }

  // Antwort-Optionen
  if (quiz.phase === 'correct'){
    text('🎉 RICHTIG! 🎉', W / 2, cy + ch - 90, 40, '#3cab52');
    const r = REWARDS[quiz.chest.reward];
    text(r.icon + ' ' + r.text, W / 2, cy + ch - 42, 24, '#e2731e');
  } else if (quiz.phase === 'memorize'){
    const frac = clamp(quiz.memT / 3.5, 0, 1);
    ctx.fillStyle = '#e9eef7'; rrect(W / 2 - 200, cy + ch - 96, 400, 22, 10); ctx.fill();
    ctx.fillStyle = '#5fa8ff'; rrect(W / 2 - 197, cy + ch - 93, 394 * frac, 16, 8); ctx.fill();
    text('Gleich werden die Karten umgedreht…', W / 2, cy + ch - 44, 17, '#8a94a8');
  } else {
    const n = q.options.length, cols = n === 6 ? 3 : 2;
    const bw2 = n === 6 ? 170 : 200, bh = 74, gapX = 22, gapY = 14;
    const gridW = cols * bw2 + (cols - 1) * gapX;
    const x0 = W / 2 - gridW / 2, y0 = cy + ch - 2 * bh - gapY - 58;
    const locked = quiz.awaitSpeech || quiz.minT > 0;
    const penalty = quiz.penaltyT > 0 || quiz.penaltySpeech;
    for (let i = 0; i < n; i++){
      const bx = x0 + (i % cols) * (bw2 + gapX);
      const by = y0 + Math.floor(i / cols) * (bh + gapY);
      const sel = quiz.sel === i && !locked && !penalty;
      ctx.globalAlpha = (locked || penalty) ? 0.4 : 1;
      ctx.fillStyle = sel ? '#ffd24a' : '#e9eef7';
      rrect(bx, by, bw2, bh, 16); ctx.fill();
      if (sel){
        ctx.strokeStyle = '#e2731e'; ctx.lineWidth = 5;
        rrect(bx - 3, by - 3, bw2 + 6, bh + 6, 18); ctx.stroke();
        textOutline('👉', bx - 22, by + bh / 2, 22);
      }
      text(q.options[i], bx + bw2 / 2, by + bh / 2 + 1, 34, sel ? '#7a4a00' : '#33415c');
      ctx.globalAlpha = 1;
    }
    if (penalty){
      textOutline('🤔', W / 2, y0 + bh + gapY / 2, 36);
      text('Denk nochmal in Ruhe nach…', W / 2, cy + ch - 20, 17, '#c96a1e');
    } else if (locked){
      textOutline('👂', W / 2, y0 + bh + gapY / 2, 36);
      text('Erst gut zuhören!', W / 2, cy + ch - 20, 17, '#8a94a8');
    } else if (quiz.sel < 0){
      text('Wähle mit den Pfeilen eine Antwort aus!', W / 2, cy + ch - 20, 16, '#8a94a8');
    } else {
      text('Pfeile: wählen · Knopf: bestätigen', W / 2, cy + ch - 20, 15, '#8a94a8');
    }
  }
}

// ---------- Glide zeichnen ----------
function drawGlide(){
  const prog = glide.gy / glide.endY;
  const sunset = glide.style === 'sunset';
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (sunset){
    g.addColorStop(0, lerpColor('#6f5fd0', '#ff8a5b', prog));
    g.addColorStop(1, lerpColor('#c8a0f0', '#ffe2a8', prog));
  } else {
    g.addColorStop(0, lerpColor('#5db9f0', '#8fd0a8', prog));
    g.addColorStop(1, lerpColor('#a8dcf8', '#cfeebc', prog));
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  for (const c of glide.clouds){
    const sy = 170 + (c.gy - glide.gy) * 1.0;
    if (sy < -80 || sy > H + 80) continue;
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    drawCloudShape(c.x, sy, c.s);
  }
  for (const c of glide.coins){
    if (c.got) continue;
    const sy = 170 + (c.gy - glide.gy);
    if (sy < -40 || sy > H + 40) continue;
    textOutline('🪙', c.x, sy, 30);
  }

  // Boden kommt in Sicht
  if (glide.next !== 'win'){
    const groundY = 170 + (glide.endY + 220 - glide.gy);
    if (groundY < H + 200){
      ctx.fillStyle = glide.next === 2 ? '#57b04a' : '#4a3f66';
      ctx.beginPath();
      ctx.ellipse(W / 2, groundY + 300, 700, 330, 0, 0, 7);
      ctx.fill();
      if (glide.next === 4){
        ctx.fillStyle = '#181230';
        ctx.beginPath(); ctx.ellipse(W / 2, groundY + 90, 180, 70, 0, 0, 7); ctx.fill();
      }
    }
  }

  // Spieler mit Paraglider
  const px = glide.x, py = 190;
  const tilt = (inp.right ? 0.18 : 0) - (inp.left ? 0.18 : 0);
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(tilt);
  // Schirm (Sturmgleiter ist blau-lila)
  ctx.fillStyle = sunset ? '#5f8bff' : '#ff8b3d';
  ctx.beginPath();
  ctx.moveTo(-58, -38);
  ctx.quadraticCurveTo(0, -78, 58, -38);
  ctx.quadraticCurveTo(0, -52, -58, -38);
  ctx.fill();
  ctx.fillStyle = sunset ? '#b06fff' : '#ffd24a';
  ctx.beginPath();
  ctx.moveTo(-20, -52); ctx.quadraticCurveTo(0, -70, 20, -52);
  ctx.quadraticCurveTo(0, -60, -20, -52); ctx.fill();
  // Leinen
  ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-54, -40); ctx.lineTo(-8, 4);
  ctx.moveTo(54, -40); ctx.lineTo(8, 4);
  ctx.stroke();
  // Figur (klein)
  ctx.fillStyle = '#d94f4f'; rrect(-9, 0, 18, 20, 6); ctx.fill();
  ctx.fillStyle = '#ffd9b0'; ctx.beginPath(); ctx.arc(0, -6, 8, 0, 7); ctx.fill();
  ctx.fillStyle = '#7a4a22'; ctx.beginPath(); ctx.arc(0, -9, 8, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#3d5a99'; ctx.fillRect(-8, 19, 6, 10); ctx.fillRect(2, 19, 6, 10);
  ctx.restore();

  // Fahrtwind-Striche
  for (let i = 0; i < 8; i++){
    const wy = ((gameT * 500 + i * 97) % (H + 60)) - 30;
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo((i * 137) % W, wy); ctx.lineTo((i * 137) % W, wy + 26);
    ctx.stroke();
  }

  textOutline(sunset ? '🪂⚡ Flieg zur Kristallhöhle!' : '🪂 Flieg zu Welt 2!', W / 2, 40, 24);
  textOutline('🪙 ' + stats.coins, W - 60, 28, 20);
  // Fortschrittsbalken
  ctx.fillStyle = 'rgba(0,0,0,.3)'; rrect(W - 34, 80, 14, 380, 7); ctx.fill();
  ctx.fillStyle = '#ffd24a'; rrect(W - 31, 83 + 354 * prog, 8, 20, 4); ctx.fill();
}

// ---------- Titel & Endscreens ----------
function drawTitle(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4aa8e8'); g.addColorStop(1, '#c8ecff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,.8)';
  drawCloudShape(160 + Math.sin(gameT * .5) * 20, 120, 1.4);
  drawCloudShape(800 + Math.sin(gameT * .4 + 2) * 24, 90, 1.1);
  drawCloudShape(480 + Math.sin(gameT * .3 + 4) * 16, 430, 1.2);

  // kleine Titel-Insel
  ctx.fillStyle = '#8d7355'; rrect(360, 350, 240, 30, 12); ctx.fill();
  ctx.fillStyle = '#6fc84f'; rrect(356, 344, 248, 14, 7); ctx.fill();
  ctx.save();
  ctx.translate(480, 344);
  ctx.scale(1.3, 1.3);
  ctx.translate(-player.w / 2, -player.h);
  const save = { x: player.x, y: player.y, cx: camX, cy: camY };
  player.x = 0; player.y = 0; camX = 0; camY = 0;
  drawPlayer();
  player.x = save.x; player.y = save.y; camX = save.cx; camY = save.cy;
  ctx.restore();

  const bob = Math.sin(gameT * 2) * 8;
  textOutline('SPIELIWER', W / 2, 130 + bob, 84, '#ffd24a', 'rgba(120,60,0,.6)');
  textOutline('⚔️ Ein Abenteuer von Linus ⚔️', W / 2, 200 + bob, 24);

  if (Math.floor(gameT * 1.4) % 2 === 0)
    textOutline('Drücke A oder die Leertaste!', W / 2, 440, 26, '#fff');
  text('🕹️ laufen · A springen · B/X schlagen · Y Bogen      ⌨️ Pfeile · Leertaste · X · C Bogen', W / 2, 490, 15, 'rgba(20,40,80,.8)');
  if (padConnected) textOutline('🎮 Controller verbunden!', W / 2, 300, 18, '#7be07b');
}

function drawDead(){
  ctx.fillStyle = 'rgba(30,10,20,' + clamp(stateT, 0, .6) + ')';
  ctx.fillRect(0, 0, W, H);
  textOutline('Ohje! 💫', W / 2, H / 2 - 30, 48);
  text('Gleich geht es weiter…', W / 2, H / 2 + 30, 22, '#ffd24a');
}

function drawWin(){
  ctx.fillStyle = 'rgba(20,30,60,.72)';
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 40; i++){
    const fx = (i * 167 + gameT * 40) % W;
    const fy = (i * 89 + gameT * (60 + i % 5 * 20)) % H;
    text(['🎉','⭐','🎊','✨'][i % 4], fx, fy, 20 + i % 3 * 8);
  }
  textOutline('GESCHAFFT! 🏆', W / 2, 130, 64, '#ffd24a');
  text('Du hast alle vier Welten gemeistert!', W / 2, 200, 26, '#fff');
  const s = SWORDS[player.sword];
  text('🪙 ' + stats.coins + ' Münzen      👾 ' + stats.kills + ' Monster besiegt', W / 2, 270, 24, '#fff');
  text('⚔️ ' + s.name + (player.hasBow ? '  ·  🏹 Bogen' : '') + '      ❤️ ' + player.maxHearts + ' Herzen', W / 2, 310, 24, '#fff');
  text('Welt 5 kommt bald… 🌊', W / 2, 380, 22, '#7fd0ff');
  if (stateT > 1.5 && Math.floor(gameT * 1.4) % 2 === 0)
    textOutline('Knopf drücken für nochmal!', W / 2, 460, 24);
}

// ---------- Welt rendern ----------
function drawWorld(){
  drawBackground();
  for (const pl of world.platforms) drawPlatform(pl);
  if (world.theme === 'forest'){
    // Bohnenranke hinter dem Kletterturm
    ctx.strokeStyle = '#3f8f3a'; ctx.lineWidth = 14;
    ctx.beginPath();
    for (let yy = 480; yy > -320; yy -= 20){
      const xx = 3480 + Math.sin(yy * 0.02) * 30 - camX;
      if (yy === 480) ctx.moveTo(xx, yy - camY); else ctx.lineTo(xx, yy - camY);
    }
    ctx.stroke();
  }
  for (const f of world.flags) drawFlag(f);
  for (const c of world.chests) drawChest(c);
  if (world.door) drawDoor();
  for (const e of world.enemies){
    if (e.type === 'slime') drawSlime(e); else drawFlyer(e);
  }
  drawBosses();
  drawShocks();
  drawPickups();
  drawArrows();
  drawPlayer();
  drawFx();
  if (world.theme === 'cave'){
    // sanftes Höhlendunkel mit Lichtkreis um den Helden
    const px = player.x + player.w / 2 - camX, py = player.y + 20 - camY;
    const rg = ctx.createRadialGradient(px, py, 110, px, py, 400);
    rg.addColorStop(0, 'rgba(10,8,28,0)');
    rg.addColorStop(1, 'rgba(10,8,28,0.5)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
  }
  drawHUD();
  drawBanner();
}

// ---------- Hauptschleife ----------
function startGame(){
  resetPlayerStats();
  particles = []; floaters = []; banner = null; quiz = null; glide = null;
  loadWorld(1);
  state = 'play'; stateT = 0;
  speak('Los geht das Abenteuer!');
}

let lastTime = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.033, (now - lastTime) / 1000 || 0.016);
  lastTime = now;
  gameT += dt;
  stateT += dt;
  pollInput();

  if (state === 'title'){
    if (inp.confirmP) startGame();
    drawTitle();
  }
  else if (state === 'play'){
    updatePlayer(dt);
    if (state === 'play'){
      updateEnemies(dt);
      updateBosses(dt);
      updateArrows(dt);
      updateShocks(dt);
      updateCoins(dt);
      updateWorldObjects(dt);
    }
    updateFx(dt);
    if (world){
      camX = lerp(camX, clamp(player.x + player.w / 2 - W / 2, 0, world.w - W), 1 - Math.pow(0.001, dt));
      camY = lerp(camY, clamp(player.y - H * 0.55, world.top, world.killY - H + 100), 1 - Math.pow(0.001, dt));
    }
    if (state === 'glide') { drawGlide(); }
    else if (world) drawWorld();
    if (pressedKeys['KeyR']) { state = 'title'; }
  }
  else if (state === 'quiz'){
    updateFx(dt);
    drawWorld();
    if (quiz) { updateQuiz(dt); if (quiz) drawQuiz(); }
  }
  else if (state === 'glide'){
    updateGlide(dt);
    updateFx(dt);
    if (state === 'glide') drawGlide(); else if (world) drawWorld();
  }
  else if (state === 'dead'){
    updateFx(dt);
    drawWorld();
    drawDead();
    if (stateT > 2){
      respawn();
      state = 'play';
    }
  }
  else if (state === 'win'){
    drawWorld();
    drawWin();
    if (stateT > 1.5 && inp.confirmP){ state = 'title'; stateT = 0; }
  }

  clearPressed();
}
requestAnimationFrame(loop);
</script>
