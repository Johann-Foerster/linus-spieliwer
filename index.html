// ============================================================
//  RENDERING (Pixel-Art) — Hintergründe, Plattformen, Wände
// ============================================================
// Kamera in Pixeln (pro Bild gesetzt, inkl. Wackeln)
let CX = 0, CY = 0;
const SX = x => Math.round(x / 2) - CX;     // Spieleinheiten → Bildschirmpixel
const SY = y => Math.round(y / 2) - CY;

// deterministischer Zufall (für Deko, damit nichts flackert)
function srand(seed){
  let s = (Math.floor(seed) * 2654435761) >>> 0 || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
const _bgCache = {};
function cacheGet(key, make){ return _bgCache[key] || (_bgCache[key] = make()); }

const SKY_COLORS = {
  sky:    ['#3d8fe0', '#5cb6f2', '#8dd3f7', '#c2ebfd', '#eefaff'],
  castle: ['#7d8ff0', '#9fb0ff', '#c9cdf8', '#f2dcd0', '#ffe6c0'],
  cave:   ['#120d26', '#1d1638', '#2a2150', '#231c42', '#1a1433'],
  city:   ['#070a24', '#101640', '#1f2560', '#3a3478', '#5a4590'],
};
function skyCanvas(key, colors){
  return cacheGet('sky|' + key, () => {
    const c = newCanvas(LW, LH), g = c.getContext('2d');
    ditherV(g, 0, 0, LW, LH, colors);
    return c;
  });
}
function forestSky(climb){
  const k = Math.round(clamp(climb, 0, 1) * 6);
  const t = k / 6;
  return skyCanvas('forest' + k, [
    lerpColor('#6cb8e8', '#f2b0a0', t), lerpColor('#8ccbec', '#ffcf9c', t),
    lerpColor('#bde3e0', '#ffe2b0', t), lerpColor('#dff3c8', '#fff0d0', t),
  ]);
}

// ---------- Wolken ----------
function cloudSprite(cls, variant){
  return cacheGet('cloud|' + cls + '|' + variant, () => {
    const w = [30, 42, 56, 70][cls], h = Math.round(w * 0.52);
    const R = srand(cls * 31 + variant * 7 + 3);
    const blobs = [];
    const n = 4 + cls;
    for (let i = 0; i < n; i++){
      const bx = w * (0.18 + 0.64 * (i / (n - 1))) + (R() - 0.5) * 4;
      const r = h * (0.28 + R() * 0.2) * (1 - Math.abs(i / (n - 1) - 0.5) * 0.6);
      blobs.push([bx, h * 0.62 - r * 0.35 - R() * 3, r]);
    }
    const shape = (g, dy) => {
      for (const [bx, by, r] of blobs){ g.beginPath(); g.ellipse(bx, by + dy, r * 1.15, r, 0, 0, 7); g.fill(); }
      g.fillRect(w * 0.12, h * 0.55 + dy, w * 0.76, h * 0.3);
    };
    return pixelize(w, h + 2, g => {
      g.fillStyle = '#c7dcf2'; shape(g, 1);
      g.fillStyle = '#ffffff'; shape(g, -1);
    }, { outline: false });
  });
}
function cloudFor(s, x){
  const cls = s < 0.8 ? 0 : s < 1.1 ? 1 : s < 1.4 ? 2 : 3;
  return cloudSprite(cls, Math.abs(Math.floor(x)) % 2);
}

// ---------- Wiederholende Fernebenen ----------
function farStrip(key, h, draw){
  return cacheGet('strip|' + key, () => {
    const c = newCanvas(960, h), g = c.getContext('2d');
    draw(g, 960, h);
    return c;
  });
}
function drawStrip(c, factor, baseY, yFactor){
  const off = ((Math.round(camX / 2 * factor) % c.width) + c.width) % c.width;
  const y = Math.round(baseY - (camY / 2) * (yFactor == null ? factor : yFactor));
  if (y > LH || y + c.height < 0) return;
  ctx.drawImage(c, -off, y);
  if (c.width - off < LW) ctx.drawImage(c, c.width - off, y);
}
// Silhouette aus Sinus-Summen (nahtlos über 960 px)
function ridge(g, w, h, base, amp, cols, seed, step){
  const R = srand(seed);
  const ph = [R() * 6, R() * 6, R() * 6];
  g.fillStyle = cols;
  for (let x = 0; x < w; x += step || 1){
    const t = x / w * Math.PI * 2;
    const y = base - amp * (0.5 * Math.sin(t * 2 + ph[0]) + 0.3 * Math.sin(t * 5 + ph[1]) + 0.2 * Math.sin(t * 11 + ph[2]));
    g.fillRect(x, Math.round(y), step || 1, h);
  }
}
function stripSkyIslands(){
  return farStrip('skyIslands', 90, (g, w, h) => {
    const R = srand(11);
    for (let i = 0; i < 7; i++){
      const x = Math.floor(i * w / 7 + R() * 60), y = 22 + Math.floor(R() * 40), iw = 22 + Math.floor(R() * 34);
      const d = iw * (0.4 + R() * 0.15);
      ppoly([[x, y + 2], [x + iw, y + 2], [x + iw * 0.82, y + 2 + d * 0.45], [x + iw * 0.58, y + 2 + d], [x + iw * 0.42, y + 2 + d * 0.9], [x + iw * 0.18, y + 2 + d * 0.4]], '#93bde2', g);
      ppoly([[x + iw * 0.55, y + 2], [x + iw, y + 2], [x + iw * 0.82, y + 2 + d * 0.45], [x + iw * 0.58, y + 2 + d]], '#86b2da', g);
      g.fillStyle = '#b4dcc8'; g.fillRect(x - 1, y - 1, iw + 2, 3);
      g.fillStyle = '#c8ead6'; g.fillRect(x, y - 1, iw, 1);
    }
  });
}
function stripCloudSea(){
  return farStrip('cloudSea', 70, (g, w, h) => {
    ridge(g, w, h, 26, 10, '#d6ecfb', 5);
    ridge(g, w, h, 36, 9, '#ffffff', 9);
  });
}
function stripMountains(){
  return farStrip('mountains', 120, (g, w, h) => {
    ridge(g, w, h, 60, 40, '#9dbcd0', 21);
    ridge(g, w, h, 80, 28, '#86aac0', 23);
  });
}
function stripHills(){
  return farStrip('hills', 100, (g, w, h) => {
    ridge(g, w, h, 46, 18, '#6fae62', 31);
    ridge(g, w, h, 62, 12, '#5a9a52', 37);
  });
}
function stripForestFloor(){
  return farStrip('forestFloor', 170, (g, w, h) => {
    ridge(g, w, h, 8, 4, '#3f7a3a', 71, 2);
    ridge(g, w, h, 14, 4, '#2f6030', 73, 2);
    g.fillStyle = '#284f2a'; g.fillRect(0, 22, w, h);
    const R = srand(79);
    for (let i = 0; i < 260; i++){ g.fillStyle = R() < 0.5 ? '#2f6030' : '#1f4022'; g.fillRect(Math.floor(R() * w), 18 + Math.floor(R() * 140), 2, 1); }
  });
}
function stripCastleClouds(){
  return farStrip('castleClouds', 80, (g, w, h) => {
    ridge(g, w, h, 30, 12, '#f6d8e6', 41);
    ridge(g, w, h, 44, 10, '#ffffff', 43);
  });
}
function stripCaveRocks(){
  return farStrip('caveRocks', 150, (g, w, h) => {
    ridge(g, w, h, 70, 40, '#2b2250', 51);
    ridge(g, w, h, 100, 30, '#342a5e', 53);
    const R = srand(57);
    for (let i = 0; i < 26; i++){
      const x = Math.floor(R() * w), y = 80 + Math.floor(R() * 60);
      g.fillStyle = pick(['#ff7ad0', '#7af0ff', '#b48aff']);
      g.fillRect(x, y, 1, 1);
    }
  });
}
function stripSkyline(){
  return farStrip('skyline', 140, (g, w, h) => {
    const R = srand(61);
    let x = 0;
    while (x < w){
      const bw = 18 + Math.floor(R() * 30), bh = 40 + Math.floor(R() * 90);
      g.fillStyle = '#151b42'; g.fillRect(x, h - bh, bw, bh);
      if (R() < 0.4){ g.fillRect(x + (bw >> 1) - 1, h - bh - 8, 2, 8); }
      g.fillStyle = 'rgba(255,214,120,.35)';
      for (let wy = h - bh + 5; wy < h - 4; wy += 6) for (let wx = x + 3; wx < x + bw - 3; wx += 5) if (R() < 0.3) g.fillRect(wx, wy, 2, 2);
      x += bw + Math.floor(R() * 4);
    }
  });
}

// ---------- Deko-Sprites ----------
function treeSprite(cls){
  return cacheGet('tree|' + cls, () => {
    const w = [34, 44, 54][cls], h = Math.round(w * 1.5);
    return pixelize(w + 4, h + 2, g => {
      const cx = (w + 4) / 2;
      g.fillStyle = '#6b4a2c'; g.fillRect(cx - w * 0.08, h * 0.5, w * 0.16, h * 0.5);
      g.fillStyle = '#4e3520'; g.fillRect(cx + w * 0.02, h * 0.5, w * 0.06, h * 0.5);
      const blob = (x, y, r, c) => { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, r, r * 0.9, 0, 0, 7); g.fill(); };
      blob(cx - w * 0.18, h * 0.42, w * 0.26, '#2f7a3a'); blob(cx + w * 0.18, h * 0.42, w * 0.26, '#2f7a3a');
      blob(cx, h * 0.3, w * 0.32, '#2f7a3a');
      blob(cx - w * 0.1, h * 0.27, w * 0.24, '#46a145'); blob(cx + w * 0.12, h * 0.36, w * 0.2, '#46a145');
      blob(cx - w * 0.14, h * 0.2, w * 0.1, '#7fd05a');
    });
  });
}
function towerSprite(cls){
  return cacheGet('tower|' + cls, () => {
    const w = [24, 30, 36][cls], h = w * 4.4;
    return pixelize(w + 16, Math.round(h) + 4, g => {
      const cx = (w + 16) / 2, top = h * 0.24;
      g.fillStyle = '#d7e0f8'; g.fillRect(cx - w / 2, top, w, h - top);
      g.fillStyle = '#b6c2e6'; g.fillRect(cx + w * 0.18, top, w * 0.32, h - top);
      g.fillStyle = '#9682d7'; ppoly([[cx - w * 0.68, top + 1], [cx, 2], [cx + w * 0.68, top + 1]], '#9682d7', g);
      g.fillStyle = '#7a62c0'; ppoly([[cx, 2], [cx + w * 0.68, top + 1], [cx + w * 0.2, top + 1]], '#7a62c0', g);
      g.fillStyle = '#5a5a8c'; g.fillRect(cx - w * 0.14, top + h * 0.16, w * 0.28, w * 0.5);
      g.fillStyle = '#ffd24a'; g.fillRect(cx - w * 0.14, top + h * 0.16, w * 0.28, 2);
    });
  });
}
function crystalSprite(hue, cls){
  return cacheGet('crys|' + hue + cls, () => {
    const w = [10, 14, 20][cls], h = Math.round(w * 1.9);
    const dark = mixHex(hue, '#1a1433', 0.45), light = mixHex(hue, '#ffffff', 0.55);
    return pixelize(w + 2, h + 2, g => {
      ppoly([[1, h + 1], [w * 0.3, h * 0.35], [w * 0.5, 1], [w * 0.7, h * 0.4], [w + 1, h + 1]], hue, g);
      ppoly([[w * 0.5, 1], [w * 0.7, h * 0.4], [w + 1, h + 1], [w * 0.55, h + 1]], dark, g);
      ppoly([[w * 0.32, h * 0.45], [w * 0.46, h * 0.2], [w * 0.46, h * 0.7]], light, g);
    }, { outline: false });
  });
}
function stalSprite(cls){
  return cacheGet('stal|' + cls, () => {
    const w = [16, 24, 32][cls], h = Math.round(w * 2.2);
    return pixelize(w + 2, h + 2, g => {
      ppoly([[1, 0], [w + 1, 0], [w * 0.55, h], [w * 0.45, h]], '#3c3270', g);
      ppoly([[w * 0.55, 0], [w + 1, 0], [w * 0.55, h]], '#2c2458', g);
    }, { outline: false });
  });
}
function buildingCanvas(d){
  if (d._c) return d._c;
  const w = Math.round(d.w / 2) * 2, h = Math.round(d.h);
  const c = newCanvas(w, h + 150), g = c.getContext('2d');
  g.fillStyle = d.hue; g.fillRect(0, 0, w, h + 150);
  g.fillStyle = 'rgba(255,255,255,.06)'; g.fillRect(0, 0, w, 2);
  g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(w - 6, 0, 6, h + 150);
  const R = srand(d.x);
  for (let wy = 7; wy < h + 140; wy += 12) for (let wx = 4; wx < w - 8; wx += 10){
    if (R() < 0.72){ g.fillStyle = R() < 0.85 ? '#ffd67a' : '#9fe8ff'; g.fillRect(wx, wy, 4, 5); g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(wx, wy + 4, 4, 1); }
  }
  return (d._c = c);
}

// ---------- Hintergrund je Welt ----------
function drawBackground(){
  const th = world.theme;
  if (th === 'forest'){
    const climb = clamp((300 - player.y) / 700, 0, 1);
    ctx.drawImage(forestSky(climb), 0, 0);
  } else {
    ctx.drawImage(skyCanvas(th, SKY_COLORS[th]), 0, 0);
  }

  // Mond in der Roboter-Stadt, sonst Sonne (nicht in der Höhle)
  if (th === 'city'){
    const mx = Math.round(380 - camX * 0.025), my = Math.round(45 - camY * 0.025);
    pellipse(mx - 19, my - 19, 38, 38, 'rgba(220,225,255,.12)');
    pellipse(mx - 17, my - 17, 34, 34, '#eef0ff');
    pellipse(mx - 9, my - 9, 8, 7, '#c9cdf0'); pellipse(mx + 4, my + 3, 6, 5, '#c9cdf0'); pellipse(mx - 2, my + 9, 4, 3, '#c9cdf0');
  } else if (th !== 'cave'){
    const sx = Math.round(415 - camX * 0.025), sy = Math.round(40 - camY * 0.025);
    pellipse(sx - 26, sy - 26, 52, 52, 'rgba(255,240,160,.25)');
    pellipse(sx - 22, sy - 22, 44, 44, '#ffe27a');
    pellipse(sx - 19, sy - 19, 38, 38, '#fff2b0');
    pellipse(sx - 14, sy - 15, 12, 8, '#ffffff');
  }

  // Fernebenen
  if (th === 'sky'){ drawStrip(stripSkyIslands(), 0.12, 140, 0.06); drawStrip(stripCloudSea(), 0.22, 210, 0.1); }
  else if (th === 'forest'){
    drawStrip(stripMountains(), 0.12, 130, 0.08); drawStrip(stripHills(), 0.28, 175, 0.2);
    drawStrip(stripForestFloor(), 0.55, 222, 0.55);   // Waldboden hinter den Bäumen (gleiche Tiefe wie die Bäume)
  }
  else if (th === 'castle'){ drawStrip(stripCastleClouds(), 0.2, 205, 0.12); }
  else if (th === 'cave'){ drawStrip(stripCaveRocks(), 0.25, 110, 0.2); }
  else if (th === 'city'){ drawStrip(stripSkyline(), 0.18, 140, 0.1); }

  // Parallax-Deko (Positionen aus den Welt-Daten)
  for (const d of world.decor){
    if (d.kind === 'cloud'){
      d.x -= d.spd * 0.016;
      if (d.x < -120) d.x = world.w + 100;
      const spc = cloudFor(d.s, d.x);
      const sx = Math.round((d.x - camX * 0.4) / 2 - spc.width / 2), sy = Math.round((d.y - camY * 0.3) / 2 - spc.height / 2);
      if (sx > -spc.width && sx < LW && sy > -spc.height && sy < LH) ctx.drawImage(spc, sx, sy);
    } else if (d.kind === 'tree'){
      const t = treeSprite(d.s < 0.9 ? 0 : d.s < 1.15 ? 1 : 2);
      const sx = Math.round((d.x - camX * 0.55) / 2 - t.width / 2), sy = Math.round((452 - camY * 0.55) / 2 - t.height);
      if (sx > -t.width && sx < LW) ctx.drawImage(t, sx, sy);
    } else if (d.kind === 'tower'){
      const t = towerSprite(d.s < 0.95 ? 0 : d.s < 1.2 ? 1 : 2);
      const sx = Math.round((d.x - camX * 0.45) / 2 - t.width / 2), sy = Math.round((440 - camY * 0.45) / 2 - t.height + 14);
      if (sx > -t.width && sx < LW) ctx.drawImage(t, sx, sy);
    } else if (d.kind === 'crystal'){
      const t = crystalSprite(d.hue, d.s < 0.8 ? 0 : d.s < 1.1 ? 1 : 2);
      const sx = Math.round((d.x - camX * 0.5) / 2 - t.width / 2), sy = Math.round((d.y - camY * 0.5) / 2 - t.height);
      if (sx > -t.width && sx < LW && sy > -t.height && sy < LH){
        ctx.globalAlpha = 0.5 + Math.sin(gameT * 2 + d.x) * 0.2;
        ctx.drawImage(t, sx, sy);
        ctx.globalAlpha = 1;
      }
    } else if (d.kind === 'stal'){
      const t = stalSprite(d.s < 0.9 ? 0 : d.s < 1.2 ? 1 : 2);
      const sx = Math.round((d.x - camX * 0.5) / 2 - t.width / 2);
      if (sx > -t.width && sx < LW) ctx.drawImage(t, sx, -2);
    } else if (d.kind === 'star'){
      const sx = Math.round((d.x - camX * 0.1) / 2), sy = Math.round((d.y - camY * 0.1) / 2);
      if (sx >= 0 && sx < LW && sy >= 0 && sy < LH){
        const tw = Math.sin(gameT * 3 + d.x);
        ctx.fillStyle = tw > 0.3 ? '#ffffff' : '#9aa6e0';
        ctx.fillRect(sx, sy, 1, 1);
        if (d.s > 2 && tw > 0.7){ ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(sx - 1, sy, 3, 1); ctx.fillRect(sx, sy - 1, 1, 3); }
      }
    } else if (d.kind === 'building'){
      const bc = buildingCanvas(d);
      const sx = Math.round((d.x - camX * 0.35) / 2), base = Math.round((520 - camY * 0.35) / 2);
      if (sx + bc.width > 0 && sx < LW) ctx.drawImage(bc, sx, base - Math.round(d.h / 2) - 4);
    } else if (d.kind === 'spot'){
      const sx = (d.x - camX * 0.35) / 2, base = (520 - camY * 0.35) / 2;
      if (sx > -250 && sx < LW + 250){
        const ang = -Math.PI / 2 + Math.sin(gameT * d.spd + d.phase) * 0.6;
        ppoly([[sx, base], [sx + Math.cos(ang - 0.1) * 450, base + Math.sin(ang - 0.1) * 450],
               [sx + Math.cos(ang + 0.1) * 450, base + Math.sin(ang + 0.1) * 450]], 'rgba(255,255,210,.08)');
      }
    }
  }
}

// ---------- Plattformen ----------
function platformCanvas(pl){
  const th = world.theme;
  if (pl._c && pl._th === th) return pl._c;
  const w = Math.round(pl.w / 2), R = srand(pl.x * 7 + pl.y * 13 + 5);
  let c, ox = 0, oy = 0;
  if (th === 'sky'){
    // schwebende Insel: Grasdecke, Erde, felsige Unterseite
    const depth = 16 + Math.min(18, Math.round(w * 0.12));
    c = newCanvas(w + 4, depth + 8); ox = -2; oy = -1;
    const g = c.getContext('2d');
    const pts = [[2, 4], [w + 2, 4], [w + 2, 12]];
    const n = Math.max(3, Math.round(w / 14));
    for (let i = n; i >= 0; i--){
      const x = 2 + w * i / n;
      const yy = 12 + (depth - 6) * Math.sin(Math.PI * (i / n)) * (0.75 + R() * 0.25) + (i % 2 ? 2 : 0);
      pts.push([x, yy]);
    }
    pts.push([2, 12]);
    ppoly(pts.map(p => [p[0], p[1] + 0]), OUT, g);
    ppoly(pts.map(p => [p[0] + (p[0] < w / 2 ? 1 : -1), p[1] - 1]), '#8d6a4a', g);
    // Steinschichten (nur dort, wo schon Erde ist)
    const img = g.getImageData(0, 0, c.width, c.height), dd = img.data;
    const dirt = i => dd[i * 4 + 3] && dd[i * 4] === 0x8d && dd[i * 4 + 1] === 0x6a;
    for (let i = 0; i < w / 3; i++){
      const x = 3 + Math.floor(R() * (w - 4)), y = 13 + Math.floor(R() * (depth - 4)), len = 2 + Math.floor(R() * 3);
      const col = R() < 0.5 ? [0x6e, 0x4f, 0x36] : [0xa7, 0x83, 0x5c];
      for (let k = 0; k < len; k++){
        const j = y * c.width + x + k;
        if (x + k < c.width && dirt(j)){ dd[j * 4] = col[0]; dd[j * 4 + 1] = col[1]; dd[j * 4 + 2] = col[2]; }
      }
    }
    g.putImageData(img, 0, 0);
    g.fillStyle = '#6e4f36'; g.fillRect(3, 11, w - 2, 2);
    // Gras
    g.fillStyle = OUT; g.fillRect(1, 0, w + 2, 9);
    g.fillStyle = '#3f9a3a'; g.fillRect(2, 1, w, 7);
    g.fillStyle = '#6fcf4f'; g.fillRect(2, 1, w, 4);
    g.fillStyle = '#a8ee7a'; g.fillRect(2, 1, w, 1);
    for (let x = 3; x < w; x += 2 + Math.floor(R() * 4)){ g.fillStyle = '#3f9a3a'; g.fillRect(x, 8, 2, 1 + Math.floor(R() * 2)); }
    for (let x = 4; x < w - 2; x += 5 + Math.floor(R() * 9)){
      g.fillStyle = '#a8ee7a'; g.fillRect(x, 0, 1, 1);
      if (R() < 0.25){ g.fillStyle = pick(['#ffffff', '#ffd93d', '#ff9aa8']); g.fillRect(x + 1, 2, 1, 1); }
    }
  } else if (th === 'forest'){
    const ground = pl.y >= 380;
    const depth = ground ? 160 : 12;
    c = newCanvas(w + 2, depth + 2); ox = -1; oy = -1;
    const g = c.getContext('2d');
    g.fillStyle = OUT; g.fillRect(0, 0, w + 2, depth + 2);
    g.fillStyle = '#7a5434'; g.fillRect(1, 1, w, depth);
    g.fillStyle = '#5e3f26';
    for (let i = 0; i < w * depth / 40; i++) g.fillRect(1 + Math.floor(R() * (w - 2)), 9 + Math.floor(R() * (depth - 8)), 2, 1);
    g.fillStyle = '#9a7048';
    for (let i = 0; i < w * depth / 70; i++) g.fillRect(1 + Math.floor(R() * (w - 2)), 9 + Math.floor(R() * (depth - 8)), 1, 1);
    if (ground){ g.fillStyle = 'rgba(20,10,30,.35)'; g.fillRect(1, 60, w, depth); g.fillStyle = 'rgba(20,10,30,.3)'; g.fillRect(1, 100, w, depth); }
    g.fillStyle = '#3c8a36'; g.fillRect(1, 1, w, 7);
    g.fillStyle = '#5bb54a'; g.fillRect(1, 1, w, 4);
    g.fillStyle = '#8fe06a'; g.fillRect(1, 1, w, 1);
    for (let x = 2; x < w; x += 2 + Math.floor(R() * 4)){ g.fillStyle = '#3c8a36'; g.fillRect(x, 8, 2, 1 + Math.floor(R() * 2)); }
    if (!ground){ g.fillStyle = '#5e3f26'; g.fillRect(1, depth - 2, w, 2); }
  } else if (th === 'castle'){
    c = newCanvas(w + 2, 24); ox = -1; oy = -1;
    const g = c.getContext('2d');
    g.fillStyle = OUT; g.fillRect(0, 0, w + 2, 18);
    g.fillStyle = '#c9d2ec'; g.fillRect(1, 1, w, 16);
    // Ziegel
    g.fillStyle = '#aab6d6';
    for (let row = 0; row < 3; row++){
      const y = 7 + row * 4;
      g.fillRect(1, y, w, 1);
      for (let x = 1 + (row % 2) * 6; x < w; x += 12) g.fillRect(x, y - 3, 1, 3);
    }
    g.fillStyle = '#eef2fc'; g.fillRect(1, 1, w, 3);
    g.fillStyle = '#ffffff'; g.fillRect(1, 1, w, 1);
    g.fillStyle = '#ffd24a'; g.fillRect(1, 5, w, 1);
    g.fillStyle = '#d9a21b'; g.fillRect(1, 6, w, 1);
    // Wolkenbausch darunter
    for (let x = 2; x < w - 4; x += 9){
      pellipse(x - 1, 15, 12, 8, OUT, g); pellipse(x, 16, 10, 6, '#ffffff', g);
    }
    for (let x = 2; x < w - 4; x += 9){ pellipse(x, 16, 10, 5, '#ffffff', g); }
    g.fillStyle = '#e2e8fb'; g.fillRect(1, 17, w, 1);
  } else if (th === 'cave'){
    c = newCanvas(w + 2, 24); ox = -1; oy = -1;
    const g = c.getContext('2d');
    g.fillStyle = OUT; g.fillRect(0, 0, w + 2, 18);
    const bottom = [];
    for (let x = 0; x < w + 2; x++) bottom.push(18 + Math.round(2 + 2 * Math.sin(x * 0.4 + pl.x) + R() * 2));
    for (let x = 0; x < w + 2; x++){ g.fillRect(x, 17, 1, bottom[x] - 17); }
    g.fillStyle = '#4a3f78';
    for (let x = 1; x < w + 1; x++) g.fillRect(x, 1, 1, bottom[x] - 2);
    g.fillStyle = '#3a3062';
    for (let i = 0; i < w / 4; i++) g.fillRect(1 + Math.floor(R() * (w - 2)), 7 + Math.floor(R() * 10), 3, 1);
    g.fillStyle = '#6b5b9e'; g.fillRect(1, 1, w, 4);
    g.fillStyle = '#8f7fd0'; g.fillRect(1, 1, w, 1);
    // Kristalle an der Kante
    for (let x = 6; x < w - 6; x += 24 + Math.floor(R() * 14)){
      const col = pick(['#7af0ff', '#ff7ad0', '#b48aff']);
      ppoly([[x, 9], [x + 2, 4], [x + 4, 9]], col, g);
      g.fillStyle = '#ffffff'; g.fillRect(x + 2, 5, 1, 1);
    }
  } else {
    // Roboter-Stadt: Stahlträger mit Neonband
    c = newCanvas(w + 2, 22); ox = -1; oy = -1;
    const g = c.getContext('2d');
    g.fillStyle = OUT; g.fillRect(0, 0, w + 2, 22);
    g.fillStyle = '#4b5468'; g.fillRect(1, 1, w, 20);
    g.fillStyle = '#6a7489'; g.fillRect(1, 1, w, 5);
    g.fillStyle = '#8c96ad'; g.fillRect(1, 1, w, 1);
    g.fillStyle = '#39e0ff'; g.fillRect(1, 6, w, 1);
    g.fillStyle = '#1f8aa8'; g.fillRect(1, 7, w, 1);
    g.fillStyle = '#3a4152';
    for (let x = 1; x < w; x += 16){ g.fillRect(x, 8, 1, 13); }
    for (let x = 5; x < w - 2; x += 16){ g.fillStyle = '#9aa3b5'; g.fillRect(x, 3, 1, 1); g.fillRect(x + 6, 3, 1, 1); }
    // Warnstreifen an den Enden
    for (let i = 0; i < 6; i++){ g.fillStyle = i % 2 ? '#1a1726' : '#ffd24a'; g.fillRect(1 + i, 10, 1, 8); g.fillRect(w - i, 10, 1, 8); }
  }
  pl._c = c; pl._ox = ox; pl._oy = oy; pl._th = th;
  return c;
}
function drawPlatform(pl){
  const x = SX(pl.x), y = SY(pl.y);
  if (x + pl.w / 2 < -10 || x > LW + 10) return;
  const c = platformCanvas(pl);
  if (y + pl._oy > LH || y + pl._oy + c.height < 0) return;
  ctx.drawImage(c, x + pl._ox, y + pl._oy);
}

// ---------- Kletterwände (Welt 5) ----------
function wallCanvas(wl){
  if (wl._c) return wl._c;
  const w = Math.round(wl.w / 2), h = Math.round(wl.h / 2);
  const c = newCanvas(w + 2, h + 2), g = c.getContext('2d');
  g.fillStyle = OUT; g.fillRect(0, 0, w + 2, h + 2);
  g.fillStyle = '#5c6679'; g.fillRect(1, 1, w, h);
  g.fillStyle = '#6e788c'; g.fillRect(1, 1, 3, h);
  g.fillStyle = '#4a5366'; g.fillRect(w - 2, 1, 3, h);
  for (let yy = 20; yy < h - 4; yy += 20){
    g.fillStyle = '#3e4658'; g.fillRect(2, yy, w - 2, 1);
    g.fillStyle = '#7d879b'; g.fillRect(2, yy + 1, w - 2, 1);
    g.fillStyle = '#9aa3b5'; g.fillRect(5, yy + 4, 1, 1); g.fillRect(w - 5, yy + 4, 1, 1);
  }
  // Griffleisten links & rechts: hier kann der Wand-Hochkletterer sich festhalten
  for (let yy = 10; yy < h - 4; yy += 20){
    g.fillStyle = OUT; g.fillRect(1, yy - 1, 7, 4); g.fillRect(w - 6, yy - 1, 7, 4);
    g.fillStyle = '#ffd24a'; g.fillRect(1, yy, 6, 2); g.fillRect(w - 5, yy, 6, 2);
    g.fillStyle = '#fff09a'; g.fillRect(1, yy, 6, 1); g.fillRect(w - 5, yy, 6, 1);
  }
  g.fillStyle = '#39e0ff'; g.fillRect(1, 1, w, 2);
  g.fillStyle = '#c8f8ff'; g.fillRect(1, 1, w, 1);
  return (wl._c = c);
}
function drawWall(wl){
  const x = SX(wl.x), y = SY(wl.y);
  const c = wallCanvas(wl);
  if (x + c.width < -2 || x > LW + 2 || y > LH + 2 || y + c.height < -2) return;
  ctx.drawImage(c, x - 1, y - 1);
}

// ---------- Laserschranken ----------
function drawLasers(){
  for (const l of (world.lasers || [])){
    const on = laserOn(l);
    const phase = ((gameT + l.offset) % l.period) / l.period;   // < 0.5 = an
    // Lämpchen: grün = sicher, orange blinkt = gleich an, rot = an
    const lamp = on ? '#ff4a4a' : (phase > 0.85 ? (Math.floor(gameT * 10) % 2 ? '#ffb14a' : '#5a4a2a') : '#2ecc71');
    const beam = (ax, ay, bx, by) => {
      const vert = ax === bx;
      if (on){
        const fl = Math.floor(gameT * 30) % 2;
        if (vert){
          pr(ax - 3, ay, 7, by - ay, 'rgba(255,70,70,.28)');
          pr(ax - 1, ay, 3, by - ay, '#ff4a4a');
          pr(ax, ay, 1, by - ay, fl ? '#ffffff' : '#ffd0d0');
        } else {
          const x0 = Math.min(ax, bx), x1 = Math.max(ax, bx);
          pr(x0, ay - 3, x1 - x0, 7, 'rgba(255,70,70,.28)');
          pr(x0, ay - 1, x1 - x0, 3, '#ff4a4a');
          pr(x0, ay, x1 - x0, 1, fl ? '#ffffff' : '#ffd0d0');
        }
      } else {
        ctx.fillStyle = 'rgba(255,120,120,.35)';
        if (vert){ for (let y = ay; y < by; y += 6) ctx.fillRect(ax, y, 1, 2); }
        else { const x0 = Math.min(ax, bx), x1 = Math.max(ax, bx); for (let x = x0; x < x1; x += 6) ctx.fillRect(x, ay, 2, 1); }
      }
    };
    if (l.x1 === l.x2){
      // senkrechte Schranke: Mast mit Laserkanone oben und Empfänger unten
      const x = SX(l.x1), y1 = SY(l.y1), y2 = SY(l.y2);
      if (x < -20 || x > LW + 20) continue;
      pr(x - 9, y1 - 13, 4, y2 - y1 + 13, OUT); pr(x - 8, y1 - 13, 2, y2 - y1 + 13, '#4a5366');
      pboxO(x - 7, y1 - 15, 14, 13, '#3a4152', OUT, 1);
      pr(x - 6, y1 - 14, 12, 2, '#5a6378');
      pellipseO(x - 2, y1 - 10, 5, 5, lamp);
      pboxO(x - 6, y2 - 5, 12, 6, '#3a4152', OUT, 1);
      beam(x, y1 - 2, x, y2 - 4);
    } else {
      // waagerechter Laser: Kanone hängt an der Kletterwand und strahlt in die Luft
      const xa = SX(l.x1), xb = SX(l.x2), y = SY(l.y1);
      if (xb < -20 || xa > LW + 20 || y < -20 || y > LH + 20) continue;
      const mx = l.mount === 'left' ? xa : xb;      // Wandseite
      const dir = l.mount === 'left' ? 1 : -1;      // Strahlrichtung
      const bx0 = dir > 0 ? mx - 3 : mx - 13;
      pboxO(bx0, y - 7, 16, 14, '#3a4152', OUT, 1);
      pr(bx0 + 1, y - 6, 14, 2, '#5a6378');
      pr(mx - (dir > 0 ? 2 : 1), y - 10, 3, 3, '#ffd24a'); pr(mx - (dir > 0 ? 2 : 1), y + 8, 3, 3, '#ffd24a');
      pellipseO(mx + dir * 7 - 2, y - 6, 4, 4, lamp);
      beam(mx + dir * 10, y, dir > 0 ? xb : xa, y);
      pellipse((dir > 0 ? xb : xa) - 2, y - 2, 4, 4, on ? '#ff8a8a' : '#6a7489');
    }
  }
}

// ---------- Truhen, Fahnen, Tür ----------
function bob(speed, amp, ph){ return Math.round(Math.sin(gameT * speed + (ph || 0)) * amp); }
function drawChest(c){
  const cx = SX(c.x + c.w / 2), by = SY(c.y + c.h);
  if (cx < -30 || cx > LW + 30) return;
  const s = c.open ? SPR.chest_open : SPR.chest_closed;
  if (s) sprBC(s, cx, by);
  if (!c.open){
    if (overlap(c, player) && c.cd <= 0){
      txt('{attack} öffnen!', cx, by - 30 + bob(6, 2), { c: '#ffd93d' });
    } else if (ICONS.question){
      sprC(ICONS.question, cx, by - 26 + bob(3, 2));
    }
  }
}
function drawFlag(f){
  const x = SX(f.x), y = SY(f.y);
  if (x < -30 || x > LW + 30) return;
  // Mast
  pr(x - 1, y - 36, 3, 36, OUT);
  pr(x, y - 35, 1, 35, f.active ? '#e8c890' : '#a08060');
  pellipseO(x - 1, y - 39, 3, 3, f.active ? '#ffd93d' : '#c0c0c8');
  // Fahne (aktiv: grün und flatternd)
  const wv = f.active ? Math.sin(gameT * 8) * 1.5 : 0;
  const top = y - 35, len = 17, hh = 11;
  const pts = f.active
    ? [[x + 2, top], [x + 2 + len * 0.5, top + 1 + wv], [x + 2 + len, top + hh * 0.5 + wv * 0.5], [x + 2 + len * 0.5, top + hh - 1 - wv], [x + 2, top + hh]]
    : [[x + 2, top + 1], [x + 7, top + 6], [x + 6, top + hh + 4], [x + 2, top + hh + 1]];
  ppoly(pts.map(p => [p[0] - 0.5, p[1] - 1]), OUT); ppoly(pts.map(p => [p[0] + 0.5, p[1] + 1]), OUT);
  ppoly(pts, f.active ? '#5fd35f' : '#d8d8e0');
  if (f.active){
    ppoly([[x + 2, top + hh * 0.5], [x + 2 + len, top + hh * 0.5 + wv * 0.5], [x + 2 + len * 0.5, top + hh - 1 - wv], [x + 2, top + hh]], '#3aa046');
    if (ICONS.star) spr(ICONS.star, x + 3, top + 1);
  }
}
function halfDisc(cx, cy, rx, ry, c){
  ctx.fillStyle = c;
  for (let j = 0; j < ry; j++){
    const dy = (ry - j - 0.5) / ry;
    const hw = Math.round(rx * Math.sqrt(Math.max(0, 1 - dy * dy)));
    ctx.fillRect(cx - hw, cy - ry + j, hw * 2, 1);
  }
}
function drawDoor(){
  const d = world.door;
  const x = SX(d.x), y = SY(d.y), w = Math.round(d.w / 2), h = Math.round(d.h / 2);
  if (x + w < -60 || x > LW + 60) return;
  if (d.kind === 'car'){
    const a = 0.25 + Math.sin(gameT * 4) * 0.12;
    pellipse(x + w / 2 - 42, y + h - 15, 84, 30, 'rgba(255,255,160,' + a.toFixed(2) + ')');
    drawRoadCarAt(x + w / 2, y + h, { seat: -1 });
    txt('🚗 ' + d.label, x + w / 2, y - 40, { c: '#ffffff' });
    if (d.needsChip && !player.hasChip && ICONS.chip) sprC(ICONS.chip, x + w / 2 + 22, y - 22 + bob(3, 2));
    return;
  }
  const cx = x + w / 2, base = y + h;
  const colors = ['#ff5f5f', '#ffb14a', '#ffe94a', '#6fdc6f', '#5fa8ff', '#b06fff'];
  const R0 = w / 2 + 9;
  halfDisc(cx, base, R0 + 1, R0 + 1, OUT);
  colors.forEach((col, i) => halfDisc(cx, base, R0 - i * 2.5, R0 - i * 2.5, col));
  // Portal-Inneres
  const iw = w, ih = h - 5;
  pboxO(x, base - ih, iw, ih, '#ffffff', OUT, 2);
  for (let i = 0; i < 6; i++){
    const yy = base - ih + 2 + ((Math.floor(gameT * 18) + i * 7) % (ih - 3));
    pr(x + 2 + ((i * 11) % (iw - 6)), yy, 2, 1, pick(['#ffe94a', '#9ff0f0', '#ff9ad5']));
  }
  ctx.globalAlpha = 0.25 + Math.sin(gameT * 4) * 0.2;
  pr(x + 2, base - ih + 2, iw - 4, ih - 3, '#c8f0ff');
  ctx.globalAlpha = 1;
  if (ICONS.sparkle) sprC(ICONS.sparkle, cx, base - ih / 2 + bob(4, 2));
  txt(d.label || 'Welt 3', cx, y - 18, { c: '#ffffff' });
  if (d.needsKey && !player.hasKey && ICONS.key) sprC(ICONS.key, cx + 16, y - 4 + bob(3, 2));
  if (d.needsChip && !player.hasChip && ICONS.chip) sprC(ICONS.chip, cx + 16, y - 4 + bob(3, 2));
}

// ---------- Gegner ----------
function hpBar(x, y, w, frac){
  pr(x - 1, y - 1, w + 2, 4, OUT);
  pr(x, y, w, 2, '#5a1a2a');
  pr(x, y, Math.max(0, Math.round(w * frac)), 2, '#ff5b6e');
}
function drawSlime(e){
  const th = world.theme;
  const set = SPR['slime_' + th] || SPR.slime_sky;
  const fr = Math.sin(e.t * 9) > 0 ? 0 : 1;
  const cx = SX(e.x + e.w / 2), by = SY(e.y + e.h) + 1;
  if (cx < -30 || cx > LW + 30) return;
  const flip = e.dir < 0, white = e.flash > 0;
  sprBC(set[fr], cx, by, flip, white);
  if (th === 'castle') sprBC(SPR.helmet, cx, by - 10 + fr, flip, white);
  if (e.maxHp > 1) hpBar(cx - (e.w >> 2), by - 21, e.w >> 1, e.hp / e.maxHp);
}
function drawFlyer(e){
  const cx = SX(e.x + e.w / 2), cy = SY(e.y + e.h / 2);
  if (cx < -30 || cx > LW + 30) return;
  const ph = Math.sin(e.t * 10);
  const fr = ph > 0.35 ? 0 : ph > -0.35 ? 1 : 2;
  const flip = Math.cos(e.t * 0.9) < 0;
  sprC(SPR.flyer[fr], cx, cy, flip, e.flash > 0);
  if (e.maxHp > 1) hpBar(cx - (e.w >> 2), cy - 13, e.w >> 1, e.hp / e.maxHp);
}
function drawBot(e){
  const cx = SX(e.x + e.w / 2), by = SY(e.y + e.h) + 1;
  if (cx < -30 || cx > LW + 30) return;
  const fr = Math.floor(e.t * 8) % 2;
  sprBC(SPR.bot[fr], cx, by, e.dir < 0, e.flash > 0);
  if (e.maxHp > 1) hpBar(cx - (e.w >> 2), by - 23, e.w >> 1, e.hp / e.maxHp);
}
function drawDrone(e){
  const cx = SX(e.x + e.w / 2), cy = SY(e.y + e.h / 2);
  if (cx < -30 || cx > LW + 30) return;
  const fr = Math.floor(e.t * 20) % 2;
  sprC(SPR.drone[fr], cx, cy, false, e.flash > 0);
  if (e.maxHp > 1) hpBar(cx - (e.w >> 2), cy - 12, e.w >> 1, e.hp / e.maxHp);
}

// ---------- Schockwellen & Pfeile ----------
function drawShocks(){
  for (const s of world.shocks){
    const x = SX(s.x), y = SY(s.y);
    const hgt = 15 + Math.round(Math.sin(gameT * 20) * 2);
    const pts = [[x - 9, y], [x - 6, y - hgt * 0.6], [x, y - hgt], [x + 6, y - hgt * 0.6], [x + 9, y]];
    ppoly(pts.map(p => [p[0] + (p[0] < x ? -1 : 1), p[1] - 1]), OUT);
    ppoly(pts, '#7ae8ff');
    ppoly([[x - 5, y], [x, y - hgt * 0.7], [x + 5, y]], '#d8faff');
    pr(x - 1, y - hgt + 3, 2, 2, '#ffffff');
  }
}
function drawArrowPx(x, y, d){
  // (x, y) = Pfeilspitze
  x = Math.round(x); y = Math.round(y);
  const x0 = d > 0 ? x - 12 : x + 3;
  pr(x0 - 1, y - 1, 12, 3, OUT);
  pr(x0, y, 10, 1, '#a0703c');
  // Spitze
  ppoly(d > 0 ? [[x - 3, y - 3], [x + 2, y + 0.5], [x - 3, y + 4]] : [[x + 3, y - 3], [x - 2, y + 0.5], [x + 3, y + 4]], OUT);
  ppoly(d > 0 ? [[x - 3, y - 2], [x + 1, y + 0.5], [x - 3, y + 3]] : [[x + 3, y - 2], [x - 1, y + 0.5], [x + 3, y + 3]], '#d8dce8');
  // Federn
  const fx = d > 0 ? x - 12 : x + 10;
  pr(fx, y - 2, 3, 1, '#ff5b6e'); pr(fx, y + 2, 3, 1, '#ff5b6e');
  pr(fx + (d > 0 ? 1 : 0), y - 1, 2, 1, '#ffffff'); pr(fx + (d > 0 ? 1 : 0), y + 1, 2, 1, '#ffffff');
}
function drawArrows(){
  for (const a of world.arrows){
    const d = Math.sign(a.vx) || 1;
    drawArrowPx(SX(a.x + d * 16), SY(a.y), d);
  }
}

// ---------- Bosse ----------
const BOSS_STYLES = {
  cloud:  { body: '#e8eef7', dark: '#b9c8dd', light: '#ffffff', puff: '#d3deee', face: '#33415c', crown: true },
  knight: { body: '#9aabce', dark: '#6f80a8', light: '#c8d4ee', puff: '#7e90b5', face: '#2d3a52', helmet: true },
  storm:  { body: '#5d6b80', dark: '#414c5e', light: '#7d8aa0', puff: '#4b576b', face: '#ffd24a', crown: true, bolt: true },
  crystal:{ body: '#b57ae0', dark: '#8650b8', light: '#d8b0ff', puff: '#9a60d0', face: '#2b1e42', shards: true },
  cavelord:{ body: '#5a5080', dark: '#3e3660', light: '#7a70a8', puff: '#4a4270', face: '#9fe8ff', crown: true, gem: true },
  robot:  { body: '#8e97a8', dark: '#646d80', light: '#b8c0d0', puff: '#6a7386', face: '#ff4a4a', antenna: true, bolts: true, boxy: true },
};
function bossCanvas(b, sq, enr){
  const s = BOSS_STYLES[b.style] || BOSS_STYLES.cloud;
  const bw = Math.round(b.w / 2), bh = Math.round(b.h / 2);
  const key = 'boss|' + b.style + '|' + bw + 'x' + bh + '|' + sq + '|' + (enr ? 1 : 0);
  return cacheGet(key, () => {
    const CW = bw + 26, CH = bh + 34, cx = Math.round(CW / 2), base = CH - 2;
    const c = pixelize(CW, CH, g => {
      const H = bh * sq, top = base - H;
      const E = (x, y, rx, ry, col) => { g.fillStyle = col; g.beginPath(); g.ellipse(x, y, Math.max(0.6, rx), Math.max(0.6, ry), 0, 0, Math.PI * 2); g.fill(); };

        P([[cx - bw * 0.48, base - H * 0.52], [cx - bw * 0.3, base - H * 0.66], [cx - bw * 0.1, base - H * 0.66], [cx - bw * 0.36, base]], '#3a3060');
        E(cx, base - H * 0.47, bw * 0.36, H * 0.47, s.dark);

        E(cx - bw * 0.16, base - H * 0.76, bw * 0.08, H * 0.06, s.light);

        }
        R(cx - bw * 0.3, by0 + H * 0.16, bw * 0.6, H * 0.17, '#1c2230');

      }
    });

  });
}
function drawBossBody(b){
  const sq = b.onGround ? Math.round((1 + Math.sin(b.t * 6) * 0.05) * 40) / 40 : 1.1;
  const enr = b.hp <= b.maxHp * 0.4;
  const bc = bossCanvas(b, sq, enr);
  const x = SX(b.x + b.w / 2) - bc.ox, y = SY(b.y + b.h) - bc.oy;
  if (x > LW + 20 || x + bc.w < -20) return;
  // Schatten am Boden
  if (b.onGround) pellipse(x + bc.ox - b.w / 4, y + bc.oy - 2, b.w / 2, 5, 'rgba(10,8,30,.25)');
  ctx.drawImage(b.flash > 0 ? bc.white : bc.c, x, y);
  // Antennen-Blinklicht (Roboter)
  if ((BOSS_STYLES[b.style] || {}).antenna){
    const top = y + bc.oy - Math.round(b.h / 2 * sq * 0.92);
    pellipseO(x + bc.ox - 3, top - 18, 6, 6, Math.floor(gameT * 5) % 2 ? '#ff4a4a' : '#ffb14a');
  }
}
function drawBosses(){
  let barBoss = null;
  for (const b of world.bosses){
    if (b.dead && b.style !== 'light') continue;   // der Ampel-Roboter bleibt als Ziel stehen
    if (b.style === 'light') drawTrafficBoss(b); else drawBossBody(b);
    if (b.dead) continue;
    if (b.active && (!barBoss || Math.abs(b.x - player.x) < Math.abs(barBoss.x - player.x))) barBoss = b;
  }
  if (barBoss){
    // Boss-Leiste unten (oben ist Platz für viele Herzen nötig)
    const bw = 150, bx = LW / 2 - bw / 2, by0 = LH - 30;
    pboxO(bx - 3, by0 - 2, bw + 6, 10, '#2a1a30', OUT, 1);
    pr(bx, by0 + 1, bw, 4, '#5a1a2a');
    const fw = Math.round(bw * Math.max(0, barBoss.hp) / barBoss.maxHp);
    pr(bx, by0 + 1, fw, 4, '#ff5b6e'); pr(bx, by0 + 1, fw, 1, '#ffb0b8');
    txt(barBoss.icon + ' ' + barBoss.name, LW / 2, by0 - 9, { c: '#ffffff' });
  }
}

// ---------- Schwert (gerastert, beliebiger Winkel) ----------
function drawPixelSword(px0, py0, ang, level, lenPx, width){
  const s = SWORDS[level];
  const dx = Math.sin(ang), dy = -Math.cos(ang);       // Klingenrichtung (Winkel 0 = nach oben)
  const nx = Math.cos(ang), ny = Math.sin(ang);        // quer dazu
  const L = lenPx, wdt = width || 2;
  const pts = [];
  const add = (t, n, col) => pts.push([Math.round(px0 + dx * t + nx * n), Math.round(py0 + dy * t + ny * n), col]);
  const hi = mixHex(s.blade, '#ffffff', 0.55);
  for (let t = -3; t <= 0; t += 0.5) add(t, 0, '#6b4a2b');                         // Griff
  const cg = 3 + Math.max(0, wdt - 2) * 1.5;
  for (let n = -cg; n <= cg; n += 0.5) for (let k = 0; k < Math.max(1, wdt >> 1); k++) add(0.5 + k, n, s.color);   // Parierstange
  for (let t = -3 - wdt; t <= 0; t += 0.5) for (let n = 0; n < Math.max(1, wdt >> 1); n++) add(t, n - (wdt >> 2), '#6b4a2b');   // Griff
  for (let t = 1; t <= L; t += 0.5){                                                 // Klinge
    for (let n = 0; n < wdt; n++) add(t, n - (wdt >> 1), n === 0 ? hi : s.blade);
  }
  add(L + 1, 0, s.blade); add(L + 1.5, 0, hi);
  ctx.fillStyle = OUT;
  for (const [x, y] of pts) ctx.fillRect(x - 1, y - 1, 3, 3);
  for (const [x, y, c] of pts){ ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1); }
}
// Schwerthieb-Bogen (Effekt)
function drawSlash(px0, py0, a0, a1, r, facing, col){
  const n = 14;
  for (let i = 0; i <= n; i++){
    const t = i / n, a = lerp(a0, a1, t);
    const fx = Math.sin(a) * facing, fy = -Math.cos(a);
    const rr = r - 1 + t * 2;
    ctx.fillStyle = t > 0.55 ? '#ffffff' : col;
    ctx.fillRect(Math.round(px0 + fx * rr), Math.round(py0 + fy * rr), 2, 2);
    if (t > 0.3){ ctx.fillStyle = col; ctx.fillRect(Math.round(px0 + fx * (rr - 3)), Math.round(py0 + fy * (rr - 3)), 1, 1); }
  }
}

// ---------- Held ----------
const pfx = { landT: 0, hurtT: 0, shootT: 0, blinkT: 0, wasGround: true, hearts: 0, arrowsN: 0, airJ: false, dustT: 0 };
// Handpositionen je Pose (für Schwert/Bogen), im 20x26-Raster, Blick nach rechts
const HAND = { idle: [14, 17], runA: [16, 13], runB: [15, 18], jump: [14, 11], fall: [16, 13], attack: [18, 14], hurt: [17, 11], land: [14, 19] };
function heroPose(){
  const p = player;
  if (pfx.hurtT > 0 || state === 'dead') return { spr: SPR.hero.hurt, hand: 'hurt', dy: 0 };
  const attack = p.attackT > 0 || pfx.shootT > 0;
  if (!p.onGround){
    if (attack) return { spr: SPR.hero.attackAir[p.vy < 0 ? 0 : 1], hand: 'attack', dy: 0 };
    return p.vy < 0 ? { spr: SPR.hero.jump, hand: 'jump', dy: 0 } : { spr: SPR.hero.fall, hand: 'fall', dy: 0 };
  }
  if (Math.abs(p.vx) > 20){
    const f = Math.floor(p.animT * 10) % 4;
    if (attack) return { spr: SPR.hero.attackRun[f], hand: 'attack', dy: f % 2 };
    return { spr: SPR.hero.run[f], hand: f < 2 ? 'runB' : 'runA', dy: f % 2 };
  }
  if (attack) return { spr: SPR.hero.attack, hand: 'attack', dy: 0 };
  if (pfx.landT > 0) return { spr: SPR.hero.land, hand: 'land', dy: 0 };
  const idle1 = Math.floor(gameT * 2) % 2 === 1;
  if (pfx.blinkT > 0) return { spr: SPR.hero.blink, hand: 'idle', dy: 0 };
  return { spr: idle1 ? SPR.hero.idle1 : SPR.hero.idle0, hand: 'idle', dy: idle1 ? 1 : 0 };
}
function drawHeroAt(fx, fy, facing, pose, extras){
  // fx/fy = linke obere Ecke des 20x26-Rasters
  const flip = facing < 0;
  const p = player;
  const backX = flip ? fx + 14 : fx + 3;
  if (extras && p.hasWings){
    const wing = SPR.wing, flap = !p.onGround && p.airJumped ? Math.floor(gameT * 16) % 2 : 0;
    spr(wing, flip ? backX - 1 : backX - 6, fy + 9 + pose.dy - flap * 2, flip);
  }
  if (extras && p.hasShield){
    const sh = p.shieldCharge > 0 ? (p.shieldMax >= 2 ? SPR.shieldGold : SPR.shield) : SPR.shieldEmpty;
    spr(sh, flip ? fx + 12 : fx + 1, fy + 12 + pose.dy, flip);
  }
  spr(pose.spr, fx, fy, flip);
}
function drawPlayer(){
  if (player.form === 'car'){ drawRoboCar(); return; }
  if (player.form === 'roadcar'){ drawPlayerRoadCar(); return; }
  const p = player;
  const pose = heroPose();
  const fx = SX(p.x + p.w / 2) - 10, fy = SY(p.y + p.h) - 26;
  if (p.invuln > 0 && Math.floor(p.invuln * 14) % 2 === 0) ctx.globalAlpha = 0.35;
  drawHeroAt(fx, fy, p.facing, pose, true);
  // Schwert / Bogen in der Hand
  const hand = HAND[pose.hand] || HAND.idle;
  const hx = p.facing > 0 ? fx + hand[0] : fx + 19 - hand[0];
  const hy = fy + hand[1] + pose.dy;     // dy = Wippen des Oberkörpers in diesem Bild
  if (pfx.shootT > 0 && ICONS.bow){
    spr(ICONS.bow, hx - 4 + p.facing * 2, hy - 5, p.facing < 0);
  } else {
    let ang;
    if (p.attackT > 0){
      const k = 1 - p.attackT / 0.26;      // 0 -> 1 über den Schwung
      // kurz über dem Kopf ausholen, dann nach vorne-unten durchschlagen
      ang = lerp(-0.7, 2.1, Math.min(1, k * 1.6));
      if (p.attackT >= 0.08 && p.attackT <= 0.22) drawSlash(hx, hy, -0.5, ang, 15 + p.sword, p.facing, SWORDS[p.sword].blade);
    } else {
      ang = pose.hand === 'jump' ? 0.15 : pose.hand === 'hurt' ? -0.4 : 0.6;
    }
    drawPixelSword(hx, hy, ang * p.facing, p.sword, Math.round((26 + p.sword * 3) / 2));
  }
  ctx.globalAlpha = 1;
}

// ---------- Wand-Hochkletterer (Welt 5) ----------
function roboBodyCanvas(shieldState){
  return cacheGet('robobody|' + shieldState, () => {
    const k = 0.909;                       // Entwurfseinheiten (44er-Raster) → Pixel
    const W0 = 64, H0 = 56, ox = 32, oy = 50;
    const c = pixelize(W0, H0, g => {
      g.translate(ox, oy); g.scale(k, k);
      const rr = (x, y, w, h, r, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.fill(); };
      rr(-21, -9, 43, 7, 3, '#a83027');
      rr(-23, -31, 47, 26, 9, '#c93a30');

function drawRoboCar(){
  // Der Wand-Hochkletterer: rotes Roboter-Auto ohne Räder, mit Greifarmen, Gesicht und Schwert auf dem Kopf.
  const p = player;
  const bx = SX(p.x + p.w / 2), by = SY(p.y + p.h);
  const f = p.facing;
  const k = 0.909;
  const P = (x, y) => [bx + Math.round(x * k) * f, by + Math.round(y * k)];
  const cling = p.cling !== 0;
  const moving = Math.abs(p.vx) > 20 && p.onGround;
  const airborne = !p.onGround && !cling;
  const step = moving ? Math.sin(p.animT * 14) : 0;
  const reach = cling ? Math.sin(p.climbT * 9) : 0;
  if (p.invuln > 0 && Math.floor(p.invuln * 14) % 2 === 0) ctx.globalAlpha = 0.35;
  const limb = (x1, y1, x2, y2) => { const a = P(x1, y1), b = P(x2, y2); pline(a[0], a[1], b[0], b[1], OUT, 3); pline(a[0], a[1], b[0], b[1], '#5a6378', 1); };
  const hand = (hx, hy) => { const a = P(hx, hy); pellipseO(a[0] - 2, a[1] - 2, 5, 5, '#3a4152'); ctx.fillStyle = '#6a7489'; ctx.fillRect(a[0] - 1, a[1] - 1, 1, 1); };
  const foot = (fx2, fy2) => { const a = P(fx2, fy2); pellipseO(a[0] - 2, a[1] - 2, 4, 4, '#3a4152'); };
  // Hintere Arme
  if (cling){ limb(-18, -20, -30, -8); hand(-30, -8); limb(-18, -14, -26, -2); hand(-26, -2); }
  else {
    const sw = moving ? step * 5 : (airborne ? -8 : 0);
    limb(-20, -22, -34, -26 - sw); hand(-34, -26 - sw);
    limb(-20, -15, -36, -12 + sw); hand(-36, -12 + sw);
  }
  // Beine / Greifer unten
  if (cling){ limb(8, -6, 24, 2); hand(24, 2); limb(-6, -6, 14, 6); hand(14, 6); }
  else {
    const dangle = airborne ? 3 : 0, l1 = step * 6, l2 = -step * 6;
    limb(-12, -8, -14 + l1, dangle); foot(-14 + l1, dangle);
    limb(-3, -8, -4 + l2, dangle); foot(-4 + l2, dangle);
    limb(5, -8, 4 + l1, dangle); foot(4 + l1, dangle);
    limb(13, -8, 14 + l2, dangle); foot(14 + l2, dangle);
  }
  // Karosserie (vorgerendert)
  const shieldState = !p.hasShield ? 0 : p.shieldCharge <= 0 ? 3 : p.shieldMax >= 2 ? 2 : 1;
  const body = roboBodyCanvas(shieldState);
  const img = f < 0 ? (body.cf || (body.cf = flipCanvas(body.c))) : body.c;
  ctx.drawImage(img, f > 0 ? bx - body.ox : bx - (body.c.width - body.ox), by - body.oy);
  // Blinklicht der Antenne
  const an = P(-21, -44);
  pellipseO(an[0] - 1, an[1] - 2, 3, 3, Math.floor(gameT * 4) % 2 ? '#ff4a4a' : '#ffb14a');
  // Vordere Arme – greifen an der Wand abwechselnd nach oben
  if (cling){ limb(18, -22, 27, -40 + reach * 8); hand(27, -40 + reach * 8); limb(18, -14, 27, -18 - reach * 8); hand(27, -18 - reach * 8); }
  else {
    const sw = moving ? step * 5 : (airborne ? -8 : 0);
    limb(20, -22, 34, -26 + sw); hand(34, -26 + sw);
    limb(20, -15, 36, -12 - sw); hand(36, -12 - sw);
  }
  // Schwert auf dem Kopf (Kabinendach): ruht senkrecht, schlägt nach vorne-unten
  let ang;
  if (p.attackT > 0){
    const kk = 1 - p.attackT / 0.26;
    ang = lerp(-0.5, 2.0, Math.min(1, kk * 1.6));
  } else ang = cling ? -0.25 : 0.12;
  const sp = P(-2, -46);
  // wie im Original: 60 % länger, 20 % größer und mit dem Auto (80/44) skaliert → passt zur Schwert-Hitbox
  const len = Math.round((24 + p.sword * 3) * 1.6 * 1.2 * (p.w / 44) / 2);
  if (p.attackT >= 0.08 && p.attackT <= 0.22) drawSlash(sp[0], sp[1], -0.3, ang, len, f, SWORDS[p.sword].blade);
  drawPixelSword(sp[0], sp[1], ang * f, p.sword, len, 5);
  ctx.globalAlpha = 1;
}

const fxParts = [];          // reine Grafik-Partikel (Staub, Funken) — beeinflussen das Spiel nicht
function dust(x, y, n, dir){
  for (let i = 0; i < n; i++){
    fxParts.push({ x: x + rnd(-8, 8), y: y - rnd(0, 4), vx: (dir || 0) * rnd(20, 60) + rnd(-40, 40), vy: -rnd(10, 50), t: rnd(0.25, 0.45), T: 0.45, kind: 'dust' });
  }
}
function sparkles(x, y, n, col){
  for (let i = 0; i < n; i++){
    const a = rnd(0, Math.PI * 2), s = rnd(40, 160);
    fxParts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: rnd(0.3, 0.6), T: 0.6, kind: 'spark', color: col || '#ffffff' });
  }
}
function updateFxParts(dt){
  for (const p of fxParts){
    p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'dust'){ p.vx *= 0.92; p.vy *= 0.9; } else { p.vy += 300 * dt; }
  }
  for (let i = fxParts.length - 1; i >= 0; i--) if (fxParts[i].t <= 0) fxParts.splice(i, 1);
}
function drawFx(){
  for (const p of particles){
    const s = Math.max(1, Math.round(p.size / 2 * Math.min(1, p.t * 2.5)));
    ctx.fillStyle = p.color;
    ctx.fillRect(SX(p.x) - (s >> 1), SY(p.y) - (s >> 1), s, s);
  }
  for (const p of fxParts){
    const k = p.t / p.T;
    if (p.kind === 'dust'){
      const s = k > 0.6 ? 3 : k > 0.3 ? 2 : 1;
      ctx.fillStyle = k > 0.5 ? '#f2efe6' : '#cfc8bb';
      ctx.fillRect(SX(p.x) - (s >> 1), SY(p.y) - (s >> 1), s, s);
    } else {
      ctx.fillStyle = Math.floor(gameT * 20 + p.x) % 2 ? p.color : '#ffffff';
      const x = SX(p.x), y = SY(p.y);
      ctx.fillRect(x, y, 1, 1);

// ---------- Banner & Toast ----------
let bannerRef = null, bannerAge = 0, lastDt = 0.016;
function drawBanner(){
  if (!banner){ bannerRef = null; return; }
  if (banner !== bannerRef){ bannerRef = banner; bannerAge = 0; }
  bannerAge += lastDt;
  const a = clamp(banner.t, 0, 1);
  const k = Math.min(1, bannerAge / 0.28);
  const ease = 1 - Math.pow(1 - k, 3);
  let s = 2;
  if (txtW(banner.text, 2) > 440) s = 1;
  const w = clamp(Math.max(txtW(banner.text, s), banner.sub ? txtW(banner.sub) : 0) + 28, 160, 470);
  const h = banner.sub ? 38 : 24;
  const x = Math.round(LW / 2 - w / 2), y = Math.round(lerp(-h - 6, 42, ease));
  ctx.globalAlpha = a;
  panel(x, y, w, h, 'rgba(22,26,62,.86)', 'rgba(255,210,74,.7)');
  txt(banner.text, LW / 2, y + 12, { s });
  if (banner.sub) txt(banner.sub, LW / 2, y + 29, { c: '#ffd93d' });
  ctx.globalAlpha = 1;
}

function caveLightCanvas(){
  return cacheGet('caveLight', () => {
    const w = LW * 2, h = LH * 2, c = newCanvas(w, h), g = c.getContext('2d');
    const img = g.createImageData(w, h), d = img.data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
      const dist = Math.hypot(x - w / 2, y - h / 2);
      const a = dist < 58 ? 0 : dist < 84 ? 0.12 : dist < 115 ? 0.24 : dist < 155 ? 0.36 : 0.48;
      const i = (y * w + x) * 4;
      d[i] = 10; d[i + 1] = 8; d[i + 2] = 28; d[i + 3] = Math.round(a * 255);
    }
    g.putImageData(img, 0, 0);
    return c;
  });
}

  // Aufgabendarstellung
  const cy0 = y0 + 84;

  if (q.kind === 'count' || q.kind === 'sub'){
    const n = q.kind === 'count' ? q.n : q.a;
    const perRow = Math.min(n, 5), rows = Math.ceil(n / perRow);
    for (let i = 0; i < n; i++){
      const r = Math.floor(i / perRow), col = i % perRow;
      const inRow = Math.min(perRow, n - r * perRow);

  } else if (q.kind === 'pattern'){
    const n = q.seq.length;

    }
  } else if (q.kind === 'oddone'){
    for (let i = 0; i < q.options.length; i++) drawQIcon(q.options[i], cx - 120 + i * 80, cy0 + bobI(i), 3);
  } else if (q.kind === 'calc'){

  } else if (q.kind === 'numseq'){

      if (i < 4) txt(String(q.seq[i]), ix, cy0, { s: 3, c: '#33415c', o: false });

    }
  } else if (q.kind === 'firstletter'){
    drawQIcon(q.emo, cx - 70, cy0, 3);
    txt('❓' + q.word.slice(1), cx + 40, cy0, { s: 3, c: '#3a7ce0', o: false });
  } else if (q.kind === 'memory'){
    const xs = [cx - 90, cx, cx + 90];
    for (let i = 0; i < 3; i++){
      pboxO(xs[i] - 23, cy0 - 23, 46, 46, '#e9eef7', '#8a94b8', 2);
      drawQIcon(quiz.phase === 'memorize' ? q.memo[i] : '🎴', xs[i], cy0, 2);
    }
  } else {
    txt('Welcher Buchstabe ist das?', cx, cy0 - 26, { c: '#8a94a8', o: false });
    txt(q.target, cx, cy0 + 6, { s: 6, c: '#3a7ce0', o: false });
  }

  // Antwort-Optionen
  const bottomY = y0 + PH - 12;
  if (quiz.phase === 'correct'){
    const r = REWARDS[quiz.chest.reward];
    const pop = Math.min(1, quiz.doneT / 0.25);
    txt('🎉 RICHTIG! 🎉', cx, y0 + 168 - Math.round((1 - pop) * 6), { s: 3, c: '#3cab52', sh: '#1d5a2a' });
    txt(r.icon + ' ' + r.text, cx, y0 + 208, { s: 2, c: '#e2731e' });
    drawConfetti(x0, y0, PW, PH);
  } else if (quiz.phase === 'memorize'){
    const frac = clamp(quiz.memT / 3.5, 0, 1);
    pboxO(cx - 100, y0 + 160, 200, 12, '#e9eef7', OUT, 1);
    pr(cx - 98, y0 + 162, Math.round(196 * frac), 8, '#5fa8ff');
    txt('Gleich werden die Karten umgedreht…', cx, y0 + 196, { c: '#8a94a8', o: false });
  } else {
    const n = q.options.length, cols = quizCols(n), rows = Math.ceil(n / cols);
    const icons = q.options.every(o => !!qicon(o));
    const many = cols === 4;
    const bw2 = many ? 76 : n === 6 ? 92 : 108, bh = icons ? 38 : many ? 22 : 28;
    const gapX = many ? 7 : 10, gapY = many ? 5 : 7;
    const gridW = cols * bw2 + (cols - 1) * gapX;
    const gx0 = Math.round(cx - gridW / 2), gy0 = Math.round(bottomY - 14 - rows * bh - (rows - 1) * gapY);
    const locked = quiz.awaitSpeech || quiz.minT > 0;
    const penalty = quiz.penaltyT > 0 || quiz.penaltySpeech;
    for (let i = 0; i < n; i++){
      const bx = gx0 + (i % cols) * (bw2 + gapX);
      const by = gy0 + Math.floor(i / cols) * (bh + gapY);
      const sel = quiz.sel === i && !locked && !penalty;
      ctx.globalAlpha = (locked || penalty) ? 0.4 : 1;
      qButton(bx, by - (sel ? 1 : 0), bw2, bh, sel);
      if (icons) drawQIcon(q.options[i], bx + bw2 / 2, by + bh / 2 - 1 - (sel ? 1 : 0), 2);
      else txt(q.options[i], bx + bw2 / 2, by + bh / 2 - 1 - (sel ? 1 : 0), { s: 2, c: sel ? '#7a4a00' : '#33415c', o: false });
      if (sel && ICONS.hand_point) sprS(ICONS.hand_point, bx - 21 + bob(8, 2), by + bh / 2 - 9, 2);
      ctx.globalAlpha = 1;
    }
    const midY = gy0 + (rows * bh + (rows - 1) * gapY) / 2;
    if (penalty){
      drawQIcon('🤔', cx, midY, 2);
      txt('Denk nochmal in Ruhe nach…', cx, bottomY, { c: '#c96a1e', o: false });
    } else if (locked){
      drawQIcon('👂', cx, midY, 2);
      txt('Erst gut zuhören!', cx, bottomY, { c: '#8a94a8', o: false });
    } else if (quiz.sel < 0){
      txt('Wähle mit {dirs} eine Antwort aus!', cx, bottomY, { c: '#6a7488', o: false });
    } else {
      txt('{dirs} wählen · {confirm} bestätigen', cx, bottomY, { c: '#6a7488', o: false });
    }
  }
  if (quiz.phase !== 'correct'){
    ctx.globalAlpha = 0.75;
    txt('{back} später', x0 + PW - 10, y0 + 12, { a: 'r', c: '#8a94a8', o: false });

  }
}

const confetti = [];
function drawConfetti(x0, y0, pw, ph){

    for (let i = 0; i < 3; i++) confetti.push({ x: x0 + rnd(0, pw), y: y0 - 4, vy: rnd(30, 70), vx: rnd(-15, 15), c: pick(['#ffd93d', '#ff7ad0', '#7af0ff', '#7be07b', '#ff8b3d']), ph: rnd(0, 6) });
  }
  for (let i = confetti.length - 1; i >= 0; i--){
    const p = confetti[i];
    p.y += p.vy * lastDt; p.x += (p.vx + Math.sin(gameT * 4 + p.ph) * 12) * lastDt;
    if (p.y > y0 + ph){ confetti.splice(i, 1); continue; }

// ---------- Paraglider-Flug ----------
function drawCanopy(x, y, sunset, lean){
  const main = sunset ? '#5f8bff' : '#ff8b3d', dark = sunset ? '#3a5ad0' : '#d0601e', mid = sunset ? '#b06fff' : '#ffd24a';
  const pts = [];
  for (let i = 0; i <= 20; i++){ const t = i / 20, a = Math.PI * (1 - t); pts.push([x + Math.cos(a) * 29 + lean * (t - 0.5) * 2, y - 19 - Math.sin(a) * 18]); }
  for (let i = 20; i >= 0; i--){ const t = i / 20, a = Math.PI * (1 - t); pts.push([x + Math.cos(a) * 27 + lean * (t - 0.5) * 2, y - 19 - Math.sin(a) * 11]); }
  ppoly(pts.map(p => [p[0], p[1] - 1]), OUT); ppoly(pts.map(p => [p[0], p[1] + 1]), OUT);
  ppoly(pts.map(p => [p[0] + (p[0] < x ? -1 : 1), p[1]]), OUT);
  ppoly(pts, main);
  // Mittelband
  const mpts = [];
  for (let i = 0; i <= 8; i++){ const t = i / 8, a = Math.PI * (0.62 - 0.24 * t); mpts.push([x + Math.cos(a) * 29, y - 19 - Math.sin(a) * 18]); }
  for (let i = 8; i >= 0; i--){ const t = i / 8, a = Math.PI * (0.62 - 0.24 * t); mpts.push([x + Math.cos(a) * 27, y - 19 - Math.sin(a) * 11]); }
  ppoly(mpts, mid);
  // Zellen
  for (let i = 1; i < 8; i++){
    const a = Math.PI * (1 - i / 8);
    pline(x + Math.cos(a) * 28, y - 19 - Math.sin(a) * 17, x + Math.cos(a) * 27, y - 19 - Math.sin(a) * 11, dark, 1);
  }
  // Leinen
  pline(x - 27, y - 19, x - 6, y + 4, '#3b3752', 1); pline(x + 27, y - 19, x + 6, y + 4, '#3b3752', 1);
  pline(x - 14, y - 27, x - 5, y + 4, '#5d5a78', 1); pline(x + 14, y - 27, x + 5, y + 4, '#5d5a78', 1);
}

function logoCanvas(){
  return cacheGet('logo', () => {
    const A = renderLine('SPIELIWER', 4, '#ffffff', '', '').c;
    const pad = 5, c = newCanvas(A.width + pad * 2, A.height + pad * 2 + 3), g = c.getContext('2d');
    const body = newCanvas(A.width, A.height), gb = body.getContext('2d');
    gb.drawImage(A, 0, 0);
    gb.globalCompositeOperation = 'source-atop';
    const bands = ['#fff3a8', '#ffe066', '#ffd23a', '#ffb52e', '#f7962b', '#e8701a'];
    const top = FONT_TOP * 4, capH = FONT_CAP * 4;
    for (let y = 0; y < A.height; y++){
      gb.fillStyle = bands[Math.floor(clamp((y - top) / capH, 0, 0.999) * bands.length)];
      gb.fillRect(0, y, A.width, 1);
    }
    // feine Lichtkante oben links
    const edge = newCanvas(A.width, A.height), ge = edge.getContext('2d');
    ge.drawImage(A, 0, 0);
    ge.globalCompositeOperation = 'destination-out';
    ge.drawImage(A, 1, 1);
    gb.globalCompositeOperation = 'source-over';
    gb.drawImage(tintCanvas(edge, '#ffffff'), 0, 0);
    const out = tintCanvas(A, OUT), brown = tintCanvas(A, '#7a3300');
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) if (Math.abs(dx) + Math.abs(dy) <= 3) g.drawImage(out, pad + dx, pad + 3 + dy);
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) if (Math.abs(dx) + Math.abs(dy) <= 3) g.drawImage(out, pad + dx, pad + dy);
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) if (Math.abs(dx) + Math.abs(dy) <= 2) g.drawImage(brown, pad + dx, pad + dy);
    g.drawImage(body, pad, pad);
    return c;
  });
}

function diamondCanvas(r){

    g.fillStyle = '#0d0b1e';

function drawTransition(dt){
  if (!trans) return;
  trans.t += dt;
  const dur = trans.kind === 'fade' ? 0.5 : 0.65;
  const k = trans.t / dur;
  if (k >= 1){ trans = null; return; }
  const cell = 16;
  for (let gy = 0; gy <= LH + cell; gy += cell) for (let gx = 0; gx <= LW + cell; gx += cell){
    const local = trans.kind === 'fade' ? clamp(k * 1.25, 0, 1) : clamp(k * 1.7 - (gx / LW) * 0.7, 0, 1);
    const r = Math.round((1 - local) * cell * 0.8);
    if (r <= 0) continue;
    ctx.drawImage(diamondCanvas(r), gx - r, gy - r);
  }
}

// ============================================================
//  HAUPTSCHLEIFE
// ============================================================
function startGame(){
  resetPlayerStats();
  particles = []; floaters = []; banner = null; quiz = null; glide = null;
  loadWorld(1);
  state = 'play'; stateT = 0;
  sfx('start');
  speak('Los geht das Abenteuer!');
}

// Grafik-Effekte am Helden mitverfolgen (Landestaub, Treffer-Pose, Schuss-Pose …) – ändert nichts am Spiel
function trackPlayerFx(dt){
  const p = player;
  pfx.landT = Math.max(0, pfx.landT - dt);
  pfx.hurtT = Math.max(0, pfx.hurtT - dt);
  pfx.shootT = Math.max(0, pfx.shootT - dt);
  pfx.blinkT = Math.max(0, pfx.blinkT - dt);
  if (pfx.blinkT <= 0 && Math.random() < dt * 0.35) pfx.blinkT = 0.13;
  if (!world || state === 'title'){ pfx.wasGround = p.onGround; pfx.prevVy = p.vy; return; }
  if (state === 'play' && world.mode !== 'drive'){
    const fx = p.x + p.w / 2, fy = p.y + p.h;
    if (!pfx.wasGround && p.onGround && pfx.prevVy > 250){
      if (p.form === 'hero') pfx.landT = 0.09;
      dust(fx, fy, pfx.prevVy > 600 ? 6 : 3);
      sfx('land', clamp(pfx.prevVy / 900, 0.35, 1));
    }
    if (pfx.wasGround && !p.onGround && p.vy < -250) dust(fx, fy, 3);
    if (p.onGround && Math.abs(p.vx) > 150){
      pfx.dustT -= dt;
      if (pfx.dustT <= 0){ pfx.dustT = 0.16; dust(fx - p.facing * 8, fy, 1, -p.facing); }
    }
    if (!pfx.airJ && p.airJumped && !p.onGround) sparkles(fx, fy - 6, 8, '#bfefff');
  }
  if (p.hearts < pfx.hearts) pfx.hurtT = 0.35;
  pfx.hearts = p.hearts;
  if (world.arrows && world.arrows.length > pfx.arrowsN && p.form === 'hero') pfx.shootT = 0.22;
  pfx.arrowsN = world.arrows ? world.arrows.length : 0;
  pfx.wasGround = p.onGround; pfx.prevVy = p.vy; pfx.airJ = p.airJumped;
}

// Musik passend zur Lage: Titel, Welt, Boss, Gleitflug, Sieg
function desiredMusic(){
  if (state === 'title') return 'title';
  if (state === 'win') return 'win';
  if (state === 'glide') return 'glide';
  if (!world) return null;
  if (world.bosses && world.bosses.some(b => b.active && !b.dead)) return 'boss';
  return 'w' + world.num;
}
function audioFrame(){
  if (!AC || AC.state !== 'running') return;
  playMusic(desiredMusic());
  musicTick();
  const talking = isSpeaking();
  let duck = talking ? 0.3 : 1;
  if (state === 'quiz') duck *= 0.55;
  if (state === 'dead') duck *= 0.35;
  updateMusicVolume(duck);
  const drive = !!world && world.mode === 'drive' && state === 'play';
  setEngine(drive, drive ? clamp(Math.abs(player.driveV) / (DRIVE_BASE * player.speedMult), 0, 1) : 0);
  setWind(state === 'glide');
  ambBus.gain.setTargetAtTime(talking ? 0.45 : 1, AC.currentTime, 0.2);
}

function render(dt){
  updateFxParts(dt);
  let ox = 0, oy = 0;
  if (shakeT > 0){
    shakeT = Math.max(0, shakeT - dt);
    ox = Math.round((Math.random() * 2 - 1) * shakeAmp);
    oy = Math.round((Math.random() * 2 - 1) * shakeAmp);
    shakeAmp *= Math.pow(0.02, dt);
  }
  CX = Math.round(camX / 2) + ox;
  CY = Math.round(camY / 2) + oy;
  if (state === 'title') drawTitle();
  else if (state === 'glide' && glide) drawGlide();
  else if (world){
    drawWorld();
    if (state === 'quiz' && quiz) drawQuiz();
    else if (state === 'dead') drawDead();
    else if (state === 'win') drawWin();
  }
  drawTransition(dt);
  present();
}

let lastTime = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.033, (now - lastTime) / 1000 || 0.016);
  lastTime = now; lastDt = dt;
  gameT += dt;
  stateT += dt;
  pollInput();

  // Test: F5 = Welt zurück, F6 = Welt vor (Upgrades werden passend gesetzt)
  if (pressedKeys['F5']) debugJumpWorld(-1);
  else if (pressedKeys['F6']) debugJumpWorld(1);

  if (state === 'title'){
    if (inp.confirmP || pressedKeys['KeyA']) startGame();   // „Drücke A“: Controller-A oder Taste A
  }
  else if (state === 'play'){
    if (world.mode === 'drive'){
      updateDrive(dt);
      if (state === 'play'){
        updateDriveArrows(dt);
        updateCoins(dt);
        updateWorldObjects(dt);
      }
    } else {
      updatePlayer(dt);
      if (state === 'play'){
        updateEnemies(dt);
        updateBosses(dt);
        updateArrows(dt);
        updateShocks(dt);
        updateLasers();
        updateCoins(dt);
        updateWorldObjects(dt);
      }
    }
    updateFx(dt);
    if (world && world.mode === 'drive'){
      camX = lerp(camX, clamp(player.x - W * 0.3, 0, world.w - W), 1 - Math.pow(0.001, dt));
      camY = 0;
    } else if (world){
      camX = lerp(camX, clamp(player.x + player.w / 2 - W / 2, 0, world.w - W), 1 - Math.pow(0.001, dt));
      camY = lerp(camY, clamp(player.y - H * 0.55, world.top, world.killY - H + 100), 1 - Math.pow(0.001, dt));
    }
    if (pressedKeys['KeyR']) { state = 'title'; }
  }
  else if (state === 'quiz'){
    updateFx(dt);
    if (quiz) updateQuiz(dt);
  }
  else if (state === 'glide'){
    updateGlide(dt);
    updateFx(dt);
  }
  else if (state === 'dead'){
    updateFx(dt);
    if (stateT > 2){
      respawn();
      state = 'play';
    }
  }
  else if (state === 'win'){
    if (stateT > 1.5 && inp.confirmP){ state = 'title'; stateT = 0; }
  }

  trackPlayerFx(dt);
  render(dt);
  audioFrame();
  clearPressed();
}
initArt();
requestAnimationFrame(loop);
</script>
